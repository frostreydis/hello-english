<style>
:root{
  --bg:#f6f7fb; --card:#fff; --text:#1d2433; --muted:#667085; --line:#e4e7ee;
  --blue:#1d4ed8; --blue-soft:#e8effd; --red:#dc2626; --red-soft:#fdecec;
  --green:#12805c; --green-soft:#e6f6ef; --amber:#b25e09; --amber-soft:#fff4e5;
  --radius:14px; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10141c; --card:#181e29; --text:#e7eaf0; --muted:#98a2b3; --line:#2a3242;
    --blue:#8ab4f8; --blue-soft:#1b2a42; --red:#ff6b6b; --red-soft:#3a1d22;
    --green:#4cc38a; --green-soft:#16302a; --amber:#f0a44b; --amber-soft:#35281a;}
  /* У темній темі синій світлий, і білий текст на ньому майже не читається */
  .btn.primary,.subtabs button.active,.seg button.active{color:#0b1220}
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
a{color:var(--blue)}
h1,h2,h3,h4{line-height:1.25;margin:.2em 0 .5em}
h1{font-size:1.55rem} h2{font-size:1.3rem} h3{font-size:1.1rem} h4{font-size:1rem}
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:8px 16px}
.brand{font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo{display:inline-block;flex:none;width:30px;height:16px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.logo svg{display:block;width:100%;height:100%}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--muted);white-space:nowrap;font-weight:500}
nav.tabs a.active{background:var(--blue-soft);color:var(--blue)}
nav.tabs a .lbl-s{display:none}
main{max-width:1180px;margin:0 auto;padding:18px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin:0 0 14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.muted{color:var(--muted)} .small{font-size:.88rem} .center{text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:10px;font:inherit;font-weight:500;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.small{padding:4px 10px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--blue-soft);color:var(--blue)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.gray{background:var(--line);color:var(--muted)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#3b82f6);border-radius:99px}
.stat{font-size:1.6rem;font-weight:700}
.say{color:var(--blue);font-weight:600;cursor:pointer;border-bottom:1px dashed transparent}
.say::after{content:" 🔊";font-size:.75em;opacity:.55}
.nosay .say::after,.dict-en .say::after,.dict-ex .say::after{content:""}
table{border-collapse:collapse;width:100%;margin:8px 0 12px;font-size:.95rem}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:var(--blue-soft);font-weight:600}
.tblwrap{overflow-x:auto}
.note{background:var(--amber-soft);border-left:4px solid var(--amber);padding:10px 14px;border-radius:8px;margin:10px 0}
.tip{background:var(--blue-soft);border-left:4px solid var(--blue);padding:10px 14px;border-radius:8px;margin:10px 0}
.good{background:var(--green-soft);border-left:4px solid var(--green);padding:10px 14px;border-radius:8px;margin:10px 0}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.subtabs button{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:6px 12px;border-radius:99px;font:inherit;cursor:pointer}
.subtabs button.active{background:var(--blue);border-color:var(--blue);color:#fff}
ul.check{list-style:none;padding-left:0} ul.check li{padding:3px 0 3px 26px;position:relative}
ul.check li::before{content:"✓";position:absolute;left:4px;color:var(--green);font-weight:700}
.lesson-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin:6px 0;background:var(--card);text-decoration:none;color:var(--text)}
.lesson-item .num{font-weight:700;color:var(--blue);min-width:40px}
.ex-box{max-width:640px;margin:0 auto}
.ex-q{font-size:1.15rem;margin:6px 0 14px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--text);padding:11px 14px;border-radius:12px;font:inherit;cursor:pointer}
.opt.ok{border-color:var(--green);background:var(--green-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
input[type=text],input[type=number],input[type=search],select,textarea{font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);width:100%}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--blue)}
input.ok{border-color:var(--green);background:var(--green-soft)} input.bad{border-color:var(--red);background:var(--red-soft)}
.tokens{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;padding:8px;border:1.5px dashed var(--line);border-radius:12px;margin:6px 0}
.tok{padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:var(--blue-soft);color:var(--text);cursor:pointer;font:inherit}
.feedback{margin-top:12px;padding:10px 14px;border-radius:10px}
.feedback.ok{background:var(--green-soft)} .feedback.bad{background:var(--red-soft)} .feedback.near{background:var(--amber-soft)}
.flash{min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.flash .front{font-size:1.7rem;font-weight:700}
.flash .back{font-size:1.25rem}
.srs-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.srs-btns .btn{justify-content:center;flex-direction:column;gap:0}
.srs-btns small{font-weight:400;color:var(--muted);font-size:.75rem}
.big-phrase{font-size:1.5rem;font-weight:700;color:var(--blue);margin:6px 0}
.timer{font-variant-numeric:tabular-nums;font-size:1.4rem;font-weight:700}
details.stage{margin:0 0 12px}
details.stage>summary{cursor:pointer;list-style:none}
details.stage>summary::-webkit-details-marker{display:none}
details.mod{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0;background:var(--card)}
details.mod>summary{cursor:pointer;font-weight:600}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;margin-top:8px}
.kv b{color:var(--muted);font-weight:600}
.done-mark{color:var(--green);font-weight:700}
.week-plan td:first-child{white-space:nowrap;font-weight:600}
.today-row{background:var(--blue-soft)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:.95}
/* Підсвітка при наведенні лише там, де є миша: на сенсорному екрані вона «залипає» після дотику */
@media (hover:hover){
  .btn:hover,.lesson-item:hover,.opt:hover:not(:disabled),.ic:hover{border-color:var(--blue)}
  .btn.primary:hover{filter:brightness(1.08)}
  .say:hover{border-bottom-color:var(--blue)}
}
@media (pointer:coarse){.kbd{display:none}}
.lc-more{margin-top:8px}
.lc-more>summary{cursor:pointer;padding:4px 0}
.lc-more>.row{margin-top:4px!important}
.update-bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:10px;background:var(--card);color:var(--text);border:1px solid var(--blue);border-radius:12px;padding:8px 10px 8px 14px;box-shadow:0 4px 16px rgba(16,24,40,.18);max-width:calc(100% - 24px)}
.warn-banner{background:var(--amber-soft);border:1px solid var(--amber);color:var(--text);padding:8px 12px;border-radius:10px;margin-bottom:12px;font-size:.92rem}
/* Вісім вкладок із повними підписами вміщаються не на кожному екрані, а ширина залежить від шрифту й емодзі системи.
   Тому views2.js → fitNav вимірює навігацію: тісно — компактні вкладки (як на телефоні), все одно тісно — без назви біля логотипа */
@media (min-width:701px){
  header.nav-compact nav.tabs a{display:flex;flex-direction:column;align-items:center;padding:4px 8px;font-size:.85rem;line-height:1.25}
  header.nav-compact nav.tabs a .lbl{display:none}
  header.nav-compact nav.tabs a .lbl-s{display:block;font-size:.72rem}
  header.nav-tight .brand-name{display:none}
}
@media (max-width:700px){
  body{font-size:15.5px}
  .top-inner{padding:8px 12px}
  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;z-index:30}
  nav.tabs a{flex:1;min-width:0;padding:6px 2px;font-size:.78rem;display:flex;flex-direction:column;align-items:center}
  nav.tabs a .lbl{display:none}
  nav.tabs a .lbl-s{display:block;font-size:.68rem}
  .kv{grid-template-columns:1fr}
  .srs-btns{grid-template-columns:repeat(2,1fr)}
  .card{padding:14px}
  h1{font-size:1.3rem}
  main{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .update-bar{bottom:calc(76px + env(safe-area-inset-bottom))}
  /* Шапка уроку: мета видна лише на теорії, вкладки — одним рядком із прокруткою, щоб вправа була на першому екрані */
  .lesson-head:not(.tab-theory) .lesson-goals{display:none}
  .subtabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-bottom:4px}
  .subtabs button{flex:none}
  /* «Програма» на телефоні відкривається з «Уроків»: восьма вкладка в нижній навігації не вміщується */
  nav.tabs a.wide-only{display:none}
  .dict-row{flex-wrap:wrap}
  .dict-actions{width:100%;justify-content:flex-start}
  .ic{min-width:44px;height:40px}
}
.ipa{font-family:"Segoe UI","Lucida Sans Unicode","Arial Unicode MS",system-ui,sans-serif;color:var(--muted);font-size:.92em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--muted);padding:6px 10px;font:inherit;font-size:.9rem;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.active{background:var(--blue);color:#fff}
.row.nowrap{flex-wrap:nowrap}
label.small.muted>input,label.small.muted>.row{margin-top:3px}
label.small.muted{display:block}
.dict-row{display:flex;align-items:flex-start;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.dict-row:last-child{border-bottom:0}
.dict-row.flash-row{background:var(--blue-soft);border-radius:10px;transition:background .3s}
.dict-row.editing{display:block}
.dict-main{flex:1;min-width:0}
.dict-en{font-size:1.08rem}
.dict-en .pill{font-size:.72rem;vertical-align:middle}
.dict-uk{margin-top:2px}
.dict-ex{margin-top:3px;font-style:italic}
.dict-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.dict-edit input{margin-top:3px}
.ic{min-width:38px;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);font:inherit;cursor:pointer;padding:0 6px}
.card.inner{box-shadow:none;margin-top:12px;background:var(--bg)}
.file-btn{position:relative}
code{background:var(--blue-soft);padding:1px 5px;border-radius:5px;font-size:.88em}
.flash .ipa{font-size:1rem}
.theory h3{margin-top:1.1em}
@media print{
  header.top,nav.tabs,.btn,.subtabs,.no-print{display:none!important}
  body{background:#fff;color:#000} .card{box-shadow:none;border-color:#ccc}
  details{display:block} details>*{display:block}
  main{padding:0}
}

<script>
/* Hello, English — тренажер англійської: стан, озвучення, запис, перевірка відповідей, інтервальне повторення, мій словник */
window.EN = window.EN || {};
(function (EN) {
  'use strict';

  // Увесь прогрес лежить у localStorage сайту під цим ключем. Ключ НЕ змінювати: інакше збережений прогрес не відкриється.
  // Він відрізняється від ключа словацького тренажера (sk-trainer-v1): сайти GitHub Pages одного акаунта мають спільне сховище.
  const STORE_KEY = 'en-trainer-v1';
  const VERSION = 1;   // версія схеми стану: змінили формат → +1 і крок у MIGRATIONS
  const DEFAULTS = {
    v: VERSION,
    start: null,
    settings: { accent: 'us', voice: '', rate: 0.9, strict: false, newPerDay: 10, dir: 'mix', autoIpa: true },
    lessons: {},   // id -> {opened, theory, ex:{best,done}, speak, mission, skipped, run}
    modules: {},   // id модуля програми -> true (ручні позначки; зараз усі етапи мають уроки)
    cards: {},     // id картки -> {due,int,ease,reps,lapses}
    dict: [],      // мій словник [{en, uk, note, ex, ipa, au:{us,gb,au}, added}]
    days: {},      // номер дня -> {ex, cards, speak}
    newDay: { day: 0, count: 0 },
    ui: { installTip: true, dictSort: 'new' }
  };
  // MIGRATIONS[n](s) переводить стан версії n у версію n + 1 (змінює s на місці)
  const MIGRATIONS = {};
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const UNSAFE = new Set(['__proto__', 'constructor', 'prototype']);
  function merge(base, extra) {
    for (const k of Object.keys(extra || {})) {
      if (UNSAFE.has(k)) continue;
      if (extra[k] && typeof extra[k] === 'object' && !Array.isArray(extra[k]) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) merge(base[k], extra[k]);
      else base[k] = extra[k];
    }
    return base;
  }
  function migrate(s) {
    s.v = Math.floor(+s.v) || 1;
    while (s.v < VERSION && MIGRATIONS[s.v]) { MIGRATIONS[s.v](s); s.v++; }
    return s;
  }
  // Записи словника приходять і з файлів імпорту, тож їх приводимо до рядків розумної довжини
  const str = (v, max) => String(v == null ? '' : v).replace(/\s+/g, ' ').trim().slice(0, max);
  // Записи носіїв — лише з відомих адрес: інакше файл імпорту міг би підсунути довільну адресу для <audio>
  const AUDIO_OK = /^https:\/\/(api\.dictionaryapi\.dev\/media\/|ssl\.gstatic\.com\/dictionary\/|upload\.wikimedia\.org\/)[^\s"'<>]+\.(mp3|ogg|wav)$/i;
  EN.cleanWord = function (w) {
    if (!w || typeof w !== 'object') return null;
    const out = { en: str(w.en, 200), uk: str(w.uk, 300) };
    if (!out.en || !out.uk) return null;
    const note = str(w.note, 300), ex = str(w.ex, 500), ipa = str(w.ipa, 100), added = str(w.added, 10);
    if (note) out.note = note;
    if (ex) out.ex = ex;
    if (ipa) out.ipa = ipa;
    if (/^\d{4}-\d{2}-\d{2}$/.test(added)) out.added = added;
    if (w.au && typeof w.au === 'object') {
      const au = {};
      for (const k of ['us', 'gb', 'au']) if (typeof w.au[k] === 'string' && AUDIO_OK.test(w.au[k])) au[k] = w.au[k];
      if (Object.keys(au).length) out.au = au;
    }
    return out;
  };
  EN.cleanCard = function (c) {
    if (!c || typeof c !== 'object') return null;
    const int = (v, lo, hi) => Math.min(hi, Math.max(lo, Math.round(+v) || 0));
    const due = Math.round(+c.due);
    if (!isFinite(due)) return null;
    return { due, int: int(c.int, 0, 36500), ease: Math.min(5, Math.max(1.3, +c.ease || 2.5)), reps: int(c.reps, 0, 100000), lapses: int(c.lapses, 0, 100000) };
  };
  // Ключ однакового слова: регістр, апострофи й зайві пробіли не роблять його новим словом
  EN.dictKey = (en) => String(en).toLowerCase().replace(/[’‘`´]/g, "'").replace(/\s+/g, ' ').trim();
  // Налаштування й словник потрапляють у розмітку, тож вони мають бути саме числами, відомими рядками й чистими записами
  function tidy(s) {
    const st = s.settings;
    if (!['us', 'gb'].includes(st.accent)) st.accent = 'us';
    st.voice = String(st.voice || '');
    st.rate = Math.min(1.2, Math.max(0.5, +st.rate || 0.9));
    st.strict = !!st.strict;
    st.autoIpa = st.autoIpa !== false;
    st.newPerDay = Math.min(50, Math.max(0, Math.round(+st.newPerDay) || 0));
    if (!['mix', 'en', 'uk'].includes(st.dir)) st.dir = 'mix';
    if (!['new', 'az', 'due'].includes(s.ui.dictSort)) s.ui.dictSort = 'new';
    const seen = new Set();
    s.dict = (Array.isArray(s.dict) ? s.dict : []).map(EN.cleanWord).filter((w) => w && !seen.has(EN.dictKey(w.en)) && seen.add(EN.dictKey(w.en)));
    return s;
  }
  // newer — прогрес записала новіша версія тренажера: тоді нічого не записуємо, щоб старий код його не зіпсував;
  // broken — збережене не вдалося прочитати; failed — останній запис не вдався
  EN.store = { key: STORE_KEY, newer: false, broken: null, failed: null };
  function load() {
    let raw = null;
    try { raw = localStorage.getItem(STORE_KEY); } catch (e) { EN.store.broken = e; console.warn('Сховище недоступне', e); return clone(DEFAULTS); }
    if (!raw) return clone(DEFAULTS);
    try {
      const data = JSON.parse(raw);
      if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('не об\'єкт');
      EN.store.newer = (+data.v || 1) > VERSION;
      return tidy(merge(clone(DEFAULTS), migrate(data)));
    } catch (e) {
      // Наступне збереження затерло б пошкоджений запис, тому копія лишається поруч для ручного відновлення
      EN.store.broken = e;
      console.warn('Не вдалося прочитати прогрес; копію збережено під ключем ' + STORE_KEY + '-broken', e);
      try { localStorage.setItem(STORE_KEY + '-broken', raw); } catch (e2) { console.warn(e2); }
      return clone(DEFAULTS);
    }
  }
  EN.S = load();
  let warnedAt = 0;
  EN.save = function () {
    if (EN.store.newer) return;
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(EN.S));
      EN.store.failed = null;
    } catch (e) {
      EN.store.failed = e;
      console.warn('Прогрес не збережено', e);
      if (Date.now() - warnedAt > 60000 && document.body) {
        warnedAt = Date.now();
        EN.toast('⚠️ Прогрес не зберігся (' + (e && e.name || e) + '). Подробиці — у ⚙️ «Налаштування».', 6000);
      }
    }
  };
  // Зберігається завжди весь стан, тож без перечитування наступне збереження тут затерло б те, що записала
  // інша вкладка чи встановлений додаток. Екран перемальовує EN.onExternalChange (views2.js).
  window.addEventListener('storage', (e) => {
    if (e.key !== STORE_KEY && e.key !== null) return;   // null — сховище сайту очистили повністю
    EN.S = load();
    if (EN.onExternalChange) EN.onExternalChange();
  });

  // persisted: true — Chrome не видалить дані сайту сам, навіть коли забракне місця; false — може; null — невідомо.
  // Chrome вирішує без запитання: зазвичай дозволяє встановленим додаткам, закладкам і сайтам, якими часто користуються.
  EN.Storage = {
    persisted: null, listeners: [],
    async check(ask) {
      const st = navigator.storage;
      if (!st || !st.persisted) return this.persisted;
      try {
        let p = await st.persisted();
        if (!p && ask && st.persist) p = await st.persist();
        this.persisted = !!p;
      } catch (e) { this.persisted = null; }
      this.listeners.forEach((f) => f());
      return this.persisted;
    }
  };
  EN.isInstalled = () => !!(window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  // Chrome віддає подію beforeinstallprompt один раз; зберігаємо її, щоб кнопка «Встановити» спрацювала пізніше
  EN.Install = {
    prompt: null, listeners: [],
    notify() { this.listeners.forEach((f) => f()); },
    async run() {
      const p = this.prompt; if (!p) return;
      this.prompt = null;
      p.prompt();
      try { await p.userChoice; } catch (e) { console.warn(e); }
      this.notify();
    }
  };
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); EN.Install.prompt = e; EN.Install.notify(); });
  window.addEventListener('appinstalled', () => { EN.Install.prompt = null; EN.Storage.check(true); EN.Install.notify(); });
  EN.replaceState = function (obj) { EN.S = tidy(merge(clone(DEFAULTS), obj)); EN.save(); };
  EN.resetState = function () { EN.S = clone(DEFAULTS); EN.save(); };
  // Часткові скидання зберігають налаштування і мій словник
  EN.resetLessons = function () { EN.S.lessons = {}; EN.S.modules = {}; EN.save(); };
  EN.resetWords = function () { EN.S.cards = {}; EN.S.newDay = { day: 0, count: 0 }; EN.save(); };

  // Номер дня рахується за місцевим часом: інакше заняття о пів на першу ночі потрапляло б у вчорашній день
  EN.today = function () {
    const d = new Date();
    return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000);
  };
  EN.dayOfWeek = function (dayNum) { return new Date(dayNum * 86400000).getUTCDay(); }; // 0 = неділя
  EN.isoDay = (dayNum) => new Date(dayNum * 86400000).toISOString().slice(0, 10);
  EN.logActivity = function (kind, n) {
    const t = EN.today();
    const d = EN.S.days[t] || (EN.S.days[t] = { ex: 0, cards: 0, speak: 0 });
    d[kind] = (d[kind] || 0) + (n || 1);
    if (!EN.S.start) EN.S.start = t;
    EN.save();
  };
  // Вихідні не розривають серію: навчання заплановано лише на робочі дні
  EN.streak = function () {
    const t = EN.today();
    let day = t, count = 0;
    if (!EN.S.days[t]) day = t - 1;
    for (let i = 0; i < 800; i++, day--) {
      const active = !!EN.S.days[day];
      const wd = EN.dayOfWeek(day);
      if (active) count++;
      else if (wd === 0 || wd === 6) continue;
      else break;
    }
    return count;
  };

  EN.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  EN.shuffle = function (a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }

  };
  // [[текст]] або [[текст|що озвучити]] → клікабельний англійський фрагмент. Лише для даних уроків: вони вже є HTML
  EN.rich = function (html) {
    return String(html || '').replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, shown, said) =>
      '<span class="say" data-say="' + EN.esc(String(said || shown).replace(/<[^>]+>/g, '')) + '">' + shown + '</span>');
  };
  // Для тексту, який увів учень (мій словник, імпорт), екрануються і показане, і озвучуване
  EN.sayHtml = (shown, said) => '<span class="say" data-say="' + EN.esc(said == null ? shown : said) + '">' + EN.esc(shown) + '</span>';
  // Примітки в дужках не озвучуються, а «flat / apartment» звучить як перелік
  EN.sayText = (s) => String(s).replace(/\s\/\s/g, ', ').replace(/\s*\([^)]*\)/g, '').trim();
  EN.toast = function (msg, ms) {
    let el = document.getElementById('toast');
    if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
    el.textContent = msg; el.classList.add('show');
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), ms || 2200);
  };
  // Телефон чи планшет: там екранна клавіатура закриває пів екрана, а підказки про клавіші не мають сенсу
  EN.touch = () => !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);

  // Регістр і розділові знаки не важливі; дефіс = пробіл (twenty-five = twenty five)
  EN.norm = (s) => String(s).toLowerCase().replace(/[’‘`´]/g, "'").replace(/[.,!?;:"„“”«»()…–—-]/g, ' ').replace(/\s+/g, ' ').trim();
  // Британський і американський правопис зараховуються однаково (colour = color, organise = organize).
  // Заміни роблять з обох боків, тому «promise» → «promize» нічого не ламає. -our лише за списком: інакше four = for
  function spelling(s) {
    return s
      .replace(/\bpractise(s|d)?\b/g, 'practice$1').replace(/\blicence(s?)\b/g, 'license$1')
      .replace(/\bdefence(s?)\b/g, 'defense$1').replace(/\boffence(s?)\b/g, 'offense$1')
      .replace(/\b(colo|favo|flavo|hono|humo|labo|neighbo|behavio|harbo|rumo|savo|vapo|armo|odo|endeavo|parlo|tumo|vigo)ur/g, '$1r')
      .replace(/\b(cent|theat|met|lit|fib|kilomet|centimet|millimet|calib|somb|spect|lust|meag)re(s|d)?\b/g, '$1er$2')
      .replace(/\b(\w{2,})is(e|es|ed|er|ers|ing|ation|ations)\b/g, '$1iz$2')
      .replace(/\b(\w{2,})ys(e|es|ed|ing)\b/g, '$1yz$2')
      .replace(/\b(travel|cancel|label|model|fuel|level|signal|marvel|quarrel|counsel|dial|equal|total|jewel)l(ed|ing|er|ers|ous)\b/g, '$1$2')
      .replace(/\bjewellery\b/g, 'jewelry').replace(/\bgrey\b/g, 'gray').replace(/\bprogramme(s?)\b/g, 'program$1')
      .replace(/\bmum(s?)\b/g, 'mom$1').replace(/\bmaths\b/g, 'math').replace(/\bcatalogue\b/g, 'catalog');
  }
  // Скорочення розгортаються (I'm = I am, don't = do not). Неоднозначні 's і 'd дають варіанти (is / has, would / had).
  // 's розгортаємо лише після займенників: у «John's car» це присвійний відмінок
  const S_WORDS = 'he|she|it|that|there|here|what|where|who|how|when|why|this|everything|nothing|something|everyone|someone|nobody|everybody|somebody';
  function forkAll(list, re, a, b) {
    const out = [];
    for (const x of list) {
      let res = [''];
      let last = 0;
      for (const m of x.matchAll(re)) {
        const head = x.slice(last, m.index) + m[1] + ' ';
        res = res.flatMap((r) => [r + head + a, r + head + b]).slice(0, 8);
        last = m.index + m[0].length;
      }
      res.forEach((r) => out.push(r + x.slice(last)));
    }
    return out.slice(0, 16);
  }
  function variants(s) {
    s = s.replace(/\bwon't\b/g, 'will not').replace(/\bcan't\b/g, 'cannot').replace(/\bshan't\b/g, 'shall not').replace(/\bcan not\b/g, 'cannot')
      .replace(/n't\b/g, ' not').replace(/'m\b/g, ' am').replace(/'re\b/g, ' are').replace(/'ve\b/g, ' have').replace(/'ll\b/g, ' will')
      .replace(/\blet's\b/g, 'let us');
    // У пропуск після займенника учень вписує й саме скорочення: «I ___ been waiting» → «'d been waiting»
    let out = /^'s\b/.test(s) ? [s.replace(/^'s/, 'is'), s.replace(/^'s/, 'has')] : /^'d\b/.test(s) ? [s.replace(/^'d/, 'would'), s.replace(/^'d/, 'had')] : [s];
    out = forkAll(out, new RegExp("\\b(" + S_WORDS + ")'s\\b", 'g'), 'is', 'has');
    out = forkAll(out, /\b(i|you|he|she|it|we|they|there|that)'d\b/g, 'would', 'had');
    return out.map((x) => x.replace(/'/g, '').replace(/\s+/g, ' ').trim());
  }
  function canon(s, exact) {
    const n = spelling(EN.norm(s));
    return exact ? [n] : variants(n);
  }
  // Одна описка (пропущена, зайва, змінена чи переставлена буква) у слові з 6+ літер, коли останні дві літери збігаються:
  // так «beatiful» — майже, а «work» замість «works» чи «studies» замість «studied» — помилка граматики, а не описка
  function oneTypo(a, b) {
    if (a === b || Math.min(a.length, b.length) < 5 || Math.max(a.length, b.length) < 6 || Math.abs(a.length - b.length) > 1) return false;
    if (a.slice(-2) !== b.slice(-2)) return false;
    let i = 0;
    while (i < a.length && a[i] === b[i]) i++;
    if (a.length === b.length) {
      if (a.slice(i + 1) === b.slice(i + 1)) return true;
      return a[i] === b[i + 1] && a[i + 1] === b[i] && a.slice(i + 2) === b.slice(i + 2);
    }
    const [l, s] = a.length > b.length ? [a, b] : [b, a];
    return l.slice(i + 1) === s.slice(i);
  }
  function near(x, y) {
    const a = x.split(' '), b = y.split(' ');
    if (a.length !== b.length) return false;
    let diff = 0;
    for (let k = 0; k < a.length; k++) if (a[k] !== b[k]) { if (++diff > 1 || !oneTypo(a[k], b[k])) return false; }
    return diff === 1;
  }
  // 'ok' | 'near' (одна описка: зараховується, якщо не ввімкнено суворий режим) | 'bad'.
  // exact — для вправ на правопис і скорочення: без розгортання скорочень і без допуску на описку
  EN.check = function (input, answers, exact) {
    const list = Array.isArray(answers) ? answers : [answers];
    if (!EN.norm(input)) return 'bad';
    const inp = canon(input, exact);
    const ans = list.flatMap((a) => canon(a, exact));
    if (inp.some((x) => ans.includes(x))) return 'ok';
    if (!exact && inp.some((x) => ans.some((y) => near(x, y)))) return 'near';
    return 'bad';
  };

  // Два рушії озвучення: 1) англійський голос системи (Web Speech API, є майже всюди й працює офлайн);
  // 2) онлайн-голос Google (потрібен інтернет) — коли голосу потрібного акценту в системі немає або учень вибрав його сам
  const ONLINE = '@online';   // значення settings.voice для онлайн-голосу; '' — вибір автоматично
  const LANG = { us: 'en-US', gb: 'en-GB' };
  const ONLINE_URLS = [       // друга адреса — запасна, якщо перша не відповіла
    (q, tl) => 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=' + tl + '&q=' + encodeURIComponent(q),
    (q, tl) => 'https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=' + tl + '&q=' + encodeURIComponent(q)
  ];
  // Онлайн-сервіс приймає до ~200 символів за запит: ріжемо за реченнями, а задовгі речення — між словами
  EN.ttsChunks = function (text, max) {
    const out = [];
    let cur = '';
    for (const w of String(text).replace(/\s+/g, ' ').trim().split(' ')) {
      if (cur && (cur + ' ' + w).length > max) { out.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w;
      if (/[.!?…]$/.test(cur) && cur.length > max / 2) { out.push(cur); cur = ''; }
    }
    if (cur) out.push(cur);
    return out;
  };
  // Нейронні голоси (Edge «Natural», Google, Apple «Premium / Enhanced») звучать набагато природніше за старі системні
  const quality = (v) => (/natural|neural/i.test(v.name) ? 3 : /google|premium|enhanced|siri/i.test(v.name) ? 2 : v.localService ? 1 : 0);
  const accentOf = (v) => (/^en[-_](gb|uk)/i.test(v.lang) ? 'gb' : /^en[-_]us/i.test(v.lang) ? 'us' : 'other');
  EN.TTS = {
    ONLINE, LANG,
    voices: [],
    ready: false, settled: false, listeners: [],
    system: 'speechSynthesis' in window,
    audio: null,
    token: 0,                 // події застарілого озвучення (після нового say) мають ігноруватися
    accentOf,
    init() {
      const notify = () => this.listeners.forEach((f) => f());
      window.addEventListener('online', notify);
      window.addEventListener('offline', notify);
      if (!this.system) { this.ready = this.settled = true; notify(); return; }
      const load = () => {
        this.voices = speechSynthesis.getVoices().filter((v) => v && v.lang && /^en([-_]|$)/i.test(v.lang) && v.name && v.name !== 'undefined')
          .sort((a, b) => quality(b) - quality(a));

        notify();

      speechSynthesis.onvoiceschanged = load;
      setTimeout(() => { this.settled = true; load(); }, 1500);
    },
    // Голос системи для акценту (us | gb), яким говоримо зараз, або null — тоді говорить онлайн-голос
    voice(accent) {
      const v = this.voices, want = EN.S.settings.voice;
      accent = accent || EN.S.settings.accent;
      if (accent === EN.S.settings.accent) {
        if (want === ONLINE) return null;
        // Вибраний голос іншого акценту не має «перебивати» акцент: 🇬🇧 мусить звучати по-британськи
        const chosen = v.find((x) => x.name === want);
        if (chosen && accentOf(chosen) !== (accent === 'gb' ? 'us' : 'gb')) return chosen;
      }
      return v.find((x) => accentOf(x) === accent) || null;
    },
    label(accent) { const v = this.voice(accent); return v ? v.name : 'Google — ' + ((accent || EN.S.settings.accent) === 'gb' ? 'британська' : 'американська') + ' вимова, онлайн'; },
    // true — озвучити нічим: англійського голосу в системі немає, а інтернету для онлайн-голосу теж немає
    silent() { return this.settled && !this.voices.length && navigator.onLine === false; },
    stop() {

      if (this.audio) this.audio.pause();

    // accent — 'us' | 'gb', щоб послухати слово з іншим акцентом; без нього — з налаштувань
    say(text, rate, accent) {
      if (!text) return;
      this.stop();
      rate = rate || EN.S.settings.rate || 0.9;
      accent = accent || EN.S.settings.accent;
      const v = this.voice(accent);
      if (v) this.sayLocal(text, rate, v); else this.sayOnline(text, rate, accent);

    sayLocal(text, rate, v) {

    sayOnline(text, rate, accent) {
      const parts = EN.ttsChunks(text, 180), token = this.token, tl = LANG[accent] || 'en-US';
      // Один <audio> на всю сесію: Safari дозволяє вже «розблокованому» елементу грати без нового натискання
      const a = this.audio || (this.audio = new Audio());

        a.play().catch((e) => { if (token === this.token && e && e.name === 'NotAllowedError') EN.toast('Натисніть 🔊, щоб послухати'); });

        EN.toast('🔇 Онлайн-голос недоступний (немає інтернету?), а англійського голосу в системі немає. Див. ⚙️ «Налаштування».');

    playUrl(url, rate) {

  EN.Rec = {

    stop() { if (this.mr && this.mr.state !== 'inactive') this.mr.stop(); },
    active() { return !!(this.mr && this.mr.state === 'recording'); }
  };

  EN.recorderWidget = function (container) {
    if (!EN.Rec.supported) {
      container.innerHTML = '<span class="small muted">Запис голосу недоступний у цьому браузері.</span>';
      return;
    }
    container.innerHTML = '<button class="btn rec-btn">● Записати себе</button> <audio class="rec-audio" controls style="display:none;vertical-align:middle;max-width:260px"></audio>';
    const btn = container.querySelector('.rec-btn');
    const audio = container.querySelector('.rec-audio');
    btn.onclick = () => {
      if (EN.Rec.active()) { EN.Rec.stop(); return; }
      EN.Rec.start((url) => {
        btn.textContent = '● Записати ще раз';
        audio.src = url; audio.style.display = '';
        EN.logActivity('speak');
      }, (e) => {
        btn.textContent = '● Записати себе';
        EN.toast('Немає доступу до мікрофона: ' + (e && e.name ? e.name : e));
      });
      btn.textContent = '■ Зупинити запис';
    };
  };

  EN.lessons = EN.lessons || [];
  EN.lessonById = (id) => EN.lessons.find((l) => l.id === id);
  EN.lessonState = function (id) { return EN.S.lessons[id] || (EN.S.lessons[id] = {}); };
  // Стан уроку: {opened, theory, ex:{best,done}, speak, mission, skipped, run}
  //   done    — вправи виконано на ≥ 80%;  skipped — учень пропустив урок («вже знаю» / «почати з іншого уроку»);
  //   run     — незавершений підхід до вправ (див. exercises.js), щоб продовжити пізніше
  EN.lessonDone = (id) => !!(EN.S.lessons[id] && EN.S.lessons[id].ex && EN.S.lessons[id].ex.done);
  EN.lessonSkipped = (id) => !!(EN.S.lessons[id] && EN.S.lessons[id].skipped) && !EN.lessonDone(id);
  EN.lessonClosed = (id) => EN.lessonDone(id) || EN.lessonSkipped(id);
  EN.currentLesson = function () { return EN.lessons.find((l) => !EN.lessonClosed(l.id)) || EN.lessons[EN.lessons.length - 1]; };
  EN.skipLesson = function (id, on) { const st = EN.lessonState(id); if (on) st.skipped = true; else delete st.skipped; EN.save(); };
  // «Пройти наново» скидає позначки й вправи, але слова уроку лишаються в повторенні
  EN.resetLesson = function (id) { const st = EN.lessonState(id); ['theory', 'ex', 'speak', 'mission', 'skipped', 'run'].forEach((k) => delete st[k]); EN.save(); };
  EN.startFrom = function (id) {
    for (const l of EN.lessons) { if (l.id === id) break; if (!EN.lessonDone(l.id)) EN.lessonState(l.id).skipped = true; }
    delete EN.lessonState(id).skipped;
    EN.save();
  };

  EN.cardId = (lessonId, en) => lessonId + '|' + en;
  // Слова з уроків, які учень уже відкривав, + мій словник. only: 'my' — лише мій словник
  // Слово, що є в кількох уроках, — одна картка з id за першим уроком, де воно з'являється. Так id не залежить від того,
  // який урок учень відкрив першим, і прогрес слова не губиться
  let firstOf = null;
  const firstLesson = (en) => {
    if (!firstOf) {
      firstOf = new Map();
      EN.lessons.forEach((l) => (l.vocab || []).forEach((w) => { const k = w[0].toLowerCase(); if (!firstOf.has(k)) firstOf.set(k, [l.id, w[0]]); }));
    }
    return firstOf.get(en.toLowerCase());
  };
  EN.allWords = function (only) {
    const out = [], seen = new Set();
    if (only !== 'my') EN.lessons.forEach((l) => {
      if (!(EN.S.lessons[l.id] && EN.S.lessons[l.id].opened)) return;
      (l.vocab || []).forEach((w) => {
        const [lid, en] = firstLesson(w[0]) || [l.id, w[0]], id = EN.cardId(lid, en);
        if (seen.has(id)) return;
        seen.add(id);
        out.push({ id, en: w[0], uk: w[1], note: w[2] || '', lesson: l.id });
      });
    });
    EN.S.dict.forEach((w) => out.push({ id: EN.cardId('my', w.en), en: w.en, uk: w.uk, note: w.note || '', ipa: w.ipa || '', ex: w.ex || '', au: w.au, lesson: 'my' }));
    return out;
  };
  EN.srsQueue = function (only) {
    const t = EN.today();
    const words = EN.allWords(only);
    const due = EN.shuffle(words.filter((w) => EN.S.cards[w.id] && EN.S.cards[w.id].due <= t));
    if (EN.S.newDay.day !== t) EN.S.newDay = { day: t, count: 0 };
    const room = Math.max(0, (EN.S.settings.newPerDay || 10) - EN.S.newDay.count);
    const fresh = words.filter((w) => !EN.S.cards[w.id]).slice(0, room);
    return { due, fresh, total: due.length + fresh.length };
  };
  EN.srsCounts = function (only) {
    const t = EN.today();
    const words = EN.allWords(only);
    const due = words.filter((w) => EN.S.cards[w.id] && EN.S.cards[w.id].due <= t).length;
    const known = words.filter((w) => EN.S.cards[w.id] && EN.S.cards[w.id].reps > 0).length;
    const unseen = words.filter((w) => !EN.S.cards[w.id]).length;
    return { due, known, unseen, all: words.length };
  };
  function nextInterval(c, grade) {
    if (c.reps === 0) return grade === 4 ? 3 : 1;
    if (c.reps === 1) return grade === 2 ? 2 : grade === 4 ? 6 : 4;
    return Math.round(c.int * (grade === 2 ? 1.2 : grade === 4 ? c.ease * 1.3 : c.ease));
  }
  // grade: 1 знову, 2 важко, 3 добре, 4 легко
  EN.srsGrade = function (word, grade) {
    const t = EN.today();
    let c = EN.S.cards[word.id];
    if (!c) {
      c = EN.S.cards[word.id] = { due: t, int: 0, ease: 2.5, reps: 0, lapses: 0 };
      if (EN.S.newDay.day !== t) EN.S.newDay = { day: t, count: 0 };
      EN.S.newDay.count++;
    }
    if (grade === 1) {
      c.lapses++; c.reps = 0; c.int = 0; c.ease = Math.max(1.3, c.ease - 0.2); c.due = t;
    } else {
      const next = nextInterval(c, grade);
      if (grade === 2) c.ease = Math.max(1.3, c.ease - 0.15);
      if (grade === 4) c.ease += 0.15;

    'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
  const TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
  const MONTHS = ['', 'January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const MONTH_DAYS = [0, 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  const ORD_IRREG = { one: 'first', two: 'second', three: 'third', five: 'fifth', eight: 'eighth', nine: 'ninth', twelve: 'twelfth' };

  const under100 = (n) => (n < 20 ? ONES[n] : TENS[Math.floor(n / 10)] + (n % 10 ? '-' + ONES[n % 10] : ''));
  // and — британська норма (one hundred and five); американці часто кажуть без нього, і обидва варіанти правильні

<script>
/* Рушій вправ: c — вибір (перший варіант правильний), i — введення, o — порядок слів, l — диктант, g — генерована (gen.js) */
(function (EN) {
  'use strict';
  const esc = EN.esc;
  const shown = (a) => (Array.isArray(a) ? a[0] : a);

  /**
   * specs — вправи; opts.onFinish(score%), opts.drill (без «урок зараховано»),
   * opts.saveKey — id уроку: тоді незавершений підхід зберігається в стані уроку (run) і його можна продовжити пізніше.
   * run = { n: кількість вправ, q: [[індекс, повтор?], …], pos, ft: {індекс: правильно з першої спроби?}, sk: {індекс: пропущено} }
   */
  EN.runExercises = function (root, specs, opts) {
    opts = opts || {};
    const lst = opts.saveKey ? EN.lessonState(opts.saveKey) : null;
    const last = {}; // останній показаний варіант кожної вправи: генеровані щоразу нові, а підсумок має показати саме той
    const make = (i) => (last[i] = Object.assign(specs[i].t === 'g' ? EN.gen.make(specs[i]) : Object.assign({}, specs[i]), { _i: i }));
    const fresh = () => ({ n: specs.length, q: EN.shuffle(specs.map((_, i) => [i, 0])), pos: 0, ft: {}, sk: {} });

    if (saved && !opts.forceNew) {

      root.innerHTML = '<div class="ex-box card center"><h3>⏸ Незавершений підхід</h3><p>Ви вже виконали <b>' + answered + ' з ' + specs.length + '</b> завдань цього уроку.</p>' +
        '<div class="row" style="justify-content:center"><button class="btn primary cont">▶ Продовжити</button><button class="btn restart">↺ Почати заново</button></div></div>';

        '<div class="stat">' + score + '%</div><p class="muted">правильно з першої спроби: ' + ok + ' з ' + total + (skipped ? ' · пропущено: ' + skipped : '') + '</p>' +
        (opts.drill ? '' : score >= 80 ? '<p class="good">Урок зараховано (потрібно ≥ 80%).</p>' : '<p class="note">Для зарахування потрібно ≥ 80%. Перечитайте теорію і спробуйте ще раз — це нормально. Якщо тему ви вже знаєте, урок можна пропустити кнопкою вгорі.</p>') +
        (wrong.length ? '<div class="small" style="text-align:left"><b>Де були помилки або пропуски:</b><ul>' + wrong.map((w) => '<li>' + esc(stripTags(w.q || w.h || 'Диктант')) + ' → <b>' + esc(answerText(w)) + '</b></li>').join('') + '</ul></div>' : '') +

<script>
/* Мій словник: додавання, редагування, транскрипція й записи носіїв, експорт та імпорт.

  const FORMAT_VERSION = 1;
  const key = (en) => EN.dictKey(en);

  const clone = (o) => JSON.parse(JSON.stringify(o));

  const MAX_WORDS = 20000;

  const Dict = {
    FORMAT, MAX_WORDS,
    list() { return EN.S.dict; },
    index(en) { const k = key(en); return EN.S.dict.findIndex((w) => key(w.en) === k); },
    get(en) { return EN.S.dict[this.index(en)] || null; },

    // Повертає { ok, word } або { ok: false, reason: 'empty' | 'dup' | 'full', word? }
    add(fields) {
      const w = EN.cleanWord(Object.assign({}, fields, { added: EN.isoDay(EN.today()) }));
      if (!w) return { ok: false, reason: 'empty' };
      const old = this.get(w.en);
      if (old) return { ok: false, reason: 'dup', word: old };
      if (EN.S.dict.length >= MAX_WORDS) return { ok: false, reason: 'full' };

      EN.save();
      return { ok: true, word: w };
    },
    // Нове англійське написання переносить і прогрес повторення: id картки містить саме слово
    update(oldEn, fields) {
      const i = this.index(oldEn);
      if (i < 0) return { ok: false, reason: 'missing' };
      const cur = EN.S.dict[i];
      const w = EN.cleanWord(Object.assign({}, cur, fields));
      if (!w) return { ok: false, reason: 'empty' };
      const j = this.index(w.en);
      if (j >= 0 && j !== i) return { ok: false, reason: 'dup', word: EN.S.dict[j] };
      if (w.en !== cur.en) {
        if (key(w.en) !== key(cur.en)) { delete w.ipa; delete w.au; }
        const card = EN.S.cards[cid(cur.en)];
        delete EN.S.cards[cid(cur.en)];
        if (card) EN.S.cards[cid(w.en)] = card;
      }
      EN.S.dict[i] = w;
      EN.save();
      return { ok: true, word: w };
    },
    remove(en) {
      const i = this.index(en);
      if (i < 0) return false;
      const w = EN.S.dict.splice(i, 1)[0];
      delete EN.S.cards[cid(w.en)];
      EN.save();
      return true;
    },
    clear() {
      for (const w of EN.S.dict) delete EN.S.cards[cid(w.en)];
      EN.S.dict = [];
      EN.save();
    },
    card(en) { return EN.S.cards[cid(en)] || null; },

    // Транскрипція й записи живих людей з dictionaryapi.dev (дані Wiktionary). Відповіді кешуються на час сесії,
    // бо в сервісу обмеження на кількість запитів, а учень часто натискає те саме слово кілька разів
    cache: new Map(),
    async lookup(en) {
      const q = EN.sayText(en).toLowerCase().replace(/^to\s+/, '').trim();
      if (!q || q.length > 60) return null;
      if (this.cache.has(q)) return this.cache.get(q);
      const once = async () => {
        const ctrl = typeof AbortController === 'function' ? new AbortController() : null;

          const r = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(q), { signal: ctrl && ctrl.signal, referrerPolicy: 'no-referrer' });

        await new Promise((ok) => setTimeout(ok, 1200));

    },
    // Слова без транскрипції чи запису (наприклад, після імпорту) доповнюються по черзі: у сервісу ліміт запитів
    missing() { return EN.S.dict.filter((w) => !w.ipa).map((w) => w.en); },
    async enrichAll(onStep, stop) {

      for (let i = 0; i < list.length && !(stop && stop()); i++) {
        const r = await this.enrich(list[i]);
        if (r === undefined) { if (++fails >= 3) break; } else { fails = 0; if (r) found++; }
        if (onStep) onStep(i + 1, list.length, found);

      return { found, total: list.length, offline: fails >= 3 };
    },
    parseLookup(data) {
      if (!Array.isArray(data)) return null;
      const au = {}, texts = { us: '', gb: '', au: '' };
      let any = '';
      for (const entry of data) {
        if (!any && entry && typeof entry.phonetic === 'string') any = entry.phonetic;
        for (const p of (entry && entry.phonetics) || []) {
          let url = typeof p.audio === 'string' ? p.audio.trim() : '';
          if (url.startsWith('//')) url = 'https:' + url;
          const acc = /-us\.mp3$|_us_/i.test(url) ? 'us' : /-uk\.mp3$|_gb_/i.test(url) ? 'gb' : /-au\.mp3$/i.test(url) ? 'au' : null;
          if (acc && !au[acc]) au[acc] = url;
          if (p.text) { if (!any) any = p.text; if (acc && !texts[acc]) texts[acc] = p.text; }

    },
    // Дописує транскрипцію (якщо її немає) і записи носіїв до слова зі словника

      const r = await this.lookup(en);
      if (!r) return r;
      const i = this.index(en);
      if (i < 0) return r;
      const w = EN.S.dict[i];
      const next = Object.assign({}, w, { ipa: w.ipa || r.ipa, au: r.au || w.au });

    },
    // Запис носія потрібного акценту, а якщо його немає — будь-який (австралійський теж краще за синтез)

    },

    toJson(withProgress) {
      const words = EN.S.dict.map((w) => {
        const out = clone(w);

    },
    toCsv() {

    fileName(ext) { return 'hello-english-dictionary-' + EN.isoDay(EN.today()) + '.' + ext; },

    parseJson(data) {

        else cell += ch;
      }
      if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
      return rows;
    },
    parseTable(text, d) {
      const table = Dict.splitCsv(text, d).filter((r) => r.some((c) => c.trim()));
      let cols = { en: 0, uk: 1, note: 2, ex: 3, ipa: 4 }, start = 0;
      const head = (table[0] || []).map((c) => c.trim().toLowerCase());
      if (head.length && (EN_NAMES.includes(head[0]) || head.some((h) => UK_NAMES.includes(h)))) {

    parseText(text) {

        const line = raw.replace(/^\s*(?:\d+[.)]|[-•*–])\s+/, '').trim();

    },

    // План злиття: що нове, що вже є з тим самим перекладом, що з іншим, що повторюється в самому файлі

    },
    // conflict: 'keep' | 'replace' | 'merge'; progress — брати прогрес повторення з файлу. Повертає підсумок і знімок для скасування
    apply(plan, opts) {

      const snapshot = { dict: clone(EN.S.dict), cards: {} };
      for (const k of Object.keys(EN.S.cards)) if (k.startsWith('my|')) snapshot.cards[k] = clone(EN.S.cards[k]);
      let added = 0, updated = 0, filled = 0;

      const takeCard = (row, en) => {

        const old = EN.S.cards[cid(en)];
        if (!old || (!old.reps && row.card.reps)) EN.S.cards[cid(en)] = clone(row.card);
      };

      const fill = (cur, row) => {
        let n = 0;
        for (const f of ['note', 'ex', 'ipa']) if (!cur[f] && row[f]) { cur[f] = row[f]; n++; }
        if (!cur.au && row.au) { cur.au = row.au; n++; }
        return n;
      };

        const w = Object.assign({}, row);

  theory: `
<h3>Вітання</h3>
<div class="tblwrap"><table><tr><th>фраза</th><th>коли</th></tr>
<tr><td>[[Hello!]] /həˈləʊ/</td><td>завжди, нейтрально</td></tr>
<tr><td>[[Hi!]] · [[Hey!]]</td><td>неформально: друзі, колеги</td></tr>
<tr><td>[[Good morning!]]</td><td>зранку, приблизно до 12:00</td></tr>
<tr><td>[[Good afternoon!]]</td><td>приблизно з 12:00 до 18:00</td></tr>
<tr><td>[[Good evening!]]</td><td>увечері, при зустрічі</td></tr>
<tr><td>[[Good night!]]</td><td>лише на прощання ввечері чи перед сном</td></tr></table></div>
<div class="note">⚠️ [[Good night!]] — не «добрий вечір», а «на добраніч». Прийшли ввечері — кажіть [[Good evening!]] або просто [[Hello!]]</div>
<p>Після привітання майже завжди питають [[How are you?]] — Як справи? Відповідь коротка й позитивна: [[I'm fine, thanks. And you?]] · [[Good, thanks!]] · [[Not bad.]] Неформально питають ще [[How's it going?]]</p>
<div class="note">⚠️ [[How are you?]] — частіше ритуал, ніж справжнє питання: у магазині чи на ресепшені досить відповісти [[Fine, thanks. And you?]] А [[How do you do?]] — дуже офіційне привітання (не питання!), зараз звучить рідко.</div>
<h3>Чарівні слова</h3>
<div class="tblwrap"><table><tr><th>фраза</th><th>коли</th><th>приклад</th></tr>
<tr><td>[[please]]</td><td>коли просите</td><td>[[A coffee, please.]] [[Can I have the bill, please?]] (амер. [[the check]])</td></tr>
<tr><td>[[Thank you!]] · [[Thanks!]] · [[Thanks a lot!]]</td><td>дякуєте</td><td>[[Thank you for your help!]]</td></tr>
<tr><td>[[You're welcome.]] · [[No problem.]]</td><td>відповідаєте на «дякую»</td><td>[[Thanks! — You're welcome.]]</td></tr>
<tr><td>[[Here you are.]] · [[Here you go.]]</td><td>щось подаєте</td><td>[[Your coffee. Here you are.]]</td></tr></table></div>
<div class="note">⚠️ Українське «будь ласка» — це три різні англійські фрази: просите — [[please]], відповідаєте на подяку — [[You're welcome.]], подаєте річ — [[Here you are.]] На [[Thank you!]] не відповідайте «Please».</div>
<div class="tip">Британці в розмові часто дякують коротким [[Cheers!]] — це не лише «будьмо!», а й розмовне «дякую».</div>
<h3>Sorry чи Excuse me?</h3>
<p>[[Excuse me.]] — <b>перед</b> тим, як потурбувати: звернутися до незнайомця, пройти, привернути увагу. [[Excuse me, where is the station?]]<br>
[[Sorry!]] — <b>після</b>: вибачитися, коли щось уже сталося. [[Sorry, I'm late.]] [[Oh, sorry!]]<br>
[[Sorry?]] з висхідною інтонацією — «Перепрошую, що?», коли не почули. Британці кажуть ще [[Pardon?]], американці — [[Excuse me?]]</p>
<h3>Прощання</h3>
<p>[[Bye!]] · [[Goodbye!]] (офіційніше) · [[See you!]] · [[See you tomorrow!]] · [[Have a nice day!]] · [[Take care!]]</p>
<h3>Фрази-рятівники</h3>
<div class="tblwrap"><table><tr><th>англійською</th><th>українською</th></tr>
<tr><td>[[I don't understand.]]</td><td>Я не розумію.</td></tr>
<tr><td>[[Could you repeat that, please?]]</td><td>Повторіть, будь ласка.</td></tr>
<tr><td>[[Could you speak more slowly, please?]]</td><td>Говоріть, будь ласка, повільніше.</td></tr>
<tr><td>[[What does "queue" mean?|What does queue mean?]]</td><td>Що означає «queue»?</td></tr>
<tr><td>[[How do you say … in English?|How do you say this in English?]]</td><td>Як сказати … англійською? (наприклад: How do you say «дякую» in English?)</td></tr>
<tr><td>[[How do you spell it?]]</td><td>Як це пишеться? (урок 0.1)</td></tr>
<tr><td>[[Sorry, my English isn't very good.]]</td><td>Вибачте, моя англійська не дуже добра.</td></tr></table></div>
<div class="tip">«Could you…?» звучить ввічливіше, ніж «Can you…?», а [[please]] у кінці ще пом'якшує прохання. Не соромтеся перепитувати: носії мови до цього звикли, і краще перепитати, ніж не зрозуміти.</div>
<div class="good"><b>Ці фрази — ваш рятувальний круг.</b> З ними ви не загубитеся в розмові, навіть коли розумієте мало. Вивчіть їх напам'ять першими.</div>
<h3>Інтонація: вгору чи вниз</h3>
<p>Питання «так / ні» (з дієсловом на початку) — голос у кінці <b>піднімається</b> ↗: [[Are you OK?]] [[Could you repeat that?]] [[Is it far?]]<br>
Питання з what, where, how… — голос <b>падає</b> ↘: [[Where are you from?]] [[What does it mean?]] [[How are you?]]<br>
Звичайне речення — теж ↘: [[I don't understand.]]</p>
<div class="note">⚠️ Wh-питання з висхідною інтонацією англієць сприйме як перепитування («Звідки-звідки?»). Питаєте вперше — голос униз.</div>
<h3>Слабкі форми: Can I… звучить як /kən aɪ/</h3>
<p>Короткі службові слова в потоці мови «слабшають» до [ə]: [[Can I have a coffee?]] /kən aɪ hæv ə ˈkɒfi/; to → /tə/: [[I want to go.]]; for → /fə/: [[This is for you.]]; and → /ən/: [[fish and chips]]. Значущі слова — чітко, службові — швидко й легко.</p>
<div class="tip">У кінці речення й у короткій відповіді форма сильна: [[Yes, I can.]] /kæn/. А [[can't]] завжди звучить повно (брит. /kɑːnt/, амер. /kænt/), тож [[I can go.]] і [[I can't go.]] розрізняють передусім за голосним, а не за t.</div>`,

  id: 'a1-1', stage: 'a1', num: 'A1.1', title: 'I am, you are — дієслово to be і знайомство', dur: '1 тиждень',

  theory: `
<h3>Особові займенники</h3>
<p>[[I]] — я (завжди з великої літери!), [[you]] — ти / ви, [[he]] — він, [[she]] — вона, [[it]] — воно (предмет, тварина, ситуація), [[we]] — ми, [[they]] — вони.</p>
<div class="good"><b>Ти і ви — одне слово.</b> [[you]] — і «ти», і «ви». Ввічливість передають інакше: [[please]], [[Could you…?]], звертання [[Mr Smith]], [[Ms Brown]].</div>
<h3>to be — бути. В українській воно випадає, в англійській — ні!</h3>
<p>Українською кажемо «Я інженер», «Вона вдома». Англійською без дієслова речення неможливе: [[I am an engineer.]] [[She is at home.]]</p>
<div class="tblwrap"><table><tr><th>повна форма</th><th>коротка (у мовленні)</th><th>приклад</th></tr>
<tr><td>I <b>am</b></td><td>[[I'm]]</td><td>[[I'm from Ukraine.]] — Я з України.</td></tr>
<tr><td>you <b>are</b></td><td>[[you're]]</td><td>[[You're late.]] — Ти запізнився.</td></tr>
<tr><td>he / she / it <b>is</b></td><td>[[he's]], [[she's]], [[it's]]</td><td>[[She's a doctor.]] [[It's cold.]]</td></tr>
<tr><td>we / you / they <b>are</b></td><td>[[we're]], [[they're]]</td><td>[[We're colleagues.]] — Ми колеги.</td></tr></table></div>
<p>У розмові майже завжди звучать <b>короткі форми</b>. Повні — в офіційних текстах або коли наголошуємо: [[I am ready!]]</p>
<h3>Заперечення: not після to be</h3>
<p>[[I'm not tired.]] — Я не втомився. [[He isn't here.]] — Його тут немає. [[They aren't at work.]] — Вони не на роботі.<br>
Короткі форми: <b>is not = isn't</b>, <b>are not = aren't</b>, але <b>am not</b> скорочується лише як [[I'm not]] (форми «amn't» немає).</p>
<h3>Питання: to be стає на перше місце</h3>
<p>[[You are tired.]] → [[Are you tired?]] — Ти втомився? [[She is from Kyiv.]] → [[Is she from Kyiv?]]</p>
<p>Коротка відповідь: [[Yes, I am.]] / [[No, I'm not.]] — [[Yes, she is.]] / [[No, she isn't.]] (у ствердній короткій відповіді скорочувати не можна: не «Yes, I'm».)</p>
<p>З питальним словом: [[Where are you from?]] — Звідки ви? [[What's your name?]] — Як вас звати? [[How are you?]] — Як справи? [[Who is it?]] — Хто це?</p>
<div class="note"><b>⚠️ Пастка: інтонація не робить питання.</b> Українською «Ти втомився?» відрізняється від твердження лише інтонацією. В англійській треба <b>переставити слова</b>: не «You are tired?», а [[Are you tired?]]</div>
<h3>a / an перед професією</h3>
<p>Професію називають з артиклем: [[I'm a developer.]] [[She's an engineer.]] [[He's a teacher.]] <b>an</b> — перед голосним <i>звуком</i>: [[an engineer]], [[an accountant]], [[an IT specialist]]. Детальніше про артиклі — в уроці A1.2.</p>
<h3>Країни й національності</h3>
<p>[[Ukraine]] — [[Ukrainian]], [[Slovakia]] — [[Slovak]], [[Poland]] — [[Polish]], [[Germany]] — [[German]], [[the UK]] — [[British]], [[the USA]] — [[American]].<br>
Національність і мова — одне слово, і пишеться <b>з великої літери</b>: [[I'm Ukrainian. I speak Ukrainian and a little English.]]</p>
<div class="tip"><b>Як вимовляти:</b> [[Ukraine]] — ю-КРЕЙН (наголос на другий склад, без «у» на початку), [[Ukrainian]] — ю-КРЕЙ-ні-ен. Натисніть і послухайте.</div>`,
  vocab: [['I', 'я', 'завжди з великої літери'], ['you', 'ти; ви'], ['he / she / it', 'він / вона / воно'], ['we', 'ми'], ['they', 'вони'],
    ['to be', 'бути', 'am, is, are'], ['name', 'ім\'я'], ['from', 'з (звідки)'], ['Ukraine', 'Україна', 'наголос: ю-КРЕЙН'], ['Ukrainian', 'українець; українська мова', 'з великої літери'],
    ['Slovakia', 'Словаччина'], ['country', 'країна'], ['job', 'робота, посада'], ['developer', 'розробник'], ['engineer', 'інженер', 'an engineer'],

    ['at work', 'на роботі'], ['here', 'тут'], ['Nice to meet you.', 'Приємно познайомитися.']],
  ex: [

    { t: 'i', q: 'Вставте форму to be: ___ you tired?', a: 'Are' },
    { t: 'c', q: '«Я не втомився»', o: ['I\'m not tired.', 'I not tired.', 'I don\'t tired.'], e: 'Заперечення з to be — просто not після am / is / are: [[I\'m not tired.]]' },

    { t: 'c', q: '«Ви з Польщі?»', o: ['Are you from Poland?', 'You are from Poland?', 'Do you from Poland?'], e: 'У питанні to be стає на перше місце: [[Are you from Poland?]]' },
    { t: 'c', q: 'Коротка відповідь на «Is she married?» — «Так»', o: ['Yes, she is.', 'Yes, she\'s.', 'Yes, she married.'], exact: true, e: 'У ствердній короткій відповіді скорочувати не можна: [[Yes, she is.]]' },
    { t: 'c', q: 'Яке речення правильне?', o: ['I\'m an engineer.', 'I\'m engineer.', 'I\'m a engineer.'], e: 'Професію називають з артиклем; перед голосним звуком — an: [[an engineer]].' },
    { t: 'c', q: '«Я українка»', o: ['I\'m Ukrainian.', 'I\'m ukrainian.', 'I\'m a Ukraine.'], exact: true, e: 'Національність пишуть з великої літери: [[Ukrainian]].' },
    { t: 'o', q: 'Звідки ви?', a: 'Where are you from?' },
    { t: 'o', q: 'Ми не колеги.', a: 'We aren\'t colleagues.' },
    { t: 'o', q: 'Чи вона розробниця?', a: 'Is she a developer?' },
    { t: 'l', a: 'Nice to meet you.', tr: 'Приємно познайомитися.' },
    { t: 'l', a: 'I\'m from Ukraine.', tr: 'Я з України.' }
  ],
  say: [['Hi! My name is Olena. I\'m from Ukraine.', 'Привіт! Мене звати Олена. Я з України.'], ['Nice to meet you.', 'Приємно познайомитися.'], ['Where are you from?', 'Звідки ви?'],
    ['I\'m a developer. I\'m not a manager.', 'Я розробник. Я не менеджер.'], ['Are you tired? — No, I\'m not.', 'Ти втомився? — Ні.'], ['We\'re colleagues.', 'Ми колеги.']],
  speak: ['Представтеся в 4–5 реченнях: ім\'я, звідки ви, де живете, ким працюєте, чи одружені. Запишіть себе й послухайте.',
    'Дайте відповідь уголос повними реченнями: What\'s your name? Where are you from? What\'s your job? Are you tired today?'],
  mission: 'Напишіть англійською коротке представлення себе (3–4 речення) — для профілю в соцмережі, LinkedIn чи робочого чату. Почніть з [[Hi! I\'m…]] і прочитайте його вголос.'
},
{
  id: 'a1-2', stage: 'a1', num: 'A1.2', title: 'A, an, the; this, that; множина', dur: '1 тиждень',
  goals: ['вживати a / an і the з іменниками', 'показувати на предмети: this, that, these, those', 'утворювати множину іменників, зокрема неправильну: men, children, people', 'правильно вимовляти закінчення -s'],
  theory: `
<h3>Артиклі: маленькі слова, яких немає в українській</h3>
<p>В англійській перед іменником зазвичай стоїть <b>артикль</b> — службове слово, яке показує, про що мова: про «якийсь, один з багатьох» предмет чи про «саме цей, відомий». Артиклів два: <b>неозначений</b> [[a]] / [[an]] і <b>означений</b> [[the]].</p>
<div class="note"><b>⚠️ Головна пастка для українців.</b> В українській артиклів немає, тому їх легко «загубити». Але злічуваний іменник в однині майже ніколи не стоїть сам: не «I need umbrella», а [[I need an umbrella.]]; не «Where is key?», а [[Where is the key?]]</div>
<h3>a / an — «один, якийсь», уперше</h3>
<p>Неозначений артикль походить від слова [[one]] і вживається лише з <b>одниною злічуваних</b> іменників: [[a key]], [[a bag]], [[an umbrella]].</p>
<ul><li>згадуємо вперше, слухач ще не знає, який саме: [[I have a new laptop.]] — У мене новий ноутбук.</li>
<li>один з багатьох, будь-який: [[Can I have a glass of water?]] — Можна склянку води?</li>
<li>хто це чи що це: [[She's a doctor.]] [[It's a wallet.]]</li></ul>
<p><b>an</b> — перед голосним <i>звуком</i>, а не буквою: [[an apple]], [[an umbrella]], [[an hour]] (h не читається), [[an email]]. <b>a</b> — перед приголосним звуком, навіть якщо пишеться голосна: [[a university]], [[a European country]] (звучить [j] — «й»), [[a one-way ticket]] (звучить [w]).</p>
<div class="tip"><b>Вимова:</b> [[a]] у мовленні — коротке ненаголошене [ə]: [[a bag]] ≈ «е-БЕГ». [[the]] перед приголосним звучить [ðə], перед голосним звуком — [ði]: [[the door]], але [[the end]], [[the hour]].</div>
<h3>the — «саме цей», відомий обом</h3>
<ul><li>згадуємо вдруге: [[I see a cat and a dog. The cat is black.]]</li>
<li>з ситуації зрозуміло, який саме: [[Close the door, please.]] [[Where are the keys?]] (ті, про які ми обоє знаємо)</li>
<li>єдиний у своєму роді: [[the sun]], [[the moon]], [[the internet]]</li></ul>
<p><b>the</b> вживається з будь-якими іменниками: в однині, у множині й з незлічуваними.</p>
<h3>Коли артикля немає</h3>
<ul><li>множина й незлічувані іменники, коли говоримо загалом: [[I like books.]] [[Coffee is expensive here.]]</li>
<li>імена, міста, більшість країн: [[Anna]], [[London]], [[Poland]]. Але: [[the UK]], [[the USA]], [[the Netherlands]] — у назві є «королівство», «штати» чи множина.</li>
<li>коли перед іменником уже є присвійне чи вказівне слово: [[my bag]], [[this key]] (не «the my bag»).</li></ul>
<div class="tblwrap"><table><tr><th></th><th>однина</th><th>множина</th><th>незлічуване</th></tr>
<tr><td>якийсь, уперше, загалом</td><td>[[a bag]], [[an hour]]</td><td>[[bags]]</td><td>[[water]]</td></tr>
<tr><td>саме цей, відомий</td><td>[[the bag]]</td><td>[[the bags]]</td><td>[[the water]]</td></tr></table></div>
<div class="note"><b>⚠️ Незлічувані іменники</b> не мають множини й не вживаються з a / an: [[information]] (не «informations»), [[advice]], [[money]], [[furniture]]. Одну порцію називають через «шматок», «склянку» тощо: [[a piece of advice]], [[a glass of water]].</div>
<h3>this, that, these, those — цей і той</h3>
<div class="tblwrap"><table><tr><th></th><th>однина</th><th>множина</th></tr>
<tr><td>близько (тут)</td><td>[[this key]] — цей ключ</td><td>[[these keys]] — ці ключі</td></tr>
<tr><td>далеко (там)</td><td>[[that window]] — те вікно</td><td>[[those windows]] — ті вікна</td></tr></table></div>
<p>Вони стоять перед іменником або замість нього: [[This is my bag.]] — Це моя сумка. [[What's that?]] — Що то (там)? [[These are my keys.]] — Це мої ключі. [[Those are my colleagues.]] — То мої колеги.</p>
<p>По телефону представляються через this: [[Hi, this is Olena.]] — Привіт, це Олена.</p>
<div class="note"><b>⚠️ Українське «це» — одне на все.</b> «Це моя сумка» і «Це мої ключі» англійською звучать по-різному: однина — [[This is…]], множина — [[These are…]]. Не «This are my keys».</div>

<h3>«У мене є» = I have</h3>
<p>В українській власник «ховається» в «у мене»: «У мене є брат». В англійській власник — підмет речення, а «мати» — дієслово [[have]]: [[I have a brother.]]</p>
<div class="note"><b>⚠️ Не перекладайте дослівно.</b> Не «By me is a brother» і не «At me is a car», а лише [[I have a brother.]], [[We have a car.]]</div>
<div class="tblwrap"><table><tr><th>хто</th><th>форма</th><th>приклад</th></tr>
<tr><td>I / you / we / they</td><td><b>have</b></td><td>[[I have two children.]] [[They have a dog.]]</td></tr>
<tr><td>he / she / it</td><td><b>has</b></td><td>[[She has a sister.]] [[My flat has a balcony.]]</td></tr></table></div>
<h3>have got — те саме, по-британськи й розмовно</h3>
<p>У Британії в розмові часто кажуть <b>have got</b>: [[I've got a brother.]] = [[I have a brother.]] Значення однакове. Американці й офіційні тексти частіше вживають просте [[have]] — його розуміють усюди.</p>
<div class="tblwrap"><table><tr><th></th><th>have (усюди, особливо US)</th><th>have got (UK, розмовне)</th></tr>
<tr><td>+</td><td>[[I have a car.]]<br>[[She has a car.]]</td><td>[[I've got a car.]]<br>[[She's got a car.]]</td></tr>
<tr><td>–</td><td>[[I don't have a car.]]<br>[[She doesn't have a car.]]</td><td>[[I haven't got a car.]]<br>[[She hasn't got a car.]]</td></tr>
<tr><td>?</td><td>[[Do you have a car?]]<br>[[Does she have a car?]]</td><td>[[Have you got a car?]]<br>[[Has she got a car?]]</td></tr>
<tr><td>коротка відповідь</td><td>[[Yes, I do.]] / [[No, she doesn't.]]</td><td>[[Yes, I have.]] / [[No, she hasn't.]]</td></tr></table></div>
<div class="note"><b>⚠️ Не змішуйте дві схеми.</b> Або [[Do you have…?]], або [[Have you got…?]] — але не «Do you have got…?». Після doesn't дієслово без -s: [[She doesn't have…]], а не «doesn't has».</div>
<div class="tip"><b>She's got = She has got</b>, а не «she is». На слух [[She's got a dog.]] і [[She's a doctor.]] починаються однаково — розрізняйте за словом got.</div>
<p>У питаннях і запереченнях про наявність часто додають <b>any</b>: [[Have you got any brothers or sisters?]] — У тебе є брати чи сестри? [[I don't have any children.]] — У мене немає дітей.</p>
<h3>Присвійні займенники: чий?</h3>

<tr><td>he</td><td><b>his</b> — його</td><td>[[his wife]]</td></tr>
<tr><td>she</td><td><b>her</b> — її</td><td>[[her husband]]</td></tr>
<tr><td>it</td><td><b>its</b> — його, її (про предмет, тварину, місто)</td><td>[[the city and its parks]]</td></tr>
<tr><td>we</td><td><b>our</b> — наш</td><td>[[our parents]]</td></tr>
<tr><td>they</td><td><b>their</b> — їхній</td><td>[[their children]]</td></tr></table></div>
<div class="good"><b>Простіше, ніж в українській:</b> my — і «мій», і «моя», і «мої»: [[my son]], [[my daughter]], [[my children]]. Рід і число того, що належить, не важливі.</div>

<h3>Присвійний відмінок: 's і s'</h3>
<p>Щоб сказати, чиє щось, до власника додають <b>'s</b>: [[my sister's car]] — машина моєї сестри, [[Anna's phone]] — телефон Анни, [[my wife's name]] — ім'я моєї дружини.</p>

  theory: `
<h3>Коли вживається Present Simple</h3>
<p><b>Present Simple</b> (теперішній простий час) — для того, що відбувається <b>регулярно</b> або є <b>правдою загалом</b>:</p>
<ul><li>звички й розпорядок: [[I get up at seven.]] — Я встаю о сьомій.</li>
<li>постійні речі — робота, місце проживання: [[I work in IT.]] [[They live in Bratislava.]]</li>
<li>факти й розклади: [[Water boils at 100 degrees.]] [[The shop opens at nine.]]</li></ul>
<p>Слова-підказки: [[every day]], [[usually]], [[on Mondays]], [[at the weekend]].</p>
<h3>Форма: he / she / it + -s</h3>
<div class="tblwrap"><table><tr><th>хто</th><th>форма</th><th>приклад</th></tr>
<tr><td>I / you / we / they</td><td>work</td><td>[[I work from home.]] [[We live in a small town.]]</td></tr>
<tr><td>he / she / it</td><td>work<b>s</b></td><td>[[She work<b>s</b> in a bank.]] [[It start<b>s</b> at nine.]]</td></tr></table></div>
<div class="note"><b>⚠️ Найчастіша помилка — загубити -s.</b> В українській змінюється закінчення в кожній особі (працюю, працює, працюють), а в англійській -s з'являється лише в одній — тому його легко забути. Дивіться на підмет: he, she, it, [[my brother]], [[Anna]], [[the office]] — дієслово з -s: [[My brother lives in Kyiv.]]</div>
<div class="tblwrap"><table><tr><th>правопис</th><th>приклади</th></tr>
<tr><td>більшість дієслів: <b>+s</b></td><td>[[works]], [[gets]], [[cooks]], [[plays]]</td></tr>
<tr><td>після -s, -sh, -ch, -x, -o: <b>+es</b></td><td>[[watches]], [[finishes]], [[fixes]], [[goes]], [[does]]</td></tr>
<tr><td>приголосна + y: <b>y → ies</b></td><td>[[study — studies]], [[try — tries]]; але голосна + y: [[play — plays]], [[buy — buys]]</td></tr>
<tr><td>неправильне</td><td>[[have — has]]</td></tr></table></div>
<div class="tip"><b>Вимова -s — як у множині:</b> [s] — [[works]], [[gets]]; [z] — [[lives]], [[plays]], [[goes]]; [ɪz] — [[watches]], [[finishes]], [[uses]]. Особливі: [[does]] [dʌz], [[says]] [sez].</div>
<h3>Заперечення: don't / doesn't + дієслово без -s</h3>
<div class="tblwrap"><table><tr><th>хто</th><th>заперечення</th><th>приклад</th></tr>
<tr><td>I / you / we / they</td><td><b>don't</b> (do not) + work</td><td>[[I don't work on Fridays.]]</td></tr>
<tr><td>he / she / it</td><td><b>doesn't</b> (does not) + work</td><td>[[She doesn't eat meat.]]</td></tr></table></div>
<div class="note"><b>⚠️ -s «переходить» у does.</b> [[He doesn't work.]] — правильно; «He doesn't works» — ні. Після don't / doesn't дієслово завжди в базовій формі.</div>
<h3>Питання: Do / Does…?</h3>
<p>[[Do you work from home?]] — [[Yes, I do.]] / [[No, I don't.]]<br>
[[Does she speak English?]] — [[Yes, she does.]] / [[No, she doesn't.]]</p>
<p>З питальним словом порядок такий: <b>питальне слово + do / does + підмет + дієслово</b>: [[Where do you live?]] [[When does the shop open?]] [[How do you get to work?]]</p>
<div class="note"><b>⚠️ do — лише для звичайних дієслів.</b> З to be питання будують без do: [[Are you tired?]], але [[Do you work?]] Не «Do you are…?» і не «Are you work?». І в питанні знову без -s: [[Does he like it?]], а не «Does he likes».</div>
<div class="tip"><b>[[What do you do?]]</b> — це не «що ти робиш (зараз)», а «ким ти працюєш». Відповідь: [[I'm a nurse.]] або [[I work in sales.]]</div>
<h3>Як часто: always, usually, often, sometimes, rarely, never</h3>
<div class="tblwrap"><table><tr><th>слово</th><th>як часто</th></tr>
<tr><td>[[always]] — завжди</td><td>100%</td></tr>
<tr><td>[[usually]] — зазвичай</td><td>≈ 90%</td></tr>
<tr><td>[[often]] — часто</td><td>≈ 70%</td></tr>
<tr><td>[[sometimes]] — іноді</td><td>≈ 50%</td></tr>
<tr><td>[[rarely]] — рідко</td><td>≈ 10%</td></tr>
<tr><td>[[never]] — ніколи</td><td>0%</td></tr></table></div>
<p>Місце в реченні: <b>перед основним дієсловом</b>, але <b>після to be</b>: [[I usually get up at seven.]] [[She never drinks coffee.]] — [[He is always late.]] [[I'm never tired in the morning.]] Слово sometimes можна поставити й на початок: [[Sometimes I work at the weekend.]]</p>
<div class="note"><b>⚠️ Без подвійного заперечення.</b> Українською «Я <b>ніколи не</b> снідаю» — два заперечні слова. Англійською never уже заперечне: [[I never have breakfast.]] Не «I don't never…».</div>
<h3>Мій день</h3>
<p>[[I get up at seven.]] [[I have breakfast and go to work at eight.]] [[I start work at nine and have lunch at one.]] [[I finish work at six and come home.]] [[In the evening I cook dinner, and I go to bed at eleven.]]</p>
<div class="note"><b>⚠️ Сталі вирази.</b> [[go to work]], [[go to bed]] — без the; [[come home]], [[go home]] — без to (не «go to home»). У [[have breakfast]], [[have lunch]], [[have dinner]] дієслово have означає «їсти», а не «мати».</div>
<div class="tip"><b>UK / US:</b> на вихідних — [[at the weekend]] (UK) / [[on the weekend]] (US). Митися в душі — [[have a shower]] (UK) / [[take a shower]] (US і UK).</div>`,

  id: 'a1-5', stage: 'a1', num: 'A1.5', title: 'There is / there are; прийменники місця; дім і місто', dur: '1 тиждень',

  theory: `
<h3>There is / there are — «є, знаходиться»</h3>
<p>Коли повідомляємо, що <b>щось є</b> в певному місці (часто — вперше про це кажемо), речення починається з [[there is]] (однина) або [[there are]] (множина), а місце стоїть у кінці: [[There is a table in the room.]] — У кімнаті є стіл. [[There are two bedrooms in my flat.]] — У моїй квартирі дві спальні.</p>
<div class="note"><b>⚠️ Інший порядок слів.</b> Українською починаємо з місця: «У кімнаті є стіл». Англійською — з there is: [[There is a table in the room.]], а не «In the room is a table».</div>
<div class="tblwrap"><table><tr><th></th><th>однина</th><th>множина</th></tr>
<tr><td>+</td><td>[[There is a bank.]] / [[There's a bank.]]</td><td>[[There are two banks.]]</td></tr>
<tr><td>–</td><td>[[There isn't a bank.]] / [[There's no bank.]]</td><td>[[There aren't any banks.]]</td></tr>
<tr><td>?</td><td>[[Is there a bank near here?]]</td><td>[[Are there any banks near here?]]</td></tr>
<tr><td>коротка відповідь</td><td>[[Yes, there is.]] / [[No, there isn't.]]</td><td>[[Yes, there are.]] / [[No, there aren't.]]</td></tr></table></div>
<div class="tip"><b>There's</b> [ðeəz] — звичайна розмовна форма. There are на письмі не скорочують.</div>
<div class="note"><b>⚠️ There is ≠ It is.</b> There is повідомляє, що щось <i>є</i>; it is описує те, про що вже йде мова: [[There's a cafe near my house. It's very nice.]] — Біля мого дому є кав'ярня. Вона дуже гарна.</div>
<h3>some і any</h3>
<ul><li><b>some</b> — у стверджувальних реченнях, «кілька, трохи»: [[There are some chairs in the kitchen.]] [[There's some milk in the fridge.]]</li>
<li><b>any</b> — у запереченнях і питаннях: [[There aren't any shops in my street.]] [[Are there any cafes near here?]]</li>
<li>з одниною злічуваних іменників — a / an: [[Is there a lift?]] (US [[Is there an elevator?]])</li></ul>
<div class="good">Часто some / any українською взагалі не перекладаються: «Тут є кав'ярні?» — [[Are there any cafes here?]]</div>
<h3>Прийменники місця</h3>
<div class="tblwrap"><table><tr><th>прийменник</th><th>значення</th><th>приклад</th></tr>
<tr><td>[[in]]</td><td>у, всередині</td><td>[[in the box]], [[in the kitchen]]</td></tr>
<tr><td>[[on]]</td><td>на (поверхні)</td><td>[[on the table]], [[on the wall]]</td></tr>
<tr><td>[[under]]</td><td>під</td><td>[[under the bed]]</td></tr>
<tr><td>[[next to]]</td><td>поруч із</td><td>[[next to the window]]</td></tr>
<tr><td>[[between]]</td><td>між</td><td>[[between the bank and the cafe]]</td></tr>
<tr><td>[[opposite]]</td><td>навпроти</td><td>[[opposite the station]] (US також [[across from the station]])</td></tr>
<tr><td>[[behind]]</td><td>за, позаду</td><td>[[behind the door]]</td></tr>
<tr><td>[[in front of]]</td><td>перед</td><td>[[in front of the house]]</td></tr>
<tr><td>[[near]]</td><td>біля, недалеко від</td><td>[[near the park]]</td></tr></table></div>
<div class="note"><b>⚠️ Пастки з прийменниками.</b> [[next to]] — завжди з to; [[in front of]] — з of; [[opposite]] — без жодного прийменника (не «opposite of»). [[in front of]] — це «перед», а «навпроти, через дорогу» — [[opposite]]. «На зупинці», «на вокзалі» — [[at the bus stop]], [[at the station]]: at вживаємо, коли місце — як точка на мапі.</div>
<h3>Дім: кімнати й меблі</h3>
<p>Квартира — [[flat]] (UK) / [[apartment]] (US), будинок — [[house]]. Кімнати: [[living room]] — вітальня, [[bedroom]] — спальня, [[kitchen]] — кухня, [[bathroom]] — ванна кімната, [[hall]] — передпокій. Меблі: [[sofa]] — диван, [[armchair]] — крісло, [[bed]] — ліжко, [[wardrobe]] (US [[closet]]) — шафа, [[shelf]] — полиця, [[desk]] — письмовий стіл, [[fridge]] — холодильник.</p>
<p>[[There are three rooms in my flat: a living room, a bedroom and a small kitchen.]] [[The sofa is opposite the TV.]] [[My desk is next to the window.]]</p>
<div class="note"><b>⚠️ [[furniture]] — незлічуване:</b> [[some furniture]], [[a lot of furniture]] — без -s і без a. Один предмет — [[a piece of furniture]].</div>
<h3>Місто</h3>

<p>[[Excuse me, is there a pharmacy near here?]] — [[Yes, there's one opposite the bank.]] / [[Sorry, I'm not from here.]]</p>

  theory: `
<h3>Котра година?</h3>
<p>[[What time is it?]] або [[What's the time?]] (UK) — [[It's three o'clock.]] Час можна сказати двома способами.</p>
<div class="tblwrap"><table><tr><th>час</th><th>традиційно</th><th>як на годиннику</th></tr>
<tr><td>3:00</td><td>[[three o'clock]]</td><td>[[three]]</td></tr>
<tr><td>3:05</td><td>[[five past three]] (US також [[five after three]])</td><td>[[three oh five]]</td></tr>
<tr><td>3:15</td><td>[[quarter past three]]</td><td>[[three fifteen]]</td></tr>
<tr><td>3:30</td><td>[[half past three]]</td><td>[[three thirty]]</td></tr>
<tr><td>3:45</td><td>[[quarter to four]]</td><td>[[three forty-five]]</td></tr>
<tr><td>3:50</td><td>[[ten to four]]</td><td>[[three fifty]]</td></tr></table></div>
<p>До половини — <b>past</b> (після години), після половини — <b>to</b> (до наступної). Якщо хвилин не 5, 10, 20 чи 25, додають minutes: [[seven minutes past two]]. [[o'clock]] — лише для рівних годин: [[It's nine o'clock.]], але [[It's nine thirty.]]</p>
<div class="note"><b>⚠️ «Пів на четверту» — це [[half past three]]</b>, дослівно «пів після третьої»: рахуємо від години, яка вже минула, а не від наступної. Обережно: британське розмовне [[half four]] означає 4:30 (half past four), а не «пів на четверту».</div>
<p><b>a.m.</b> — до полудня, <b>p.m.</b> — після полудня: [[9 a.m.|nine a.m.]] — дев'ята ранку, [[9 p.m.|nine p.m.]] — дев'ята вечора. 24-годинний формат у розмові рідкісний: 18:00 — [[six p.m.]] або [[six in the evening]]. 12:00 — [[noon]] / [[midday]], 0:00 — [[midnight]].</p>
<h3>Дні тижня, місяці, пори року</h3>
<p>[[Monday]], [[Tuesday]], [[Wednesday]], [[Thursday]], [[Friday]], [[Saturday]], [[Sunday]].</p>
<p>[[January]], [[February]], [[March]], [[April]], [[May]], [[June]], [[July]], [[August]], [[September]], [[October]], [[November]], [[December]].</p>
<p>Пори року: [[spring]] — весна, [[summer]] — літо, [[autumn]] (UK) / [[fall]] (US) — осінь, [[winter]] — зима.</p>
<div class="note"><b>⚠️ Дні тижня й місяці — завжди з великої літери</b>, навіть посеред речення: [[on Monday]], [[in March]]. Пори року — з малої: [[in spring]].</div>
<div class="tip"><b>Вимова:</b> [[Wednesday]] [ˈwenzdeɪ] — перша d не читається (≈ «ВЕНЗ-дей»); не плутайте [[Tuesday]] [ˈtjuːzdeɪ] (US [ˈtuːzdeɪ]) і [[Thursday]] [ˈθɜːzdeɪ]; [[February]] [ˈfebruəri]. На календарях скорочують: Mon, Tue, Wed, Thu, Fri, Sat, Sun.</div>

<p><b>Злічувані</b> (countable) іменники можна порахувати: [[an apple]] — [[three apples]], [[a sandwich]] — [[two sandwiches]]. В однині перед ними стоїть [[a]] / [[an]], у множині — закінчення -s.</p>
