<p>Другий умовний (second conditional) — про ситуацію <b>уявну, нереальну або малоймовірну</b> зараз чи в майбутньому. В if-частині — Past Simple, хоча йдеться про теперішнє; у головній частині — [[would]] + початкова форма дієслова.</p>

<p>Частини можна міняти місцями; кома потрібна, лише коли if стоїть на початку: [[I would travel more if I had more time.]] Замість would можна вжити [[could]] (міг би) чи [[might]] (можливо, б): [[If I spoke better English, I could get a better job.]]</p>
<p>Питання: [[What would you do if you lost your job?]] [[Would you move abroad if you had the chance?]] Коротко: [[I'd]] = I would, [[wouldn't]] = would not.</p>

<h3>If I were you, I'd… — порада</h3>
<p>Найуживаніша фраза другого умовного: [[If I were you, I'd talk to your manager.]] — На твоєму місці я б поговорив з менеджером. [[If I were you, I wouldn't sign it.]] — На твоєму місці я б цього не підписував.</p>

<tr><td>[[If it rains tomorrow, we'll stay at home.]] — Цілком можливо.</td><td>[[If I lived by the sea, I'd swim every day.]] — Але я там не живу.</td></tr>

<div class="good"><b>Як в українській:</b> «якщо» ≈ first conditional, «якби» ≈ second conditional. Якщо в українському реченні проситься «якби… б», майже напевно потрібен другий умовний.</div>

<h3>wish і If only — шкода, що зараз не так</h3>
<p><b>wish + Past Simple</b> — хочеться, щоб зараз було інакше (але так не є):</p>

<p>Як і після if, після wish можна вживати <b>were</b>: [[I wish I were taller.]] (у розмові — [[I wish I was taller.]]).</p>

  theory: `
<h3>Пряма й непряма мова</h3>
<p>Пряма мова цитує дослівно: [[Anna said, "I'm tired."]] Непряма переказує своїми словами: [[Anna said that she was tired.]] — Анна сказала, що втомилася. Сполучник [[that]] у розмові часто пропускають: [[Anna said she was tired.]]</p>

<h3>Узгодження часів (backshift)</h3>
<p>Якщо дієслово переказу стоїть у минулому (<b>said, told, asked</b>), час переказаних слів зазвичай зсувається на крок у минуле:</p>
<div class="tblwrap"><table><tr><th>було</th><th>стало</th><th>приклад</th></tr>
<tr><td>Present Simple</td><td>Past Simple</td><td>[["I work from home."]] → [[She said she worked from home.]]</td></tr>
<tr><td>am / is / are</td><td>was / were</td><td>[["I'm busy."]] → [[He said he was busy.]]</td></tr>
<tr><td>Present Continuous</td><td>Past Continuous</td><td>[["We're waiting."]] → [[They said they were waiting.]]</td></tr>
<tr><td>Present Perfect</td><td>Past Perfect</td><td>[["I've finished."]] → [[He said he had finished.]]</td></tr>
<tr><td>Past Simple</td><td>Past Perfect (у розмові часто без змін)</td><td>[["I lost my keys."]] → [[She said she had lost her keys.]]</td></tr>
<tr><td>will</td><td>would</td><td>[["I'll call you."]] → [[He said he would call me.]]</td></tr>
<tr><td>can</td><td>could</td><td>[["I can help."]] → [[She said she could help.]]</td></tr>
<tr><td>must / have to</td><td>had to</td><td>[["I have to go."]] → [[He said he had to go.]]</td></tr></table></div>
<p>Не змінюються: <b>would, could, should, might</b> і Past Perfect. Займенники міняються за змістом: [["I like your idea."]] → [[She said she liked my idea.]]</p>
<div class="note"><b>⚠️ В українській часи не зсуваються.</b> «Він сказав, що <i>зайнятий</i>» — теперішній час, хоча «сказав» — минулий. Англійською зазвичай [[He said he was busy.]], а не «He said he is busy». Так само «Вона сказала, що прийде» → [[She said she would come.]], а не «she will come».</div>
<div class="good"><b>Коли можна не зсувати.</b> Якщо сказане й досі правда, час можна залишити: [[She said she lives in Bratislava.]] (вона там і живе) — так само правильно, як [[She said she lived in Bratislava.]] Якщо дієслово переказу в теперішньому (<b>says</b>), зсуву немає взагалі: [[He says he's busy.]] [[The forecast says it will rain.]]</div>

<h3>Слова часу й місця</h3>
<p>Переказуєте іншого дня чи в іншому місці — міняються й слова часу та місця:</p>
<div class="tblwrap"><table><tr><th>було</th><th>стало</th></tr>
<tr><td>[[now]]</td><td>[[then]], [[at that moment]]</td></tr>
<tr><td>[[today]], [[tonight]]</td><td>[[that day]], [[that night]]</td></tr>
<tr><td>[[tomorrow]]</td><td>[[the next day]], [[the following day]]</td></tr>
<tr><td>[[yesterday]]</td><td>[[the day before]], [[the previous day]]</td></tr>
<tr><td>[[next week]]</td><td>[[the following week]]</td></tr>
<tr><td>[[last week]]</td><td>[[the week before]]</td></tr>
<tr><td>[[two days ago]]</td><td>[[two days before]], [[two days earlier]]</td></tr>
<tr><td>[[here]]</td><td>[[there]]</td></tr>
<tr><td>[[this]]</td><td>[[that]]</td></tr></table></div>
<p>Приклад: [["I'll finish it tomorrow."]] → [[He said he would finish it the next day.]] Але якщо «завтра» ще не настало, можна залишити: [[He said he'd finish it tomorrow.]]</p>

<h3>say чи tell?</h3>
<p><b>tell</b> — завжди з тим, <b>кому</b> кажуть, і без to: [[She told me she was leaving.]] [[He told us the truth.]]<br>
<b>say</b> — без особи або з <b>to</b>: [[She said she was leaving.]] [[What did he say to you?]]</p>
<div class="tblwrap"><table><tr><th>✅ так</th><th>❌ не так</th></tr>
<tr><td>[[She told me…]]</td><td>She said me…</td></tr>
<tr><td>[[She said to me…]]</td><td>She told to me…</td></tr>
<tr><td>[[He said that…]]</td><td>He told that…</td></tr></table></div>
<p>Сталі вирази: [[tell the truth]], [[tell a lie]], [[tell a story]], [[tell a joke]]; [[say hello]], [[say goodbye]], [[say sorry]], [[say no]].</p>

<h3>Переказ питань</h3>
<p>У переказаному питанні — <b>звичайний порядок слів</b> (підмет перед дієсловом), без do / does / did і без знака питання:</p>
<ul><li>[["Where do you live?"]] → [[She asked me where I lived.]]</li>
<li>[["What time is it?"]] → [[He asked what time it was.]]</li>
<li>[["Why are you late?"]] → [[My boss asked why I was late.]]</li></ul>
<p>Питання «так чи ні» переказуємо через <b>if</b> або <b>whether</b> («чи»):</p>
<ul><li>[["Are you coming?"]] → [[He asked if I was coming.]]</li>
<li>[["Did you get my email?"]] → [[She asked whether I had received her email.]]</li></ul>
<div class="note"><b>⚠️ Пастка: питальний порядок слів.</b> Українською «Він запитав, де я живу» — звичайний порядок, але учні за звичкою вставляють англійське питання: «He asked where do I live». Правильно: [[He asked where I lived.]] Те саме у ввічливих непрямих питаннях: [[Can you tell me where the station is?]] [[Do you know what time it starts?]]</div>

<h3>Переказ прохань і наказів: to + дієслово</h3>
<ul><li>[["Please wait."]] → [[He asked me to wait.]]</li>
<li>[["Don't be late!"]] → [[She told me not to be late.]]</li>
<li>[["Could you send me the file?"]] → [[My colleague asked me to send her the file.]]</li></ul>
<p>Заперечення — <b>not to</b>: [[He told me not to worry.]], а не «told me don't worry».</p>

<h3>Дієслова переказу замість said</h3>
<p>Точне дієслово робить переказ живим і коротким. Запам'ятовуйте його разом із конструкцією (sb = somebody, хтось):</p>

<tr><td>[[admit]]</td><td>admit (that)… / admit + -ing</td><td>[[He admitted that he had made a mistake.]]</td></tr>

<tr><td>[[refuse]]</td><td>refuse to…</td><td>[[He refused to sign the contract.]]</td></tr>
<tr><td>[[offer]]</td><td>offer to…</td><td>[[She offered to help me.]]</td></tr>
<tr><td>[[agree]]</td><td>agree to… / agree that…</td><td>[[The manager agreed to give us more time.]]</td></tr>
<tr><td>[[warn]]</td><td>warn sb (not) to… / warn sb that…</td><td>[[They warned us not to swim there.]]</td></tr>
<tr><td>[[remind]]</td><td>remind sb to…</td><td>[[She reminded me to call the bank.]]</td></tr>

  theory: `
<h3>Модальні дієслова для висновків</h3>
<p>Модальні дієслова означають не лише «треба» чи «можна» — вони показують, <b>наскільки ми впевнені</b> у своєму висновку. Після них — початкова форма без to: [[She must be at home.]]</p>
<div class="tblwrap"><table><tr><th>впевненість</th><th>модальне</th><th>приклад</th></tr>
<tr><td>майже напевно так</td><td>[[must]]</td><td>[[The lights are on. She must be at home.]] — Світло горить. Вона, мабуть, удома.</td></tr>

<p>Висновок спирається на факти: що ми бачимо, чуємо чи знаємо. [[You've been travelling all day. You must be exhausted.]] — Ти весь день у дорозі. Ти, мабуть, страшенно втомився.</p>
<div class="note"><b>⚠️ must — не лише «мусити».</b> [[You must be tired.]] — це не «ти мусиш бути втомленим», а «ти, мабуть, утомився» (бачу з твого вигляду). А [[You must be on time.]] — справді обов'язок: «ти мусиш бути вчасно». Яке з двох значень — підказує контекст.</div>
<div class="note"><b>⚠️ Протилежність must-висновку — can't, а не mustn't.</b> «Він не може бути вдома — його машини немає» → [[He can't be at home — his car isn't here.]] А [[mustn't]] означає заборону: [[You mustn't smoke here.]] — Тут не можна палити.</div>

<h3>must / might / can't + be + -ing: що відбувається зараз</h3>
<ul><li>[[He isn't answering. He must be driving.]] — Не відповідає. Мабуть, за кермом.</li>
<li>[[They might be having lunch.]] — Можливо, вони обідають.</li>
<li>[[She can't be sleeping — I can hear music in her room.]] — Не може бути, щоб вона спала: у її кімнаті грає музика.</li></ul>

<h3>may, might чи could?</h3>
<p>У значенні «можливо» всі три майже однакові: [[It might rain later.]] = [[It may rain later.]] = [[It could rain later.]] might — найчастіше в розмові, may — трохи офіційніше. Заперечення [[might not]] / [[may not]] — «можливо, ні»: [[He might not know about it.]] — Можливо, він про це не знає. А [[couldn't]] — «неможливо», як can't: [[It couldn't be him — he's on holiday.]]</p>
<div class="tip"><b>Не плутайте:</b> [[maybe]] — одне слово, прислівник «можливо»; [[may be]] — два слова, дієслово: [[Maybe she's ill.]] = [[She may be ill.]]<br><b>US / UK:</b> [[on holiday]] (UK) = [[on vacation]] (US). [[can't]] британці вимовляють /kɑːnt/, американці — /kænt/. В американській вимові can't легко сплутати з can, тож слухайте наголос: can't завжди наголошене, а can у реченні — ні (/kən/).</div>

<h3>Інші способи висловити здогад</h3>
<div class="tblwrap"><table><tr><th>вираз</th><th>значення</th><th>приклад</th></tr>
<tr><td>[[probably]]</td><td>мабуть, імовірно</td><td>[[She's probably at home.]] [[He probably forgot.]]</td></tr>
<tr><td>[[I bet…]]</td><td>б'юся об заклад; точно (розм.)</td><td>[[I bet he's still asleep.]]</td></tr>
<tr><td>[[It looks like…]]</td><td>схоже, що…</td><td>[[It looks like it's going to rain.]]</td></tr>
<tr><td>[[look]] + прикметник</td><td>мати вигляд</td><td>[[You look exhausted.]]</td></tr>
<tr><td>[[seem]] / [[appear]]</td><td>здаватися (appear — офіційніше)</td><td>[[She seems upset.]] [[The system appears to be down.]]</td></tr>
<tr><td>[[I guess…]]</td><td>мабуть, напевно (розм., особливо в US)</td><td>[[I guess you're right.]]</td></tr></table></div>
<p>Порядок слів: <b>probably</b> стоїть після be ([[She's probably tired.]]), але перед іншим дієсловом ([[He probably knows.]]).</p>
<div class="good"><b>Як в українській:</b> «мабуть», «напевно», «можливо», «не може бути» мають чіткі англійські пари: must, might / may / could, can't. Тренуйтеся «перекладати» свої здогади: «Він, мабуть, утомився» → [[He must be tired.]] «Може, вона на нараді» → [[She might be in a meeting.]]</div>

<h3>Почуття: -ed чи -ing?</h3>
<p>Щоб робити висновки про людей, потрібні слова-почуття. Прикметник на <b>-ed</b> — що людина <b>відчуває</b>, на <b>-ing</b> — що це почуття <b>викликає</b>:</p>

<h3>Навіщо відносні речення</h3>
<p>Відносне (означальне) речення пояснює іменник: про кого чи про що саме йдеться. Українською воно починається словами «який», «що», «чий», «де», англійською — <b>відносними займенниками</b> who, which, that, whose і словами where, when.</p>
<p>[[The app that I use for notes is free.]] — Застосунок, яким я користуюся для нотаток, безкоштовний.<br>
[[I have a colleague who knows everything about computers.]] — У мене є колега, який знає про комп'ютери все.</p>
<div class="tblwrap"><table><tr><th>слово</th><th>про що</th><th>приклад</th></tr>
<tr><td>[[who]]</td><td>люди</td><td>[[the engineer who fixed my laptop]] — інженер, який полагодив мій ноутбук</td></tr>
<tr><td>[[which]]</td><td>речі, тварини, ідеї</td><td>[[the phone which I bought last year]] — телефон, який я купив торік</td></tr>
<tr><td>[[that]]</td><td>і люди, і речі (лише без ком!)</td><td>[[the charger that came with the phone]] — зарядка, що була в комплекті з телефоном</td></tr>
<tr><td>[[whose]]</td><td>чий (належність)</td><td>[[the user whose account was hacked]] — користувач, чий акаунт зламали</td></tr>
<tr><td>[[where]]</td><td>місце</td><td>[[the shop where I bought my laptop]] — магазин, де я купив ноутбук</td></tr>
<tr><td>[[when]]</td><td>час</td><td>[[the day when the servers went down]] — день, коли впали сервери</td></tr>
<tr><td>[[whom]]</td><td>кого, кому (офіційно)</td><td>[[the person to whom I spoke]] — особа, з якою я говорив</td></tr></table></div>

<h3>Два типи: defining і non-defining</h3>
<p><b>Означальне (defining)</b> речення потрібне, щоб зрозуміти, про кого чи про що мова. Без нього речення втрачає сенс. <b>Ком немає.</b></p>
<p>[[People who work from home need a good internet connection.]] — Людям, які працюють з дому, потрібен добрий інтернет. (не всім людям — лише тим, хто працює з дому)<br>
[[The password that you entered is incorrect.]] — Пароль, який ви ввели, неправильний.</p>
<p><b>Додаткове (non-defining)</b> речення лише додає інформацію про того, кого й так зрозуміло: людину з іменем, «мого брата», «мій ноутбук», місто. Його можна викинути, і сенс не зміниться. <b>Виділяється комами</b> з обох боків (або комою і крапкою в кінці).</p>
<p>[[My brother, who lives in Kyiv, is a doctor.]] — Мій брат, який живе в Києві, — лікар.<br>
[[My laptop, which I bought two years ago, is already slow.]] — Мій ноутбук, який я купив два роки тому, уже повільний.<br>
[[I live in Bratislava, where rents are quite high.]] — Я живу в Братиславі, де оренда досить дорога.</p>
<div class="tblwrap"><table><tr><th></th><th>defining</th><th>non-defining</th></tr>
<tr><td>коми</td><td>немає</td><td>є</td></tr>
<tr><td>that</td><td>можна</td><td><b>не можна</b> — лише who / which</td></tr>
<tr><td>пропустити займенник</td><td>можна, якщо далі йде свій підмет</td><td><b>ніколи</b></td></tr>
<tr><td>навіщо</td><td>визначає, про кого чи що мова</td><td>додає інформацію «між іншим»</td></tr>
<tr><td>у мовленні</td><td>без пауз</td><td>паузи на місці ком</td></tr></table></div>
<p>Коми можуть змінити зміст: [[My sister who lives in London is a designer.]] — у мене кілька сестер, і та, що живе в Лондоні, — дизайнерка. [[My sister, who lives in London, is a designer.]] — сестра одна; до речі, вона живе в Лондоні.</p>
<div class="note"><b>⚠️ Коми не як в українській.</b> В українській кома стоїть перед кожним підрядним реченням: «Чоловік, який мені допоміг, був дуже добрим». В англійській означальне речення комами <b>не виділяється</b>: [[The man who helped me was very kind.]] Кома перед who чи which — лише тоді, коли інформація додаткова. Перевірка: викиньте підрядне речення. Якщо й далі зрозуміло, про кого мова, — коми потрібні; якщо ні — ком немає.</div>
<div class="tip"><b>Як звучить:</b> на місці ком у non-defining реченні — коротка пауза, а підрядне вимовляється трохи тихіше, ніби в дужках: [[My brother, who lives in Kyiv, is a doctor.]] У defining реченні пауз немає: [[The man who helped me was very kind.]]</div>

<h3>that, which чи who?</h3>
<ul><li>У defining реченнях про речі в розмові найчастіше звучить [[that]]: [[the phone that I lost]]. [[which]] теж правильне, трохи офіційніше; у британській англійській трапляється частіше, ніж в американській.</li>
<li>Про людей — [[who]] або [[that]]: [[the guy who sold me the phone]] = [[the guy that sold me the phone]]. who — природніше.</li>
<li>Після [[everything]], [[something]], [[anything]], [[nothing]], [[all]], [[the only]] і найвищого ступеня прикметника — майже завжди [[that]]: [[Is there anything that I can do?]] [[This is the best app that I've ever used.]] [[All that I need is a charger.]]</li>
<li>У non-defining — лише who чи which: [[Anna, who is our team leader, is on holiday.]]</li></ul>

<h3>Коли займенник можна пропустити</h3>
<p>У defining реченні займенник можна (а в розмові зазвичай так і роблять) пропустити, якщо він <b>додаток</b> (object), тобто після нього йде свій підмет:</p>
<p>[[The app that I downloaded yesterday doesn't work.]] → [[The app I downloaded yesterday doesn't work.]] (після that — підмет I)<br>
[[Is this the charger that you were looking for?]] → [[Is this the charger you were looking for?]]</p>
<p>Якщо займенник — <b>підмет</b> підрядного (одразу після нього дієслово), пропускати не можна: [[The app that helps me learn English is free.]] — не «The app helps me learn English is free».</p>
<div class="good"><b>Підказка для слухання.</b> Носії постійно «ковтають» that: [[the film we watched]], [[the people I work with]], [[something you said]]. Почули іменник, а одразу за ним новий підмет (the film + we) — там захований that.</div>

<h3>whose — чий</h3>
<p>[[whose]] показує належність і вживається і про людей, і про речі чи компанії: [[I have a friend whose son is a programmer.]] — У мене є друг, син якого — програміст. [[That's the company whose app everyone uses.]] — Це компанія, чий застосунок усі використовують.</p>
<div class="tip"><b>Вимова:</b> [[whose]] і [[who's]] (= who is / who has) звучать однаково — /huːz/. Пишуться по-різному: [[Whose phone is this?]] — Чий це телефон? [[Who's calling?]] — Хто телефонує?</div>

<h3>where і when</h3>
<p>[[This is the café where we first met.]] — Це кафе, де ми вперше зустрілися.<br>
[[I remember the day when I got my first smartphone.]] — Пам'ятаю день, коли я отримав свій перший смартфон.</p>
<p>when у defining реченні можна замінити на that або пропустити: [[the day I got my first smartphone]]. Замість where у розмові кажуть з прийменником у кінці: [[the café we first met at]].</p>

<h3>which про цілу ситуацію</h3>
<p>Якщо «що» стосується не одного слова, а всього попереднього речення, вживаємо which — завжди після коми:</p>
<p>[[He was late again, which annoyed everyone.]] — Він знову запізнився, що всіх роздратувало.<br>
[[My phone died in the middle of the call, which was really embarrassing.]] — Телефон розрядився посеред дзвінка, і це було дуже незручно.<br>
[[The update deleted all my settings, which means I have to start again.]] — Оновлення стерло всі мої налаштування, а отже, доведеться починати спочатку.</p>
<div class="note"><b>⚠️ Не what!</b> Українське «що» так і тягне на what, але тут правильно лише which: не «He was late, what annoyed everyone», а [[He was late, which annoyed everyone.]]</div>

<h3>Прийменник у кінці</h3>
<p>Українською прийменник стоїть перед «який»: «людина, з якою я говорив», «застосунок, про який я тобі казав». В англійській розмові прийменник іде <b>в кінець</b>, а займенник зазвичай випадає:</p>
<p>[[the person I talked to]] — людина, з якою я говорив<br>
[[the app I told you about]] — застосунок, про який я тобі казав<br>
[[the team she works with]] — команда, з якою вона працює</p>
<p>В офіційних текстах прийменник ставлять перед [[whom]] (люди) чи [[which]] (речі): [[the person to whom I spoke]], [[the project on which we are working]]. Після прийменника — лише whom чи which, ніколи that чи who.</p>
<div class="note"><b>⚠️ Не дублюйте займенник.</b> him, it, them у кінці не повторюють: не «the person I talked to him», а [[the person I talked to]]; не «the laptop which I bought it», а [[the laptop which I bought]].</div>

<h3>«Я хочу, щоб ти…» — want someone to do</h3>
<p>Коли хочемо, просимо, радимо чи очікуємо, щоб <b>інша людина</b> щось зробила, модель така: <b>дієслово + людина (me, you, him, her, us, them) + to + дієслово</b>.</p>
<div class="tblwrap"><table><tr><th>дієслово</th><th>приклад</th></tr>
<tr><td>want, would like</td><td>[[I want you to come.]] — Я хочу, щоб ти прийшов. [[I'd like you to meet my colleague.]]</td></tr>
<tr><td>ask, tell</td><td>[[My manager asked me to prepare a report.]] [[She told us to wait outside.]]</td></tr>
<tr><td>expect, need</td><td>[[I expect you to be on time.]] [[We need you to sign this form.]]</td></tr>
<tr><td>allow, force</td><td>[[They don't allow us to work from home.]] [[Nobody forced you to stay.]]</td></tr>
<tr><td>advise, encourage</td><td>[[The doctor advised him to rest.]] [[My teacher encouraged me to apply.]]</td></tr>
<tr><td>persuade, get</td><td>[[She persuaded me to join the team.]] [[I'll get someone to fix it.]] (get — домогтися, щоб хтось зробив)</td></tr>
<tr><td>remind, warn, teach</td><td>[[Remind me to call the bank.]] [[He warned us not to touch it.]] [[My dad taught me to drive.]]</td></tr></table></div>
<p>Заперечення — <b>not перед to</b>: [[He told me not to worry.]] — Він сказав мені не хвилюватися. [[I asked them not to be late.]]</p>
<p>Після дієслова — <b>об'єктна форма</b> займенника: [[I want him to call me.]] (не «I want he…»).</p>
<div class="note"><b>⚠️ Головна пастка B1: «I want that you…»</b> Українське «хочу, щоб ти прийшов» так і проситься в «I want that you come». Такої моделі в англійській немає! Правильно лише: [[I want you to come.]]<br>
«Я хочу, щоб ви знали…» — [[I want you to know…]]<br>
«Він попросив, щоб я допоміг» — [[He asked me to help.]]<br>
«Бос хоче, щоб звіт був готовий до п'ятниці» — [[My boss wants the report to be ready by Friday.]]</div>
<div class="note"><b>⚠️ suggest — інакше.</b> Після [[suggest]] модель «людина + to» не працює: не «He suggested us to leave», а [[He suggested leaving early.]] або [[He suggested that we leave early.]]</div>

<h3>make і let — без to</h3>
<p>Після [[make]] (змусити) і [[let]] (дозволити) інфінітив іде <b>без to</b>:</p>
<p>[[My boss made me redo the presentation.]] — Бос змусив мене переробити презентацію.<br>
[[Sad films always make me cry.]] — Від сумних фільмів я завжди плачу.<br>
[[My parents let me stay up late.]] — Батьки дозволяли мені пізно лягати.<br>
[[Let me help you.]] — Давай я тобі допоможу. [[Let me know.]] — Дай знати.</p>
<div class="tblwrap"><table><tr><th>активна форма</th><th>пасив</th></tr>
<tr><td>[[They made me wait.]] — без to</td><td>[[I was made to wait.]] — to повертається!</td></tr>
<tr><td>[[They let us leave early.]] = [[They allowed us to leave early.]]</td><td>let пасиву не має → [[We were allowed to leave early.]]</td></tr></table></div>
<div class="note"><b>⚠️ Не «made me to do».</b> Українське «змусив мене зробити» підштовхує додати to, але після make і let його немає: [[She made me laugh.]] [[Let me think.]] Порівняйте: [[force]] і [[allow]] беруть to: [[They forced me to sign.]] [[They allowed me to leave.]]</div>

<h3>help — з to або без</h3>
<p>Обидва варіанти правильні; без to — частіше, особливо в американській англійській: [[Can you help me move the sofa?]] = [[Can you help me to move the sofa?]] [[This app helps you learn new words.]]</p>

<h3>would rather і had better</h3>
<p>Після обох — інфінітив <b>без to</b>; у розмові обидва скорочуються до <b>'d</b>.</p>
<div class="tblwrap"><table><tr><th>вираз</th><th>значення</th><th>приклади</th></tr>
<tr><td><b>would rather</b> ('d rather)</td><td>я б краще (вподобання)</td><td>[[I'd rather stay at home tonight.]] [[I'd rather not talk about it.]] [[I'd rather walk than take the bus.]]</td></tr>
<tr><td><b>had better</b> ('d better)</td><td>краще б тобі… (порада з натяком на неприємні наслідки)</td><td>[[You'd better leave now, or you'll miss the train.]] [[We'd better not be late.]]</td></tr></table></div>
<div class="note"><b>⚠️ Без to і без -ing:</b> не «I'd rather to stay», не «You'd better to go». І had better стосується <b>теперішнього чи майбутнього</b>, хоча форма — had: [[You'd better call her today.]] Заперечення — not після better: [[You'd better not tell anyone.]]</div>
<div class="tip"><b>Як звучить:</b> у швидкому мовленні [[You'd better go.]] часто звучить як «You better go» — 'd майже не чути. На письмі 'd не пропускайте.</div>

[[I was supposed to call her yesterday, but I forgot.]] — Я мав їй учора подзвонити, але забув.</p>

  theory: `
<h3>Як висловити думку</h3>
<p>[[I think]] — найпростіше, але на B1 варто мати кілька варіантів, щоб не повторюватися:</p>
<div class="tblwrap"><table><tr><th>фраза</th><th>відтінок</th><th>приклад</th></tr>
<tr><td>[[I think]], [[I believe]]</td><td>я думаю; я переконаний (believe — сильніше)</td><td>[[I believe everyone deserves a second chance.]]</td></tr>
<tr><td>[[In my opinion]], [[In my view]]</td><td>на мою думку (нейтрально, і усно, і письмово)</td><td>[[In my opinion, the plan is too risky.]]</td></tr>
<tr><td>[[As far as I'm concerned]]</td><td>як на мене</td><td>[[As far as I'm concerned, the price is too high.]]</td></tr>
<tr><td>[[It seems to me that]]</td><td>мені здається (м'якше)</td><td>[[It seems to me that we need more time.]]</td></tr>
<tr><td>[[Personally]]</td><td>особисто я</td><td>[[Personally, I prefer working in the office.]]</td></tr>
<tr><td>[[I'd say]]</td><td>я б сказав (обережно)</td><td>[[I'd say it's worth trying.]]</td></tr>
<tr><td>[[If you ask me]]</td><td>якщо хочете знати мою думку (розмовне)</td><td>[[If you ask me, it's a waste of money.]]</td></tr></table></div>
<div class="note"><b>⚠️ «Я згоден» — не «I am agree».</b> [[agree]] — дієслово, а не прикметник, тож to be не потрібне: [[I agree.]] [[I don't agree.]] [[Do you agree?]] І не кажіть «In my opinion, I think…» — це двічі те саме: або [[In my opinion, …]], або [[I think…]]</div>

<h3>Згода й незгода</h3>
<div class="tblwrap"><table><tr><th>повна згода</th><th>часткова згода</th><th>ввічлива незгода</th></tr>
<tr><td>[[I totally agree.]]<br>[[Exactly!]]<br>[[Absolutely.]]<br>[[I couldn't agree more.]]<br>[[That's a good point.]]</td>
<td>[[I see what you mean, but…]]<br>[[That's true, but…]]<br>[[I agree up to a point.]]<br>[[Maybe, but on the other hand…]]</td>
<td>[[I'm not sure about that.]]<br>[[I'm afraid I disagree.]]<br>[[I see it differently.]]<br>[[I take your point, but…]]<br>[[I don't think that's quite right.]]</td></tr></table></div>
<div class="note"><b>⚠️ Пряма незгода звучить грубо.</b> Українською «Ні, це не так» на нараді — нормально. Англійською пряме [[You're wrong.]] чи [[No, that's a bad idea.]] звучить різко, особливо для британців. Пом'якшуйте: [[I'm afraid…]], [[I'm not sure…]], [[Actually, …]] і спершу визнайте думку співрозмовника: [[I see what you mean, but…]]</div>
<div class="tip"><b>Як звучить:</b> [[I couldn't agree more.]] — повна згода («згоден на всі сто»), хоча в реченні є not. Наголос — на more.</div>

<h3>Протиставлення: although, despite, however</h3>
<p>Усі перекладаються як «хоча», «незважаючи на», «однак», але після них ідуть <b>різні конструкції</b>:</p>
<div class="tblwrap"><table><tr><th>слово</th><th>після нього</th><th>приклад</th></tr>
<tr><td>[[although]], [[though]], [[even though]]</td><td>речення (підмет + дієслово)</td><td>[[Although it was raining, we went for a walk.]]<br>[[We went for a walk even though it was raining.]]</td></tr>
<tr><td>[[despite]], [[in spite of]]</td><td>іменник або -ing</td><td>[[Despite the rain, we went for a walk.]]<br>[[In spite of being tired, she finished the report.]]</td></tr>
<tr><td>[[despite the fact that]]</td><td>речення</td><td>[[Despite the fact that it was raining, we went out.]]</td></tr>
<tr><td>[[however]]</td><td>нове речення; на початку — з комою</td><td>[[The plan is good. However, it's too expensive.]]</td></tr>
<tr><td>[[but]]</td><td>друга частина того самого речення</td><td>[[The plan is good, but it's too expensive.]]</td></tr></table></div>
<p>[[even though]] — сильніше за although («попри те що»). [[though]] — розмовне; може стояти й у кінці речення в значенні «утім»: [[The hotel was expensive. The view was amazing, though.]]</p>
<div class="note"><b>⚠️ Три пастки з «хоча» і «незважаючи на».</b><br>
1) <b>«despite of» не існує.</b> Або [[despite the rain]], або [[in spite of the rain]].<br>
2) <b>«Хоча…, але…»</b> Українською «Хоча було пізно, але ми працювали» — нормально. Англійською — лише одне з двох: [[Although it was late, we kept working.]] або [[It was late, but we kept working.]]<br>
3) <b>despite + речення</b> — помилка: не «Despite it was late», а [[Although it was late]] чи [[Despite the late hour]].</div>

<h3>Причина: because, because of, due to, since</h3>
<ul><li>[[because]] + речення: [[I stayed at home because I was ill.]]</li>
<li>[[because of]] + іменник: [[The flight was cancelled because of the storm.]] (не «because the storm»)</li>
<li>[[due to]] + іменник — офіційніше: [[The delay was due to technical problems.]]</li>
<li>[[since]], [[as]] + речення — коли причина вже відома: [[Since you're here, let's start.]] [[As it was late, we took a taxi.]]</li></ul>
<h3>Результат: so, therefore, as a result</h3>
<ul><li>[[so]] — розмовне, у тому самому реченні після коми: [[It was late, so we took a taxi.]]</li>
<li>[[therefore]] — офіційне «отже»: [[Costs are rising. Therefore, we need a new plan.]]</li>
<li>[[as a result]] — «у результаті»: [[The app crashed. As a result, we lost all the data.]]</li></ul>
<h3>Мета: to, in order to, so that</h3>
<ul><li>[[to]], [[in order to]] + дієслово (in order to — офіційніше): [[I'm learning English to get a better job.]] [[We met early in order to discuss the budget.]]</li>
<li>[[so that]] + речення (часто з can, could, will, would), особливо коли в другій частині інший підмет: [[I'm saving money so that my kids can study abroad.]] [[Speak slowly so that everyone understands.]]</li>
<li>«щоб не»: [[in order not to]] + дієслово або so that + заперечення: [[I left early in order not to miss the train.]] [[I set an alarm so that I wouldn't oversleep.]]</li></ul>
<div class="note"><b>⚠️ «щоб» — це to, а не for.</b> «Я прийшов, щоб допомогти» — [[I came to help.]] Не «I came for help» — це «я прийшов по допомогу». І не «for to help» — такої форми немає.</div>

<h3>Як побудувати аргумент</h3>
<p>Сильна відповідь у дискусії чи на іспиті має чотири кроки: <b>думка → причина → приклад → висновок</b>. Слова для порядку: [[Firstly]], [[Secondly]], [[Finally]]; для прикладу: [[For example]], [[For instance]].</p>
<p>[[In my opinion, companies should allow remote work.]] [[Firstly, people save a lot of time on commuting.]] [[For example, I spend two hours a day in traffic.]] [[Secondly, many people concentrate better at home.]] [[Although some managers worry about control, results are easy to measure.]] [[Therefore, I think remote work benefits everyone.]]</p>
<div class="good"><b>Добра новина:</b> схема та сама, що в шкільному творі-міркуванні: теза, аргументи, приклади, висновок. Потрібні лише англійські слова-зв'язки.</div>`,

  theory: `
<h3>Непрямі питання — ввічливіше й м'якше</h3>
<p>Пряме питання незнайомій людині ([[Where is the station?]]) звучить нормально, але трохи різко. Ввічливіше «загорнути» його у вступну фразу:</p>
<p>[[Could you tell me…?]] [[Do you know…?]] [[Do you have any idea…?]] [[I wonder…]] [[I was wondering…]] [[Would you mind telling me…?]] [[Can I ask…?]]</p>
<p><b>Правило:</b> після вступної фрази — <b>порядок слів як у ствердженні</b> (підмет + дієслово) і <b>без do, does, did</b>.</p>
<div class="tblwrap"><table><tr><th>пряме питання</th><th>непряме</th></tr>
<tr><td>[[Where is the station?]]</td><td>[[Could you tell me where the station is?]]</td></tr>
<tr><td>[[What time does the meeting start?]]</td><td>[[Do you know what time the meeting starts?]]</td></tr>
<tr><td>[[Where did you buy it?]]</td><td>[[Can I ask where you bought it?]]</td></tr>
<tr><td>[[How much is this?]]</td><td>[[Could you tell me how much this is?]]</td></tr>
<tr><td>[[Is he coming?]]</td><td>[[Do you know if he's coming?]]</td></tr>
<tr><td>[[Have they finished?]]</td><td>[[I wonder whether they've finished.]]</td></tr></table></div>
<ul><li>Питання без питального слова (так чи ні) → [[if]] або [[whether]] (whether — трохи офіційніше).</li>
<li>do, does, did зникає, а дієслово «забирає» його форму: does start → [[starts]], did buy → [[bought]].</li>
<li>Знак питання — якщо вступна фраза сама питання ([[Do you know…?]]); крапка — якщо це ствердження ([[I wonder what time it starts.]]).</li></ul>
<div class="good"><b>Уже знайоме:</b> це те саме правило, що й у непрямій мові з уроку B1.5: [[He asked me where I lived.]]</div>
<div class="note"><b>⚠️ Не «where is the station».</b> Українською порядок слів вільний: «Не підкажете, де вокзал?» В англійській на цьому помиляються навіть на B2: «Could you tell me where <b>is</b> the station?» Правильно: [[Could you tell me where the station is?]] Так само не «Do you know what time <b>does</b> it start?», а [[Do you know what time it starts?]]</div>
<div class="tip"><b>Вимова:</b> [[whether]] і [[weather]] у більшості акцентів звучать однаково — /ˈweðə/. Розрізняємо за змістом.</div>

<h3>Question tags — «так?», «правда ж?»</h3>
<p>Короткий «хвостик» у кінці речення, щоб перепитати чи запросити до згоди. Правило: <b>ствердне речення → заперечний tag</b>, <b>заперечне речення → ствердний tag</b>. Беремо допоміжне дієслово з речення (be, do, have, can, will…) і займенник.</p>
<div class="tblwrap"><table><tr><th>речення</th><th>звідки tag</th></tr>
<tr><td>[[It's cold today, isn't it?]]</td><td>be → isn't</td></tr>
<tr><td>[[You don't smoke, do you?]]</td><td>заперечне речення → ствердний tag</td></tr>
<tr><td>[[She works here, doesn't she?]]</td><td>Present Simple → do, does</td></tr>
<tr><td>[[They arrived yesterday, didn't they?]]</td><td>Past Simple → did</td></tr>
<tr><td>[[You've been to London, haven't you?]]</td><td>have</td></tr>
<tr><td>[[He can drive, can't he?]]</td><td>модальне → те саме модальне</td></tr>
<tr><td>[[You'll help me, won't you?]]</td><td>will → won't</td></tr></table></div>
<p><b>Особливі випадки:</b></p>
<ul><li>[[I'm right, aren't I?]] — після I am tag [[aren't I]] (форми «amn't» немає).</li>
<li>[[Let's go, shall we?]] — після Let's завжди [[shall we]].</li>
<li>[[Close the door, will you?]] — після наказу: [[will you]], [[would you]], [[could you]].</li>
<li>[[Nobody called, did they?]] [[Nothing happened, did it?]] — nobody, nothing, never уже заперечні, тож tag ствердний; про людей — they.</li>
<li>[[There's a problem, isn't there?]] — з there is tag теж з there.</li>
<li>[[That was fun, wasn't it?]] — this і that у tag стають it.</li></ul>
<div class="tip"><b>Інтонація змінює зміст.</b> ↘ <b>Спадна</b> — ви впевнені й просто чекаєте на згоду (типовий small talk): [[Nice day, isn't it?]] ↗ <b>Висхідна</b> — справжнє питання, ви не впевнені: [[You're coming tomorrow, aren't you?]] Повторюйте обидва варіанти вголос.</div>
<div class="good"><b>Простий запасний варіант:</b> як українське «так?», у розмові можна сказати [[right?]] — воно не залежить від дієслова: [[You're from Kyiv, right?]] [[We start at nine, right?]] Особливо часто — в американській англійській.</div>

<h3>So do I, Neither do I, Me too, Me neither</h3>
<div class="tblwrap"><table><tr><th>співрозмовник</th><th>я теж</th><th>а я — ні</th></tr>
<tr><td>[[I love coffee.]]</td><td>[[So do I.]] [[Me too.]]</td><td>[[Oh, I don't.]]</td></tr>
<tr><td>[[I don't like flying.]]</td><td>[[Neither do I.]] [[Me neither.]]</td><td>[[Oh, I do.]]</td></tr>
<tr><td>[[I'm tired.]]</td><td>[[So am I.]]</td><td>[[I'm not.]]</td></tr>
<tr><td>[[I've never been to Japan.]]</td><td>[[Neither have I.]]</td><td>[[Oh, I have.]]</td></tr>
<tr><td>[[I can't swim.]]</td><td>[[Neither can I.]]</td><td>[[Oh, I can.]]</td></tr>
<tr><td>[[I went to the concert.]]</td><td>[[So did I.]]</td><td>[[I didn't.]]</td></tr></table></div>
<p>Після So і Neither — <b>зворотний порядок</b>: допоміжне дієслово + підмет ([[So do I]], не «So I do»). Допоміжне дієслово — те саме, що в репліці співрозмовника. [[Nor do I.]] = [[Neither do I.]]</p>
<div class="note"><b>⚠️ «Я теж ні» — не Me too.</b> На заперечне речення відповідаємо [[Me neither.]] або [[Neither do I.]] Me too після заперечення — помилка. В американській розмовній мові трапляється ще «Me either» — його варто розуміти, але стандарт — Me neither.</div>

<h3>Small talk — легка розмова</h3>

<h3>Слова-зв'язки для довшого тексту</h3>
<div class="tblwrap"><table><tr><th>навіщо</th><th>слова</th><th>приклад</th></tr>
<tr><td>додати</td><td>[[in addition]], [[moreover]], [[furthermore]], [[apart from that]]</td><td>[[The flat is cheap. In addition, it's close to my office.]]</td></tr>

<p>[[On the one hand]] … [[on the other hand]] — пара, щоб зважити «за» і «проти»: [[On the one hand, the job pays well. On the other hand, it's very stressful.]]</p>
<div class="note"><b>⚠️ unless = if not.</b> Друге заперечення не потрібне: [[I'll come unless it rains.]] = [[I'll come if it doesn't rain.]] Не «unless it doesn't rain». Після unless, as long as, provided that про майбутнє — <b>Present Simple</b>, як після if: [[as long as you drive carefully]] (не «will drive»).</div>

<script>
/* B2, частина 1: уроки B2.1–B2.5. Формат: c — o[0] правильний; i/l — a: рядок або масив; o — a: речення або масив */

  goals: ['говорити про нереальне минуле: що було б, якби… (третій умовний)', 'поєднувати минуле й теперішнє в змішаних умовних реченнях',

  theory: `
<h3>Третій умовний: нереальне минуле</h3>
<p>Третій умовний (third conditional) — про минуле, якого вже не змінити: умова не виконалася, тож і результату не було. Українською — «якби (тоді)…, то …б».</p>
<div class="tblwrap"><table><tr><th>частина</th><th>форма</th><th>приклад</th></tr>
<tr><td>умова</td><td>if + Past Perfect (<b>had + V3</b>)</td><td>[[If I had known…]]</td></tr>
<tr><td>результат</td><td><b>would have + V3</b></td><td>[[…I would have told you.]]</td></tr></table></div>
<p>[[If I had known about the meeting, I would have come.]] — Якби я знав про зустріч, я б прийшов. (Але я не знав і не прийшов.)<br>
[[If she hadn't missed the bus, she wouldn't have been late.]] — Якби вона встигла на автобус, вона б не запізнилася.<br>
[[What would you have done if you had lost your passport?]] — Що б ти зробив, якби загубив паспорт?</p>
<p>Частини можна поміняти місцями, і тоді кома не потрібна: [[I would have helped you if you had asked.]]<br>
Замість would можна вжити інші модальні: <b>could have</b> (зміг би), <b>might have</b> (можливо, …б): [[If we had left earlier, we could have caught the train.]] [[If you had asked him, he might have agreed.]]</p>
<div class="good"><b>Форма одна для всіх осіб:</b> had + V3 і would have + V3 — без закінчень і змін. А would — це, по суті, українська частка «б».</div>
<div class="note"><b>⚠️ Пастка: would не буває в if-частині.</b> Не «If I would have known», а [[If I had known]]. У невимушеному американському мовленні таке трапляється, але в стандартній англійській (і на іспиті) це помилка.</div>
<div class="note"><b>⚠️ «Якби» в українській одне, а в англійській — два різні часи.</b> «Якби я мав гроші» може стосуватися і «зараз», і «тоді». Англійська це розрізняє: [[If I had money, I would buy it.]] (другий умовний — зараз) і [[If I had had money, I would have bought it.]] (третій — тоді). Так, <b>had had</b> — нормальна форма: перше had — допоміжне дієслово, друге — дієслово have у формі V3.</div>
<h3>Короткі форми: 'd — це had чи would?</h3>
<p>У розмові звучить так: [[If I'd known, I'd have told you.]] Перше <b>'d</b> = had, друге <b>'d</b> = would. Як розрізнити: <b>'d + V3</b> — це had ([[I'd known]], [[she'd left]]); <b>'d + have</b> або <b>'d + V1</b> — це would ([[I'd have told]], [[I'd tell]]).</p>
<div class="tip"><b>Як вимовляти:</b> у швидкому мовленні have редукується до /əv/: [[would have]] → /ˈwʊdəv/ ([[would've]]), [[could have]] → /ˈkʊdəv/, [[wouldn't have]] → /ˈwʊdntəv/, [[I'd have]] → /aɪdəv/. Звучить як «would of», тому носії інколи так і пишуть, — але це помилка: на письмі лише [[would have]] або [[would've]].</div>
<h3>Офіційний стиль: had на початку замість if</h3>
<p>У формальних текстах if можна прибрати, поставивши had на початок речення: [[Had I known, I would have told you.]] = [[If I had known, I would have told you.]] Заперечення тут не скорочують: [[Had it not been for your help, we would have failed.]] — Якби не твоя допомога, ми б не впоралися. Більше про інверсію — в уроці B2.5.</p>
<h3>Змішані умовні речення (mixed conditionals)</h3>
<p>Буває, що умова стосується одного часу, а результат — іншого. Тоді поєднуємо частини другого й третього умовних.</p>
<div class="tblwrap"><table><tr><th>зв'язок</th><th>умова</th><th>результат</th><th>приклад</th></tr>
<tr><td>минуле → зараз</td><td>if + Past Perfect</td><td><b>would + V1</b></td><td>[[If I had taken that job, I would be rich now.]] — Якби я тоді погодився на ту роботу, то зараз був би багатим.</td></tr>
<tr><td>зараз (завжди) → минуле</td><td>if + Past Simple</td><td><b>would have + V3</b></td><td>[[If I were more organised, I wouldn't have missed the flight.]] — Якби я був організованішим (узагалі), то не спізнився б на літак.</td></tr></table></div>
<p>Ще приклади:<br>
[[If she hadn't moved to London, she wouldn't speak such good English.]] — Якби вона не переїхала до Лондона, то не говорила б так добре англійською.<br>
[[If I hadn't stayed up so late, I wouldn't be so tired now.]] — Якби я не сидів так допізна, то не був би зараз такий утомлений.<br>
[[If he spoke English, he would have got the job.]] — Якби він говорив англійською (а він не говорить), то отримав би ту роботу.<br>
[[If you weren't so stubborn, you would have apologised.]] — Якби ти не був такий упертий, то вже вибачився б.</p>
<div class="tip"><b>Підказки в реченні:</b> now, today, still → результат у теперішньому (would + V1); yesterday, last year, then → у минулому (would have + V3). Риса характеру чи постійний стан («я неорганізований», «він не знає мови») → умова в Past Simple.</div>
<p><b>US / UK:</b> [[he would have got the job]] (UK) — [[he would have gotten the job]] (US). Правопис: [[organised]] (UK) — [[organized]] (US). Після if у 2-му і змішаному умовних [[If I were]] — стандарт, [[If I was]] — розмовне.</p>
<h3>I wish / If only + Past Perfect: жаль про минуле</h3>
<p>Щоб пошкодувати про те, що вже сталося (або не сталося), після [[I wish]] / [[If only]] ставимо Past Perfect:<br>
[[I wish I hadn't said that.]] — Шкода, що я це сказав. (Краще б я цього не казав.)<br>
[[I wish I had studied harder at school.]] — Шкода, що я не вчився старанніше в школі.<br>
[[If only we had booked the tickets earlier!]] — Ех, якби ж ми забронювали квитки раніше! (If only звучить емоційніше, ніж I wish.)</p>
<div class="tblwrap"><table><tr><th>wish + …</th><th>про що</th><th>приклад</th></tr>
<tr><td>Past Simple</td><td>теперішнє (B1)</td><td>[[I wish I knew the answer.]] — Шкода, що я не знаю відповіді.</td></tr>
<tr><td>Past Perfect</td><td>минуле</td><td>[[I wish I had known the answer.]] — Шкода, що я не знав відповіді.</td></tr>
<tr><td>would + V1</td><td>роздратування чужою поведінкою</td><td>[[I wish you would stop interrupting.]] — Та перестань уже перебивати.</td></tr></table></div>
<div class="note"><b>⚠️ Ствердження ↔ заперечення.</b> «Шкода, що я це <b>сказав</b>» → [[I wish I <b>hadn't</b> said that.]] «Шкода, що я <b>не</b> пішов» → [[I wish I <b>had</b> gone.]] Те саме значення без wish — regret + -ing: [[I regret saying that.]] — Я шкодую, що це сказав.</div>
<h3>would rather: я б краще…</h3>
<div class="tblwrap"><table><tr><th>форма</th><th>значення</th><th>приклад</th></tr>
<tr><td>would rather + V1</td><td>сам волію</td><td>[[I'd rather stay at home tonight.]] — Я б краще лишився сьогодні вдома. [[I'd rather not talk about it.]]</td></tr>
<tr><td>would rather + V1 + than + V1</td><td>порівняння</td><td>[[I'd rather walk than wait for the bus.]] — Я б краще пішов пішки, ніж чекав автобуса.</td></tr>
<tr><td>would rather + хтось + Past Simple</td><td>хочу, щоб інший (зараз чи в майбутньому)</td><td>[[I'd rather you didn't smoke here.]] — Я б волів, щоб ви тут не курили.</td></tr>
<tr><td>would rather + хтось + Past Perfect</td><td>хотів би, щоб інший (у минулому)</td><td>[[I'd rather you had told me the truth.]] — Краще б ти сказав мені правду.</td></tr></table></div>
<p>Тут 'd = would: [[I'd rather]] = [[I would rather]]. Ввічливе питання: [[Would you rather we met tomorrow?]] — Вам зручніше зустрітися завтра?</p>
<div class="note"><b>⚠️ Після would rather + інша особа — минулий час,</b> хоча йдеться про теперішнє чи майбутнє: [[I'd rather you didn't tell anyone.]] (не «you don't tell»). Так само, як після I wish.</div>

<h3>Модальне + have + V3: погляд у минуле</h3>
<p>Модальні дієслова (should, must, might…) не мають звичайної минулої форми. Щоб «перенести» їх у минуле, після модального ставимо <b>have + V3</b>: [[should have done]], [[must have left]], [[might have forgotten]]. Have тут не змінюється: [[She should have called.]] (не «should has»).</p>
<div class="good"><b>Добра новина:</b> схема одна для всіх осіб і всіх модальних: <b>модальне + have + V3</b>. Вивчіть значення — форма вже готова.</div>
<div class="tblwrap"><table><tr><th>форма</th><th>значення</th><th>приклад</th></tr>
<tr><td><b>should have</b> + V3</td><td>треба було (але не зробили): критика, жаль</td><td>[[You should have told me.]] — Треба було мені сказати.</td></tr>

<h3>should have: критика й жаль</h3>
<p>[[You should have double-checked the address.]] — Треба було ще раз перевірити адресу.<br>
[[We shouldn't have trusted him.]] — Не треба було йому довіряти.<br>
[[I should have listened to you.]] — Варто було тебе послухати.<br>
Офіційніший і переважно британський синонім — <b>ought to have</b>: [[You ought to have warned us.]]</p>
<div class="note"><b>⚠️ «Треба було» — це should have, а не had to.</b> [[I had to call him.]] — Мені довелося йому подзвонити (і я подзвонив). [[I should have called him.]] — Треба було йому подзвонити (але я не подзвонив). Українське «треба було» майже завжди означає друге.</div>
<h3>Припущення про минуле: must, might, can't</h3>
<div class="tblwrap"><table><tr><th>впевненість</th><th>форма</th><th>приклад</th></tr>
<tr><td>майже напевно так</td><td>must have + V3</td><td>[[He must have forgotten.]] — Він, мабуть, забув.</td></tr>
<tr><td>можливо</td><td>may / might / could have + V3</td><td>[[He might have forgotten.]] — Можливо, він забув.</td></tr>
<tr><td>майже напевно ні</td><td>can't / couldn't have + V3</td><td>[[He can't have forgotten.]] — Не може бути, щоб він забув.</td></tr></table></div>
<p>Тривала форма — <b>must / might have been + -ing</b>: [[You must have been waiting for ages.]] — Ви, мабуть, довго чекали. [[He might have been joking.]] — Можливо, він жартував.</p>
<div class="note"><b>⚠️ Протилежність must have — can't have, а не mustn't have.</b> [[She can't have left — her coat is still here.]] — Не може бути, що вона пішла: її пальто ще тут. Mustn't означає заборону. (В американській англійській кажуть ще [[He must not have heard me.]] — Він, мабуть, мене не почув, — але без скорочення mustn't.)</div>
<p>Для того, що могло статися, але не сталося, вживайте <b>might</b> або <b>could</b>, а не may: [[You might have been killed!]] — Тебе могли вбити!</p>
<h3>could have: можливість, яка не здійснилася</h3>
<p>[[We could have won the match.]] — Ми могли виграти матч (але програли).<br>
[[You could have told me earlier!]] — Міг би й раніше сказати! (докір)<br>
[[She could have become a doctor, but she chose art.]] — Вона могла стати лікаркою, але вибрала мистецтво.<br>
[[The letter could have got lost.]] — Лист міг загубитися (припущення).</p>
<p><b>couldn't have + вищий ступінь</b> — «краще й не буває»: [[It couldn't have been better!]] — Краще й бути не могло! [[I couldn't have done it without you.]] — Без тебе я б не впорався.</p>
<p><b>would have</b> — для того, що ми зробили б, але щось завадило: [[I would have called you, but my phone died.]] — Я б тобі подзвонив, але телефон розрядився. [[I would have liked to come.]] — Я б охоче прийшов.</p>
<h3>needn't have done чи didn't need to do?</h3>
<p>[[I needn't have taken an umbrella.]] — Даремно я брав парасольку (узяв, а дощу не було).<br>
[[I didn't need to take an umbrella.]] — Мені не треба було брати парасольку (і, найімовірніше, я її не брав).<br>
[[We needn't have worried.]] — Даремно ми хвилювалися.</p>
<p><b>US / UK:</b> needn't — переважно британське й трохи книжне. Американці частіше кажуть [[I didn't need to take an umbrella, but I did.]] або [[I didn't have to…]]. Також [[apologise]] (UK) — [[apologize]] (US).</p>
<div class="tip"><b>Як вимовляти:</b> have у цих конструкціях редукується до /əv/: [[should've]] /ˈʃʊdəv/, [[could've]] /ˈkʊdəv/, [[must've]] /ˈmʌstəv/, [[might've]] /ˈmaɪtəv/. [[can't have]] — британське /ˈkɑːnt əv/, американське /ˈkænt əv/. На письмі — [[should have]] або [[should've]], ніколи «should of».</div>`,

  theory: `
<h3>Future Continuous: will be + -ing</h3>
<p>Дія, яка буде <b>в процесі</b> в певний момент майбутнього: [[This time tomorrow I'll be flying to Lisbon.]] — Завтра в цей час я летітиму до Лісабона.</p>
<div class="tblwrap"><table><tr><th>ствердження</th><th>заперечення</th><th>питання</th></tr>
<tr><td>[[I will be working.]] / [[I'll be working.]]</td><td>[[I won't be working.]]</td><td>[[Will you be working?]]</td></tr></table></div>
<p><b>Коли вживаємо:</b></p>
<ul><li><b>Процес у момент майбутнього:</b> [[At nine tonight we'll be watching the match.]] [[Don't call at six — I'll be driving.]]</li>

<div class="good"><b>Схоже на українську:</b> «працюватиму», «буду летіти» — недоконаний вид у майбутньому — це майже точний відповідник Future Continuous: процес, а не результат. [[I'll be working]] ≈ «працюватиму».</div>
<h3>Future Perfect: will have + V3</h3>
<p>Дія, яка буде <b>завершена до</b> певного моменту в майбутньому. Головний сигнал — <b>by</b> + час.<br>

[[The film will have started by then.]] — На той час фільм уже почнеться.</p>
<div class="tblwrap"><table><tr><th>ствердження</th><th>заперечення</th><th>питання</th></tr>
<tr><td>[[I'll have finished by Friday.]]</td><td>[[I won't have finished by Friday.]]</td><td>[[Will you have finished by Friday?]]</td></tr></table></div>
<p>Маркери часу: [[by Friday]], [[by next year]], [[by the end of the month]], [[by then]], [[by the time you arrive]], [[before]].</p>
<div class="note"><b>⚠️ by ≠ until.</b> by — «до якогось часу, не пізніше»; until (till) — «до якогось часу, весь час аж до». [[I'll have finished by five.]] — Закінчу не пізніше п'ятої. [[I'll be working until five.]] — Працюватиму аж до п'ятої.</div>
<div class="note"><b>⚠️ Після by the time, when, before, after, as soon as — Present Simple, а не will.</b> [[By the time you arrive, we'll have left.]] — Коли ти приїдеш, нас уже не буде (не «by the time you will arrive»). Українською тут теж майбутній час — «приїдеш», а в англійській — теперішній, як і в першому умовному.</div>
<h3>Future Perfect Continuous: will have been + -ing</h3>
<p>Скільки часу дія триватиме до певного моменту (зазвичай з for): [[By June I'll have been working here for five years.]] — У червні буде п'ять років, як я тут працюю. [[By the time we land, we'll have been travelling for twenty hours.]] — Коли ми приземлимося, ми будемо в дорозі вже двадцять годин.</p>
<div class="note"><b>⚠️ «У червні буде п'ять років, як я тут працюю».</b> Українською — теперішній час і «буде». Англійською — лише перфектний тривалий: [[By June I'll have been working here for five years.]] Не «In June it will be five years as I work here».</div>
<h3>Майбутнє в минулому (future in the past)</h3>
<p>Коли розповідаємо про минуле, «майбутнє» з того моменту зсувається на крок назад — як у непрямій мові.</p>
<div class="tblwrap"><table><tr><th>з теперішнього</th><th>з минулого</th><th>приклад</th></tr>
<tr><td>will</td><td><b>would</b></td><td>[[I knew he would be late.]] — Я знав, що він запізниться.</td></tr>
<tr><td>am going to</td><td><b>was going to</b> (план, який часто не здійснився)</td><td>[[I was going to call you, but I forgot.]] — Я збирався тобі подзвонити, але забув.</td></tr>
<tr><td>am about to</td><td><b>was about to</b> (ось-ось)</td><td>[[I was about to leave when the phone rang.]] — Я вже збирався йти, коли задзвонив телефон.</td></tr>
<tr><td>is due to</td><td><b>was due to</b> (за розкладом, планом)</td><td>[[The plane was due to land at six, but it was delayed.]] — Літак мав приземлитися о шостій, але затримався.</td></tr>
<tr><td>Present Continuous (домовленість)</td><td><b>Past Continuous</b></td><td>[[She was leaving for Rome the next day.]] — Наступного дня вона їхала до Рима.</td></tr></table></div>
<p>Книжне <b>was / were to + V1</b> — те, що «судилося»: [[He was to become president.]] — Йому судилося стати президентом.</p>
<p>У теперішньому [[be about to]] і [[be due to]] теж дуже вживані: [[Hurry up, the film is about to start!]] — Швидше, фільм от-от почнеться! [[The report is due to be published next week.]] — Звіт мають оприлюднити наступного тижня.</p>
<div class="note"><b>⚠️ «Я знав, що він запізниться».</b> Українською після «знав» — майбутній час. В англійській після минулого часу в головному реченні — would: [[I knew he would be late.]], не «I knew he will be late».</div>

  theory: `
<h3>Каузатив: have / get something done</h3>
<p>Коли роботу за вас виконує хтось інший (майстер, сервіс, лікар), уживаємо <b>have + предмет + V3</b>:<br>
[[I had my hair cut.]] — Я підстригся (у перукаря). Порівняйте: [[I cut my hair.]] — Я сам себе підстриг.</p>
<div class="tblwrap"><table><tr><th>час</th><th>приклад</th><th>переклад</th></tr>
<tr><td>Present Simple</td><td>[[We have our windows cleaned twice a year.]]</td><td>Нам миють вікна двічі на рік.</td></tr>
<tr><td>Present Continuous</td><td>[[We're having the flat renovated.]]</td><td>У нас зараз роблять ремонт квартири.</td></tr>
<tr><td>Past Simple</td><td>[[I had my car serviced last week.]]</td><td>Минулого тижня я віддавав машину на техобслуговування.</td></tr>
<tr><td>Present Perfect</td><td>[[Have you had your eyes tested recently?]]</td><td>Ти нещодавно перевіряв зір?</td></tr>
<tr><td>going to</td><td>[[I'm going to have the boiler repaired.]]</td><td>Я збираюся викликати майстра полагодити котел.</td></tr>
<tr><td>модальне</td><td>[[You should get that tooth looked at.]]</td><td>Тобі варто показати цей зуб лікареві.</td></tr></table></div>
<p><b>get something done</b> — те саме, але розмовніше: [[We're getting the flat renovated.]] [[I need to get my phone fixed.]] — Мені треба віддати телефон у ремонт.</p>
<div class="note"><b>⚠️ «Я полагодив машину» — хто саме лагодив?</b> Українською «я підстригся», «я пофарбував квартиру», «я полагодив машину» кажемо й тоді, коли робив майстер. В англійській [[I repaired my car.]] означає, що ви зробили це власноруч. Якщо робив майстер — [[I had my car repaired.]] І стежте за порядком: have + що + V3. [[I had cut my hair.]] — це вже Past Perfect («я підстриг (себе) раніше»).</div>
<p>Якщо треба назвати виконавця: <b>have + особа + V1</b> (доручити) або <b>get + особа + to + V1</b> (домовитися, вмовити): [[I had the mechanic check the brakes.]] — Я попросив механіка перевірити гальма. [[I got my brother to help me.]] — Я вмовив брата допомогти. Конструкція have someone do особливо поширена в американській англійській.</p>
<h3>Неприємний досвід: I had my phone stolen</h3>
<p>Та сама конструкція описує, що з вами чи вашою річчю сталося щось погане, чого ви не хотіли:<br>

[[She had her bag searched at the airport.]] — В аеропорту в неї обшукали сумку.<br>
[[We had our flight cancelled.]] — Нам скасували рейс.<br>
[[They had their car broken into.]] — У них зламали машину.</p>
<h3>Новини й чутки: It is said that… / He is said to…</h3>
<p>Коли джерело невідоме, неважливе або його не хочуть називати («кажуть», «вважається», «повідомляють»), англійська вживає два способи.</p>
<p><b>Спосіб 1: It + пасив + that…</b><br>
[[It is said that the house is haunted.]] — Кажуть, що в будинку водяться привиди.<br>
[[It is believed that the fire started in the kitchen.]] — Вважають, що пожежа почалася на кухні.<br>
[[It was reported that two people were injured.]] — Повідомили, що двоє людей постраждали.<br>
[[It is expected that prices will rise.]] — Очікується, що ціни зростуть.<br>
Дієслова: say, believe, think, report, know, expect, claim, allege, estimate, consider, understand.</p>

  theory: `
<h3>Розщеплені речення (cleft sentences)</h3>
<p>В українській логічний наголос часто передаємо порядком слів: «Дзвонила Анна» (а не хтось інший). В англійській порядок слів жорсткий, тому для цього є спеціальні конструкції.</p>
<p><b>It is / was + виділене + who / that…</b><br>
[[Anna called you yesterday.]] →<br>
[[It was Anna who called you yesterday.]] — Дзвонила тобі вчора саме Анна (а не Олег).<br>

<p><b>What + підмет + дієслово + is / was…</b><br>
[[What I really need is a break.]] — Що мені справді потрібно, то це перерва.<br>

<p><b>Інші зачини</b>: [[All I want is a quiet evening.]] — Усе, чого я хочу, — це спокійний вечір. [[The thing is, I don't have time.]] — Річ у тім, що в мене немає часу. [[The reason I called is that…]] — Я дзвоню, бо… [[The person who helped me most was my teacher.]] — Найбільше мені допоміг мій учитель.</p>
<div class="tip"><b>Інтонація:</b> головний наголос падає на виділене слово: [[It was <b>Anna</b> who called.]] [[What I really need is a <b>break</b>.]]</div>
<h3>Емфатичне do / does / did</h3>
<p>У ствердному реченні ставимо do / does / did перед дієсловом (і наголошуємо голосом), щоб заперечити сумнів, підсилити чи протиставити:<br>

[[She <b>did</b> call you — check your phone.]] — Вона таки тобі дзвонила, перевір телефон.<br>
[[He <b>does</b> work hard, but he's always late.]] — Він справді багато працює, але постійно запізнюється.<br>
[[<b>Do</b> sit down.]] — Сідайте ж, будь ласка (тепло й трохи офіційно).</p>
<div class="note"><b>⚠️ Після do / does / did — базова форма дієслова.</b> [[She does know.]] (не «does knows»), [[I did tell you.]] (не «did told»). Як у питаннях і запереченнях.</div>
<h3>Інверсія після заперечних і обмежувальних слів</h3>
<p>В офіційному стилі (промови, статті, есе, офіційні листи) заперечне чи обмежувальне слово можна винести на початок речення. Тоді порядок слів стає як у питанні: <b>допоміжне дієслово + підмет + основне дієслово</b>.<br>
[[I have never seen such a mess.]] → [[Never have I seen such a mess.]] — Ніколи я не бачив такого безладу.</p>
<div class="good"><b>Порядок слів уже знайомий</b> — це порядок питання: [[Have I ever seen…?]] → [[Never have I seen…]]; [[Did he realise…?]] → [[Only then did he realise…]]</div>
<div class="tblwrap"><table><tr><th>вираз</th><th>приклад</th><th>переклад</th></tr>
<tr><td>Never / Never before</td><td>[[Never have I felt so tired.]]</td><td>Ніколи я не був такий утомлений.</td></tr>
<tr><td>Rarely / Seldom</td><td>[[Rarely do we see such talent.]]</td><td>Рідко побачиш такий талант.</td></tr>
<tr><td>Not only … but (also)</td><td>[[Not only did he lose his job, but he also lost his house.]]</td><td>Він утратив не лише роботу, а й дім.</td></tr>
<tr><td>No sooner … than</td><td>[[No sooner had I arrived than it started to rain.]]</td><td>Щойно я приїхав, як почався дощ.</td></tr>
<tr><td>Hardly / Scarcely … when</td><td>[[Hardly had we sat down when the phone rang.]]</td><td>Ледве ми сіли, як задзвонив телефон.</td></tr>
<tr><td>Only then / Only when / Only after</td><td>[[Only then did I realise my mistake.]]</td><td>Лише тоді я зрозумів свою помилку.</td></tr>
<tr><td>Not until</td><td>[[Not until I got home did I notice the hole in my coat.]]</td><td>Лише вдома я помітив дірку в пальті.</td></tr>
<tr><td>Under no circumstances / On no account</td><td>[[Under no circumstances should you open this door.]]</td><td>За жодних обставин не відчиняйте ці двері.</td></tr>
<tr><td>Little</td><td>[[Little did she know what was waiting for her.]]</td><td>Вона й гадки не мала, що на неї чекає.</td></tr></table></div>
<p>У Present і Past Simple допоміжного дієслова немає — додаємо do / does / did: [[We rarely see…]] → [[Rarely do we see…]]; [[I realised]] → [[Only then did I realise…]]</p>
<div class="note"><b>⚠️ Пастки інверсії.</b> 1) Це офіційний стиль; у розмові природніше [[I've never seen anything like it.]] 2) Коли never стоїть у середині речення, інверсії немає: [[I have never seen…]] 3) Пари фіксовані: <b>No sooner — than</b>, <b>Hardly — when</b>. 4) Після Only when / Not until інверсія — у <i>головній</i> частині: [[Only when I got home did I notice…]] (не «Only when did I get home…»).</div>
<p>Інверсія буває й в умовних реченнях (B2.1): [[Had I known, I would have come.]] [[Should you need any help, please call me.]] — Якщо вам знадобиться допомога, телефонуйте. [[Were I in your position, I would accept.]] — Будь я на вашому місці, я б погодився.</p>
<h3>so / such … that</h3>
<p><b>so</b> + прикметник / прислівник: [[It was so cold that we stayed inside.]] [[She spoke so fast that I didn't understand.]]<br>
<b>such (a / an)</b> + (прикметник +) іменник: [[It was such a cold day that we stayed inside.]] [[They are such nice people.]]<br>
<b>so much / many / few / little</b> + іменник: [[There were so many people that we couldn't get in.]]<br>
Офіційно, з інверсією: [[So tired was I that I fell asleep at once.]] — Я був такий утомлений, що одразу заснув.</p>
<div class="note"><b>⚠️ Українське «такий» — то so, то such.</b> «Він такий розумний» → [[He's so clever.]] (не «such clever»). «Він такий розумний хлопець» → [[He's such a clever guy.]] Артикль стоїть <i>після</i> such: [[such a nice day]].</div>
<h3>Підсилювачі</h3>
<div class="tblwrap"><table><tr><th>з «градуйованими» прикметниками</th><th>з «крайніми» прикметниками</th></tr>
<tr><td>very / extremely / incredibly: [[very tired]], [[extremely cold]], [[incredibly interesting]]</td><td>absolutely / utterly / totally: [[absolutely exhausted]], [[absolutely freezing]], [[utterly fascinating]]</td></tr></table></div>

<p><b>Заперечні підсилювачі:</b> [[I'm not in the least surprised.]] — Мене це анітрохи не дивує. [[It's by no means easy.]] — Це аж ніяк не легко. [[I have no idea whatsoever.]] — Я не маю найменшого уявлення. [[It's nowhere near enough.]] — Цього далеко не досить.<br>

<script>
/* B2, частина 2: уроки B2.6–B2.10. Формат: c — o[0] правильний; i/l — a: рядок або масив; o — a: речення або масив */

{
  id: 'b2-6', stage: 'b2', num: 'B2.6', title: 'Дієприкметникові звороти: Having finished…, Built in 1990…', dur: '3 тижні',
  goals: ['скорочувати підрядні речення зворотами з -ing, having + V3 і V3', 'вибирати форму звороту за значенням: активне чи пасивне, одночасне чи попереднє', 'помічати й виправляти «висячий» зворот (dangling participle)', 'стисло переказувати статті, дослідження й новини'],
  theory: `
<h3>Що таке дієприкметниковий зворот</h3>
<p><b>Participle clause</b> — скорочене підрядне речення: без сполучника, без підмета, з дієприкметником замість дієслова. Порівняйте: [[When I was walking home, I met Tom.]] → [[Walking home, I met Tom.]] Зворот робить текст стислішим, тому його люблять статті, звіти, новини й резюме.</p>
<div class="good"><b>В українській є те саме — дієприслівниковий зворот.</b> «<i>Ідучи</i> додому, я зустрів Тома», «<i>Закінчивши</i> звіт, вона пішла». Англійське <b>-ing</b> ≈ «ідучи», <b>having + V3</b> ≈ «закінчивши», <b>V3</b> ≈ «збудований». І правило те саме: дію звороту виконує підмет головного речення.</div>
<h3>Чотири форми</h3>
<div class="tblwrap"><table><tr><th>форма</th><th>коли</th><th>зворот</th><th>= повне речення</th></tr>
<tr><td><b>V-ing</b><br>(Present Participle)</td><td>активна дія, одночасна з головною або одразу перед нею</td><td>[[Walking home, I met Tom.]]</td><td>[[While I was walking home, I met Tom.]]</td></tr>
<tr><td><b>having + V3</b><br>(Perfect Participle)</td><td>активна дія, що завершилася раніше за головну</td><td>[[Having finished the report, she left.]]</td><td>[[After she had finished the report, she left.]]</td></tr>
<tr><td><b>V3</b><br>(Past Participle)</td><td>пасивне значення: з підметом щось зробили</td><td>[[Built in 1990, the bridge needs repairs.]]</td><td>[[The bridge, which was built in 1990, needs repairs.]]</td></tr>
<tr><td><b>having been + V3</b></td><td>пасив, і дія сталася раніше</td><td>[[Having been warned, we took umbrellas.]]</td><td>[[As we had been warned, we took umbrellas.]]</td></tr></table></div>
<p>Заперечення — <b>not</b> перед зворотом: [[Not knowing the address, I called a taxi.]] — Не знаючи адреси, я викликав таксі. [[Not having received a reply, we sent a reminder.]] — Не отримавши відповіді, ми надіслали нагадування.</p>
<p>Як скоротити речення: 1) приберіть сполучник (after, before, while, when можна й лишити); 2) приберіть підмет — він має збігатися з підметом головного речення; 3) дієслово → <b>-ing</b>, <b>having + V3</b> або <b>V3</b>.</p>
<h3>Що може означати зворот</h3>
<ul>
<li><b>Час</b> (when, while, after): [[Opening the door, she saw a stranger.]] Сполучник часто лишають — так зрозуміліше: [[After reading the article, I changed my mind.]] [[Before signing the contract, read it carefully.]] [[While working in Kyiv, he learned to cook.]]</li>
<li><b>Причина</b> (because, as): [[Feeling tired, I went to bed early.]] [[Having lived in London, she knows the city well.]]</li>
<li><b>Наслідок</b> (and so) — зворот у кінці речення після коми: [[The storm hit the coast, causing serious damage.]] [[Prices rose sharply, leaving many families in difficulty.]]</li>
<li><b>Умова</b> (if) — зазвичай з V3: [[Used correctly, this method saves a lot of time.]] [[Compared with last year, sales have improved.]]</li>
</ul>
<div class="tip"><b>-ing чи having + V3?</b> Якщо одна коротка дія одразу переходить в іншу, досить -ing: [[Taking out her phone, she called the police.]] Якщо перша дія тривала або точно завершилася до другої — having + V3: [[Having worked there for ten years, he knows everyone.]] Сам зворот часу не має — час показує головне речення: [[Living abroad, I miss my family.]] (тепер) — [[Living abroad, I missed my family.]] (тоді).</div>
<h3>Скорочені означальні речення (reduced relative clauses)</h3>
<p>Означальне речення з <b>who / which / that + be</b> можна скоротити до дієприкметника. Він стоїть <b>після</b> іменника:</p>
<div class="tblwrap"><table><tr><th>повне означальне речення</th><th>скорочене</th></tr>
<tr><td>[[the man who is sitting by the window]]</td><td>[[the man sitting by the window]]</td></tr>
<tr><td>[[people who live in big cities]]</td><td>[[people living in big cities]]</td></tr>
<tr><td>[[a box which contains old letters]]</td><td>[[a box containing old letters]]</td></tr>
<tr><td>[[the report which was written by our team]]</td><td>[[the report written by our team]]</td></tr>
<tr><td>[[the data that were collected last year]]</td><td>[[the data collected last year]]</td></tr></table></div>
<p>Активне значення → <b>-ing</b>, навіть для дієслів, які не вживаються в Continuous (contain, belong, want): [[Anyone wanting to join should contact me.]] Пасивне значення → <b>V3</b>: [[Most of the goods sold in this shop are imported.]]</p>
<div class="note"><b>⚠️ Обмеження.</b> 1) Having + V3 в означальних зворотах не вживають: не «the author having written the book», а [[the author who wrote the book]]. 2) Одноразову завершену дію в минулому -ing не передає: [[I met the woman who wrote the article.]] — «the woman writing the article» означало б, що вона пише її зараз. 3) Для пасивного значення не беріть -ing: «the bridge building in 1990» ✗ → [[the bridge built in 1990]].</div>
<h3>Пастка: «висячий» зворот (dangling participle)</h3>
<p>Зворот завжди «чіпляється» до підмета головного речення. Якщо підмети різні, виходить нелогічно або смішно:</p>
<p>«Walking into the room, the lights turned on.» ✗ — виходить, що в кімнату зайшло світло.<br>✓ [[Walking into the room, I turned on the lights.]] ✓ [[When I walked into the room, the lights turned on.]]</p>
<p>«Having finished the exam, the teacher collected our papers.» ✗ — іспит писав не вчитель.<br>✓ [[When we had finished the exam, the teacher collected our papers.]]</p>
<div class="note"><b>⚠️ В українській це теж помилка</b> («Читаючи книжку, мені стало сумно»), але в розмові її часто не помічають. В англійському письмі — есе, звіті, на іспиті — висячий зворот вважають грубою помилкою. Перевірка: спитайте «хто виконує дію звороту?» Відповідь — підмет одразу після коми.</div>
<p>Винятки — усталені вирази, які вживають з будь-яким підметом: [[Generally speaking, prices are lower outside the capital.]] [[Judging by his face, the news was bad.]] [[Considering the price, the hotel was excellent.]] [[Given the circumstances, we did our best.]] Окремо стоять звороти з власним підметом (absolute constructions): [[Weather permitting, we will eat outside.]] [[All things considered, it was a good year.]]</p>
<h3>Формальний і розмовний стиль</h3>
<ul>
<li><b>Письмо</b>: звороти — ознака доброго стилю. Новина: [[Founded in 2010, the company now employs hundreds of people.]] Звіт: [[Based on the survey data, the report recommends hybrid work.]] Резюме (CV): [[Managed a team of five developers, reducing release time by a third.]]</li>
<li><b>Розмова</b>: природніші повні речення: [[After I finished work, I went to the gym.]] «Having finished work, I went to the gym» усно звучить книжно. Але кілька зворотів живуть і в розмові: [[Speaking of which]], [[Generally speaking]], [[Talking of holidays, where are you going this year?]]</li>
</ul>
<h3>Слова теми: медіа й дослідження</h3>
<p>[[According to a recent survey, most people get their news online.]] — Згідно з нещодавнім опитуванням, більшість людей дізнаються новини з інтернету.<br>
[[The findings suggest that remote workers are more productive.]] — Результати свідчать, що працівники на віддаленій роботі продуктивніші.<br>
[[The data show a significant increase in prices.]] — Дані показують значне зростання цін.<br>
[[Is this a reliable source?]] — Це надійне джерело? [[The headline is misleading.]] — Заголовок оманливий.<br>
[[The author draws an interesting conclusion.]] — Автор робить цікавий висновок. [[The researchers conducted a survey of two thousand respondents.]]</p>
<div class="note"><b>⚠️ Незлічувані іменники, на яких помиляються українці.</b> [[research]] і [[evidence]] — незлічувані: не «a research / researches», а [[a study]], [[a piece of research]], [[do research]]; не «an evidence / evidences», а [[evidence]], [[a piece of evidence]]. [[findings]] — майже завжди множина. [[data]] у науковому стилі — множина ([[the data are]]), у загальному — однина ([[the data is]]); обидва варіанти правильні. І ніколи «according to me» — кажіть [[in my opinion]] або [[in my view]].</div>
<div class="tip"><b>Вимова:</b> [[biased]] /ˈbaɪəst/ — ≈ «БАЙ-ест»; [[research]] — наголос і на першому, і на другому складі: обидва варіанти правильні (у США частіше на першому); [[survey]] — іменник з наголосом на першому складі, дієслово — частіше на другому.</div>`,
  vocab: [['article', 'стаття'], ['survey', 'опитування; огляд', 'conduct / carry out a survey'], ['research', 'дослідження, дослідницька робота', 'незлічуване: do research, не «researches»'],
    ['study', 'дослідження (окреме)', 'злічуване: a recent study'], ['data', 'дані', 'the data is / the data are'], ['findings', 'результати (дослідження)', 'майже завжди множина'],

    ['according to', 'згідно з, за словами', 'не «according to me»'], ['reliable', 'надійний, достовірний'], ['biased', 'упереджений', 'вимова /ˈbaɪəst/'],
    ['misleading', 'оманливий, що вводить в оману'], ['claim', 'стверджувати; твердження', 'не «вимагати»'], ['respondent', 'респондент, учасник опитування'],
    ['sample', 'вибірка; зразок'], ['trend', 'тенденція'], ['reveal', 'виявляти, показувати', 'The survey reveals that…'], ['publish', 'публікувати, видавати'],

    { t: 'c', q: '«Збудований у 1990 році, міст потребує ремонту.»', o: ['Built in 1990, the bridge needs repairs.', 'Building in 1990, the bridge needs repairs.', 'Having built in 1990, the bridge needs repairs.'], e: 'Міст збудували (пасивне значення) — V3: [[Built in 1990, the bridge needs repairs.]]' },
    { t: 'c', q: 'Яке речення правильне?', o: ['Walking into the room, I turned on the lights.', 'Walking into the room, the lights turned on.', 'Walking into the room, the lights were turned on.'], e: 'У кімнату зайшов я, тож підмет головного речення — I. Інакше зворот «висить»: виходить, що зайшло світло.' },
    { t: 'c', q: '«Люди, які живуть у великих містах, часто відчувають стрес.»', o: ['People living in big cities often feel stressed.', 'People lived in big cities often feel stressed.', 'People who living in big cities often feel stressed.'], e: 'Скорочене означальне речення: who live → living. [[People living in big cities often feel stressed.]]' },
    { t: 'c', q: '«Не знаючи адреси, я викликав таксі.»', o: ['Not knowing the address, I called a taxi.', 'Knowing not the address, I called a taxi.', 'Don\'t knowing the address, I called a taxi.'], e: 'Заперечення — not перед зворотом: [[Not knowing the address]].' },
    { t: 'c', q: '«Ціни різко зросли, і через це багато сімей опинилися в скруті.»', o: ['Prices rose sharply, leaving many families in difficulty.', 'Prices rose sharply, leaves many families in difficulty.', 'Prices rose sharply, left many families in difficulty.'], e: 'Наслідок передає -ing у кінці речення: [[Prices rose sharply, leaving many families in difficulty.]]' },

  theory: `
<h3>Навіщо словотвір</h3>
<p>Знаючи 20–30 префіксів і суфіксів, з одного слова ви отримуєте п'ять: [[decide]] → [[decision]] → [[decisive]] → [[decisively]] → [[indecisive]]. На іспиті B2 First цьому присвячено окреме завдання (Reading and Use of English, Part 3): у тексті 8 пропусків, і слово в дужках треба змінити так, щоб воно підійшло і граматично, і за змістом.</p>
<div class="tip"><b>Алгоритм для пропуску:</b> 1) яка частина мови потрібна: після артикля чи прикметника — іменник, перед іменником — прикметник, біля дієслова — прислівник; 2) однина чи множина; 3) чи не потрібне заперечення (un-, in-, dis-) — читайте весь контекст.</div>
<h3>Префікси: змінюють значення, частина мови та сама</h3>
<div class="tblwrap"><table><tr><th>префікс</th><th>значення</th><th>приклади</th></tr>

<tr><td><b>dis-</b></td><td>не-, протилежна дія</td><td>[[disagree]], [[dishonest]], [[disappear]]</td></tr>
<tr><td><b>mis-</b></td><td>неправильно, хибно</td><td>[[misunderstand]], [[misspell]], [[misinform]]</td></tr>
<tr><td><b>re-</b></td><td>знову, пере-</td><td>[[rewrite]], [[rebuild]], [[reconsider]]</td></tr>
<tr><td><b>over-</b></td><td>занадто, пере-</td><td>[[overwork]], [[overestimate]], [[overcrowded]]</td></tr>

<tr><td><b>pre-</b></td><td>перед-, до-</td><td>[[prepaid]], [[preview]], [[pre-war]]</td></tr>

<div class="note"><b>⚠️ Яке «не-»?</b> Загального правила немає — вчіть слово цілком: [[unable]], але [[inability]]; [[uncomfortable]], але [[inconvenient]]; [[dishonest]], але [[unfair]]. Префікс in- змінюється: <b>im-</b> перед p, m, b ([[impossible]], [[immature]], [[imbalance]]), <b>ir-</b> перед r ([[irregular]], [[irrelevant]]), <b>il-</b> перед l ([[illegal]], [[illogical]]).<br>
<b>Подвоєння:</b> префікс не змінює написання слова, тож літери можуть подвоїтися: mis + spell = [[misspell]], dis + satisfied = [[dissatisfied]], un + necessary = [[unnecessary]], im + mature = [[immature]].</div>

<div class="tblwrap"><table><tr><th>що утворюємо</th><th>суфікс</th><th>приклади</th></tr>
<tr><td>іменник: якість, стан</td><td>-ness, -ity, -ance / -ence</td><td>[[kindness]], [[awareness]], [[ability]], [[security]], [[importance]], [[independence]]</td></tr>
<tr><td>іменник: дія, результат</td><td>-ment, -tion / -sion</td><td>[[agreement]], [[development]], [[information]], [[decision]], [[permission]]</td></tr>
<tr><td>іменник: особа</td><td>-er / -or, -ee, -ist, -ant</td><td>[[employer]], [[employee]], [[actor]], [[scientist]], [[assistant]]</td></tr>
<tr><td>іменник: стосунки, статус</td><td>-ship</td><td>[[friendship]], [[leadership]], [[membership]]</td></tr>
<tr><td>прикметник: з / без</td><td>-ful / -less</td><td>[[useful]] — [[useless]], [[careful]] — [[careless]]</td></tr>

<li><b>-ful, -less, -ness, -ment, -able, -er, -ly</b> — наголос не змінюється: [[HAPpy|happy]] → [[HAPpiness|happiness]], [[emPLOY|employ]] → [[emPLOYment|employment]].</li>
<li>Ланцюжки: [[eCOnomy|economy]] → [[ecoNOmic|economic]]; [[POlitics|politics]] → [[poLItical|political]] → [[poliTIcian|politician]]; [[ANalyse|analyse]] → [[aNAlysis|analysis]] → [[anaLYtical|analytical]].</li>
</ul>

<h3>Що таке ідіома</h3>
<p><b>Ідіома</b> — сталий вираз, значення якого не випливає зі значень окремих слів: [[The exam was a piece of cake.]] — не про торт, а «простіше простого». Слова в ідіомі не замінюють (не «a piece of pie»); змінюється лише форма дієслова: [[You've hit the nail on the head.]] [[She spilled the beans.]]</p>

<p>Слова-пом'якшувачі: [[kind of]], [[sort of]] (обидва — «ніби, якось»; kind of частіше в США, sort of — у Британії), [[a bit]], [[slightly]], [[I'd say]], [[It seems that]], [[perhaps]], [[probably]], [[tend to]]: [[People tend to work longer hours here.]]</p>

<p><b>Регістр</b> — вибір слів і граматики залежно від ситуації. Формальний стиль потрібен в есе, звіті, скарзі, супровідному листі (cover letter), листі до установи чи незнайомої людини. Неформальний — у повідомленнях друзям і колегам.</p>
<p>Ознаки формального стилю:</p>
<ul>
<li><b>жодних скорочень</b>: [[I am writing]], [[do not]], [[cannot]], [[I would]] — не «I'm», «don't»;</li>
