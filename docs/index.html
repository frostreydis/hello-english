  // [id, іконка, підпис, короткий підпис, лише на широкому екрані]. «Програма» на телефоні — посилання з «Уроків»:
  // восьма вкладка в нижній навігації не вміщується
  const NAV = [['today', '🏠', 'Сьогодні', 'Сьогодні'], ['program', '🗺️', 'Програма', 'План', true], ['lessons', '📘', 'Уроки', 'Уроки'], ['words', '🃏', 'Слова', 'Слова'],
    ['dict', '📒', 'Словник', 'Словник'], ['speak', '🎙️', 'Розмова', 'Мова'], ['ref', '📚', 'Довідник', 'Довідка'], ['settings', '⚙️', 'Налаштування', 'Опції']];

  function stageOf(id) { return P.stages.find((s) => s.id === id); }
  // Модуль програми може мати поле lesson: 'a2-1' — тоді він виконаний, коли пройдено урок
  const modLesson = (m) => (m.lesson && EN.lessonById(m.lesson)) || null;
  const modDone = (m) => (modLesson(m) ? EN.lessonClosed(m.lesson) : !!EN.S.modules[m.id]);
  function overall() {
    let done = 0, total = 0;
    P.stages.forEach((s) => {
      if (s.built) EN.lessons.filter((l) => l.stage === s.id).forEach((l) => { total++; if (EN.lessonClosed(l.id)) done++; });
      else (s.modules || []).forEach((m) => { total++; if (modDone(m)) done++; });
    });
    return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
  }
  // Що прогрес не зберігається чи озвучення не працює, учень має побачити на будь-якому екрані, а не лише в налаштуваннях
  function voiceBanner() {
    let h = '';
    if (EN.store.newer) h += '<div class="warn-banner">⚠️ Ваш прогрес збережено новішою версією тренажера. Оновіть сторінку з інтернетом — доти зміни не зберігаються.</div>';
    else if (EN.store.broken) h += '<div class="warn-banner">⚠️ Не вдалося прочитати збережений прогрес. Подробиці — у ⚙️ «Налаштування».</div>';
    if (EN.TTS.silent()) h += '<div class="warn-banner voice-banner">🔇 Немає інтернету, а англійського голосу в цій системі немає, тому озвучення не працюватиме. Як додати голос, що працює без інтернету, — див. ⚙️ «Налаштування».</div>';
    return h;
  }

  function renderToday() {
    const t = EN.today(), wd = EN.dayOfWeek(t);
    const cur = EN.currentLesson();
    const counts = EN.srsCounts();
    const q = EN.srsQueue();
    const o = overall();
    const isA0 = cur && cur.stage === 'a0';
    const plan = P.week.find((w) => w.d === wd);
    const date = new Date().toLocaleDateString('uk-UA', { weekday: 'long', day: 'numeric', month: 'long' });
    const dictN = EN.S.dict.length;
    view().innerHTML = voiceBanner() + '<div id="install-tip"></div>' +
      '<div class="card"><div class="row"><div><h1>Hello! 👋</h1><div class="muted">' + esc(date) + '</div></div><span class="spacer"></span>' +
      '<div class="center"><div class="stat">🔥 ' + EN.streak() + '</div><div class="small muted">днів поспіль<br>(вихідні не рахуються)</div></div></div></div>' +
      '<div class="grid g2">' +
      '<div class="card"><h3>📌 План на сьогодні</h3>' +
      (plan ? '<p><b>' + plan.name + ':</b> ' + esc(isA0 ? P.weekA0 : plan.full) + '</p><p class="small muted">Якщо є лише 15 хв: ' + esc(isA0 ? 'половина уроку' : plan.min) + '.</p>'
        : '<p>Вихідний 🙂 Навчання за бажанням: серіал чи подкаст англійською, пісні, гра з англійським інтерфейсом.</p>') +
      '<p class="small">' + esc(P.daily) + '</p>' +
      '<div class="row"><a class="btn primary" href="#/lesson/' + cur.id + '">📘 Урок ' + esc(cur.num) + '</a>' +

      '<div class="card"><h3>⏱️ Таймер заняття</h3><div class="row"><span class="timer" id="tmr">15:00</span><span class="spacer"></span>' +

      '<p class="small muted" style="margin:6px 0 0">Почули нове слово на роботі, в серіалі чи пісні? Додайте його в словник — там його можна послухати з американською й британською вимовою, він потрапить у повторення, а словник можна експортувати й перенести на інший пристрій.</p></div>' +
      '<div class="grid g3">' +
      '<div class="card center"><div class="stat">' + o.pct + '%</div><div class="small muted">програми до B2 (' + o.done + ' з ' + o.total + ' уроків)</div><div class="bar" style="margin-top:8px"><i style="width:' + o.pct + '%"></i></div></div>' +
      '<div class="card center"><div class="stat">' + counts.known + '</div><div class="small muted">слів у повторенні</div></div>' +
      '<div class="card center"><div class="stat">' + counts.due + '</div><div class="small muted">слів на повторення сьогодні</div></div></div>';
    timerInit();

  let tmrInt = null;
  function timerInit() {
    const el = $('#tmr'); if (!el) return;
    $$('[data-min]').forEach((b) => b.onclick = () => {
      clearInterval(tmrInt);
      // Рахуємо від часу старту: на телефоні з вимкненим екраном тики setInterval зупиняються
      const end = Date.now() + b.dataset.min * 60000;
      const draw = () => {
        const left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
        el.textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0');
        return left;
      };
      draw();
      tmrInt = setInterval(() => { if (draw() <= 0) { clearInterval(tmrInt); EN.toast('⏰ Час вийшов! Well done — чудова робота!'); EN.TTS.say('Well done!'); } }, 250);
    });
    $('#tmr-stop').onclick = () => { clearInterval(tmrInt); el.textContent = '15:00'; };
  }
  function lessonChecks(l) {
    const s = EN.S.lessons[l.id] || {};
    const mk = (ok, txt) => '<span class="pill ' + (ok ? 'green' : 'gray') + '">' + (ok ? '✓ ' : '○ ') + txt + '</span>';
    const run = s.run && s.run.ft ? ' <span class="pill amber">⏸ вправи: ' + Object.keys(s.run.ft).length + ' з ' + (+s.run.n || 0) + '</span>' : '';
    return '<div class="row lesson-checks">' + (EN.lessonSkipped(l.id) ? '<span class="pill amber">⏭ пропущено</span>' : '') + mk(s.theory, 'Теорія') +
      mk(s.ex && s.ex.done, 'Вправи ≥ 80%' + (s.ex && s.ex.best != null ? ' (' + s.ex.best + '%)' : '')) + run +
      mk(s.speak, 'Розмова') + mk(s.mission, 'Місія') + '</div>';
  }
  function lessonBadge(l) {
    const st = EN.S.lessons[l.id] || {};
    if (EN.lessonDone(l.id)) return '<span class="pill green">✓ пройдено</span>';
    if (EN.lessonSkipped(l.id)) return '<span class="pill gray">⏭ пропущено</span>';
    if (st.run && st.run.ft) return '<span class="pill amber">⏸ ' + Object.keys(st.run.ft).length + '/' + (+st.run.n || 0) + '</span>';
    return st.opened ? '<span class="pill amber">у процесі</span>' : '';
  }

  function renderProgram() {
    const h = [];
    h.push('<div class="card"><h1>🗺️ Програма: від нуля до B2</h1><p>' + esc(P.intro) + '</p><p class="muted">' + esc(P.estimate) + '</p>' +
      '<button class="btn small no-print" onclick="window.print()">🖨️ Надрукувати / зберегти як PDF</button></div>');
    h.push('<div class="card"><h2>Принципи</h2><div class="grid g2">' + P.principles.map((p) => '<div><b>' + esc(p[0]) + '.</b> ' + esc(p[1]) + '</div>').join('') + '</div></div>');
    const wd = EN.dayOfWeek(EN.today());
    h.push('<div class="card"><h2>Тижневий ритм (15–30 хв)</h2><p class="small">' + esc(P.daily) + '</p><div class="tblwrap"><table class="week-plan"><tr><th>День</th><th>Повний варіант (30 хв)</th><th>Мінімум (15 хв)</th></tr>' +
      P.week.map((w) => '<tr' + (w.d === wd ? ' class="today-row"' : '') + '><td>' + w.name + '</td><td>' + esc(w.full) + '</td><td>' + esc(w.min) + '</td></tr>').join('') +
      '<tr><td>Сб–Нд</td><td colspan="2">Вільно. За бажанням — серіал, подкаст чи гра англійською.</td></tr></table></div><p class="small muted">' + esc(P.weekA0) + ' ' + esc(P.weekLong) + '</p></div>');
    P.stages.forEach((s, i) => {
      const items = s.built ? EN.lessons.filter((l) => l.stage === s.id) : s.modules;
      const done = s.built ? items.filter((l) => EN.lessonClosed(l.id)).length : items.filter(modDone).length;
      h.push('<details class="stage card"' + (i < 2 || done < items.length && done > 0 ? ' open' : '') + '><summary><div class="row"><span class="pill">' + esc(s.level) + '</span><h2 style="margin:0">' + esc(s.title) + '</h2><span class="spacer"></span><span class="small muted">тижні ' + esc(s.weeks) + ' · ' + done + '/' + items.length + '</span></div></summary>' +
        '<p><b>Після етапу я вмію:</b></p><ul class="check">' + s.cando.map((c) => '<li>' + esc(c) + '</li>').join('') + '</ul>' +
        (s.checkpoint ? '<p class="tip"><b>Контрольна точка:</b> ' + esc(s.checkpoint) + '</p>' : '') +
        (s.built ? (items.length ? items.map((l) => '<a class="lesson-item" href="#/lesson/' + l.id + '"><span class="num">' + esc(l.num) + '</span><span>' + esc(l.title) + '<br><span class="small muted">' + esc(l.dur) + ' · ' + esc(l.goals.join('; ')) + '</span></span><span class="spacer"></span>' + lessonBadge(l) + '</a>').join('') : '<p class="small muted">Уроки етапу ще не додано.</p>')
          : items.map((m) => '<details class="mod"><summary>' + (modDone(m) ? '<span class="done-mark">✓</span> ' : '') + esc(m.title) + ' <span class="small muted">· тижні ' + esc(m.weeks) + '</span></summary><div class="kv">' +
              [['Граматика', m.grammar], ['Лексика', m.vocab], ['Розмова', m.speak], ['Слухання', m.listen], ['Читання', m.read], ['Письмо', m.write], ['Місія', m.mission]].map((r) => '<b>' + r[0] + '</b><span>' + esc(r[1]) + '</span>').join('') +
              '</div><label class="row" style="margin-top:8px"><input type="checkbox" data-mod="' + m.id + '"' + (EN.S.modules[m.id] ? ' checked' : '') + '> Модуль виконано</label></details>').join('')) +
        '</details>');
    });
    const X = EN.exam;
    h.push('<div class="card"><h2>🎓 Іспити й сертифікати</h2><div class="tblwrap"><table>' + X.items.map((r) => '<tr><td><b>' + esc(r[0]) + '</b></td><td>' + esc(r[1]) + '</td></tr>').join('') + '</table></div>' +
      '<p class="small muted">' + esc(X.note) + ' Перевірено: ' + esc(X.checked) + '. ' + X.links.map((l) => '<a href="' + l[1] + '" target="_blank" rel="noopener">' + esc(l[0]) + '</a>').join(' · ') + '</p></div>');
    h.push('<div class="card"><h2>🔗 Ресурси</h2>' + EN.resources.map((g) => '<h3>' + esc(g.cat) + '</h3><ul>' + g.items.map((r) => '<li><a href="' + r[1] + '" target="_blank" rel="noopener"><b>' + esc(r[0]) + '</b></a> <span class="pill gray">' + esc(r[3]) + '</span> — ' + esc(r[2]) + '</li>').join('') + '</ul>').join('') + '</div>');
    view().innerHTML = h.join('');
    $$('[data-mod]').forEach((c) => c.onchange = () => { EN.S.modules[c.dataset.mod] = c.checked; EN.save(); EN.toast(c.checked ? 'Модуль позначено ✓' : 'Позначку знято'); });
  }

    const groups = P.stages.filter((s) => EN.lessons.some((l) => l.stage === s.id));
    view().innerHTML = '<div class="card"><h1>📘 Уроки</h1><p class="muted">Кожен урок складається з теорії з озвученням, слів, вправ, розмовної практики й місії в реальному житті. Урок зараховано, коли вправи виконано на ≥ 80%.</p>' +
      '<p class="small">Будь-який урок можна відкрити в будь-який момент. Усередині уроку є кнопки <b>«Пропустити урок»</b> (якщо тему вже знаєте), <b>«Почати з цього уроку»</b> (попередні позначаться як пропущені) і <b>«Пройти наново»</b>. Почати все з нуля можна в ⚙️ «Налаштуваннях».</p>' +

      '<a class="card lesson-item" href="#/dict/practice" style="text-decoration:none"><span class="num">📒</span><span><b>Тренування мого словника</b><br><span class="small muted">диктант і переклад зі слів, які ви додали самі</span></span></a>';
  }

  function lessonControls(l, idx) {
    const done = EN.lessonDone(l.id), skipped = EN.lessonSkipped(l.id);
    const st = EN.S.lessons[l.id] || {};
    const hasProgress = st.theory || st.ex || st.speak || st.mission || st.run || st.skipped;
    const earlierOpen = EN.lessons.slice(0, idx).some((x) => !EN.lessonClosed(x.id));
    return '<div class="row small" style="margin-top:8px">' +
      (!done && !skipped ? '<button class="btn small" id="lc-skip" title="Тему вже знаю — перейти до наступного уроку">⏭ Пропустити урок</button>' : '') +
      (skipped ? '<button class="btn small" id="lc-unskip">↩ Повернути урок</button>' : '') +
      (earlierOpen ? '<button class="btn small" id="lc-from" title="Усі попередні незавершені уроки позначаться як пропущені">▶ Почати з цього уроку</button>' : '') +
      (hasProgress ? '<button class="btn small" id="lc-reset" title="Скинути позначки й вправи цього уроку (слова лишаються)">↺ Пройти урок наново</button>' : '') +
      '</div>';
  }
  // Друге натискання підтверджує: незворотні дії не мають спрацьовувати від випадкового дотику
  function confirmClick(btn, label, action) {
    if (!btn) return;
    const orig = btn.textContent;
    btn.onclick = () => {
      if (!btn.dataset.sure) { btn.dataset.sure = '1'; btn.textContent = label; setTimeout(() => { btn.dataset.sure = ''; btn.textContent = orig; }, 3500); return; }
      action();
    };
  }
  EN.confirmClick = confirmClick;
  function bindLessonControls(l, tab, next) {
    const reload = () => renderLesson(l.id, tab);
    const sk = $('#lc-skip');
    if (sk) sk.onclick = () => { EN.skipLesson(l.id, true); EN.toast('Урок ' + l.num + ' пропущено'); location.hash = next ? '#/lesson/' + next.id : '#/lessons'; };
    const un = $('#lc-unskip');
    if (un) un.onclick = () => { EN.skipLesson(l.id, false); EN.toast('Урок повернуто в план'); reload(); };
    confirmClick($('#lc-from'), '▶ Так, попередні — пропустити', () => { EN.startFrom(l.id); EN.toast('Тепер навчання починається з уроку ' + l.num); reload(); });
    confirmClick($('#lc-reset'), '↺ Точно скинути прогрес уроку?', () => { EN.resetLesson(l.id); EN.toast('Прогрес уроку скинуто. Слова лишаються в повторенні.'); reload(); });
  }

  function renderLesson(id, tab) {
    const l = EN.lessonById(id);
    if (!l) { location.hash = '#/lessons'; return; }
    const st = EN.lessonState(id);
    if (!st.opened) { st.opened = true; EN.save(); }
    tab = tab || 'theory';
    const idx = EN.lessons.indexOf(l);
    const prev = EN.lessons[idx - 1], next = EN.lessons[idx + 1];
    const tabs = [['theory', 'Теорія'], ['words', 'Слова (' + l.vocab.length + ')'], ['ex', 'Вправи (' + l.ex.length + ')'], ['speak', 'Розмова'], ['mission', 'Місія']];
    // На телефоні повна шапка уроку займала б увесь перший екран, і вправа опинялася б під екранною клавіатурою
    const narrow = window.matchMedia && matchMedia('(max-width:700px)').matches;
    view().innerHTML = voiceBanner() + '<div class="card lesson-head tab-' + tab + '"><div class="row small muted"><a href="#/lessons">← Уроки</a><span class="spacer"></span>' + esc(stageOf(l.stage).level) + ' · ' + esc(l.dur) + '</div>' +
      '<h1>' + esc(l.num + ' · ' + l.title) + '</h1><p class="small lesson-goals"><b>Мета:</b> ' + esc(l.goals.join(' · ')) + '</p>' + lessonChecks(l) +
      (narrow ? '<details class="lc-more"><summary class="small muted">⋯ Керування уроком</summary>' + lessonControls(l, idx) + '</details>' : lessonControls(l, idx)) +
      '<div class="subtabs">' + tabs.map((t) => '<button data-tab="' + t[0] + '" class="' + (t[0] === tab ? 'active' : '') + '">' + t[1] + '</button>').join('') + '</div></div>' +
      '<div id="lesson-body"></div>' +
      '<div class="row" style="margin-top:6px">' + (prev ? '<a class="btn" href="#/lesson/' + prev.id + '">← ' + esc(prev.num) + '</a>' : '') + '<span class="spacer"></span>' + (next ? '<a class="btn" href="#/lesson/' + next.id + '">' + esc(next.num) + ' →</a>' : '') + '</div>';
    $$('.subtabs button').forEach((b) => b.onclick = () => { location.hash = '#/lesson/' + id + '/' + b.dataset.tab; });
    bindLessonControls(l, tab, next);
    const body = $('#lesson-body');
    if (tab === 'theory') {
      body.innerHTML = '<div class="card theory">' + EN.rich(l.theory) + '<div class="row" style="margin-top:12px"><span class="spacer"></span><button class="btn primary" id="th-done">' + (st.theory ? '✓ Прочитано' : 'Прочитав(ла) → до слів') + '</button></div></div>';
      $('#th-done').onclick = () => { st.theory = true; EN.save(); location.hash = '#/lesson/' + id + '/words'; };
    } else if (tab === 'words') {
      body.innerHTML = '<div class="card">' + (l.vocab.length ? '<p class="small muted">Ці слова вже додано до «Слів» — вони з\'являтимуться на повторення (до ' + (+EN.S.settings.newPerDay || 0) + ' нових на день). Натисніть слово, щоб почути вимову.</p><div class="tblwrap"><table><tr><th>Англійською</th><th>Українською</th><th>Примітка</th></tr>' +
        l.vocab.map((w) => '<tr><td>' + EN.rich('[[' + w[0] + '|' + EN.sayText(w[0]) + ']]') + '</td><td>' + esc(w[1]) + '</td><td class="small muted">' + esc(w[2] || '') + '</td></tr>').join('') + '</table></div>' : '<p>У цьому уроці немає нових слів — повторіть слова попередніх уроків.</p>') +
        '<div class="row"><a class="btn" href="#/words">🃏 Повторювати слова</a><span class="spacer"></span><a class="btn primary" href="#/lesson/' + id + '/ex">До вправ →</a></div></div>';
    } else if (tab === 'ex') {
      EN.runExercises(body, l.ex, { saveKey: id, onFinish: (score) => {
        st.ex = st.ex || {};
        st.ex.best = Math.max(st.ex.best || 0, score);
        if (score >= 80) st.ex.done = true;
        EN.save();
        const checks = $('.lesson-checks'); if (checks) checks.outerHTML = lessonChecks(l);
      } });
    } else if (tab === 'speak') {
      body.innerHTML = '<div class="card"><h3>🔁 Shadowing: слухайте → повторюйте → записуйте себе</h3>' +
        (l.say.length ? l.say.map((p, k) => '<div class="lesson-item" style="flex-wrap:wrap"><span>' + EN.rich('[[' + p[0] + ']]') + '<br><span class="small muted">' + esc(p[1]) + '</span></span><span class="spacer"></span><button class="btn small" data-slow="' + k + '">🐢</button><span class="rec" data-k="' + k + '"></span></div>').join('') : '<p class="muted">Візьміть фрази з попередніх уроків у вкладці «Розмова».</p>') +
        '<h3 style="margin-top:16px">🗣️ Говоріть уголос</h3><ul>' + l.speak.map((s) => '<li>' + EN.rich(s) + '</li>').join('') + '</ul>' +
        '<div class="row"><span class="rec-free"></span><span class="spacer"></span><button class="btn primary" id="sp-done">' + (st.speak ? '✓ Розмову виконано' : 'Позначити як виконане') + '</button></div></div>';
      $$('.rec', body).forEach((el) => EN.recorderWidget(el));
      EN.recorderWidget($('.rec-free', body));
      $$('[data-slow]', body).forEach((b) => b.onclick = () => EN.TTS.say(l.say[+b.dataset.slow][0], 0.6));
      $('#sp-done').onclick = () => { st.speak = true; EN.save(); EN.logActivity('speak'); renderLesson(id, 'speak'); };
    } else if (tab === 'mission') {
      body.innerHTML = '<div class="card"><h3>🎯 Місія в реальному житті</h3><p style="font-size:1.1rem">' + EN.rich(l.mission) + '</p>' +
        '<p class="small muted">Не вийшло з першого разу? Це нормально — спробуйте ще раз наступного тижня. Головне — що ви спробували говорити й писати англійською.</p>' +
        '<div class="row"><span class="spacer"></span><button class="btn primary" id="ms-done">' + (st.mission ? '✓ Місію виконано' : 'Я це зробив(ла)!') + '</button></div></div>';
      $('#ms-done').onclick = () => { st.mission = true; EN.save(); EN.toast('Great job! 🎉'); renderLesson(id, 'mission'); };
    }
  }

  EN.views = { NAV, renderToday, renderProgram, renderLessons, renderLesson, voiceBanner };
})(window.EN);

</script>
<script>
/* Екрани словника: #/dict — список і додавання, #/dict/io — імпорт та експорт, #/dict/practice — тренування */
(function (EN) {
  'use strict';
  const esc = EN.esc, $ = (s, r) => (r || document).querySelector(s), $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const view = () => document.getElementById('view');
  const D = EN.Dict;
  // Текст, а не емодзі-прапори: Windows показує прапори як дві літери «us», «gb»
  const FLAG = { us: 'US', gb: 'UK' };
  const other = (acc) => (acc === 'gb' ? 'us' : 'gb');
  // autocorrect / spellcheck вимкнено: телефон «виправляв» би англійські слова, а підкреслення заважало б
  const INP = 'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"';
  // Знімок для «Скасувати імпорт» живе лише до перезавантаження сторінки: це страховка на хвилину, а не історія змін
  let lastImport = null;

  const cambridge = (en) => 'https://dictionary.cambridge.org/dictionary/english/' + encodeURIComponent(EN.sayText(en).toLowerCase().replace(/^to\s+/, '').trim().replace(/\s+/g, '-'));
  const youglish = (en) => 'https://youglish.com/pronounce/' + encodeURIComponent(EN.sayText(en).replace(/^to\s+/i, '').trim()) + '/english/' + (EN.S.settings.accent === 'gb' ? 'uk' : 'us');

  function statusPill(w) {
    const c = D.card(w.en);
    if (!c) return '<span class="pill gray">нове</span>';
    const d = c.due - EN.today();
    return d <= 0 ? '<span class="pill amber">повторити сьогодні</span>' : '<span class="pill green">через ' + d + ' дн.</span>';
  }
  function order() {
    const idx = EN.S.dict.map((_, i) => i), how = EN.S.ui.dictSort, w = EN.S.dict;
    if (how === 'az') idx.sort((a, b) => w[a].en.localeCompare(w[b].en, 'en', { sensitivity: 'base' }));
    else if (how === 'due') {
      const due = (i) => { const c = D.card(w[i].en); return c ? c.due : -1e9; };
      idx.sort((a, b) => due(a) - due(b));
    } else idx.sort((a, b) => (w[b].added || '').localeCompare(w[a].added || '') || b - a);
    return idx;
  }
  function rowHtml(w, i) {
    const acc = EN.S.settings.accent;
    return '<div class="dict-row" data-i="' + i + '" data-text="' + esc((w.en + ' ' + w.uk + ' ' + (w.note || '') + ' ' + (w.ex || '')).toLowerCase()) + '">' +
      '<div class="dict-main"><div class="dict-en">' + EN.sayHtml(w.en, EN.sayText(w.en)) + (w.ipa ? ' <span class="ipa">' + esc(w.ipa) + '</span>' : '') + ' ' + statusPill(w) + '</div>' +
      '<div class="dict-uk">' + esc(w.uk) + (w.note ? ' <span class="small muted">· ' + esc(w.note) + '</span>' : '') + '</div>' +
      (w.ex ? '<div class="dict-ex small">' + EN.sayHtml(w.ex) + '</div>' : '') + '</div>' +
      '<div class="dict-actions"><button class="ic" data-act="say" title="Послухати">🔊</button><button class="ic" data-act="slow" title="Повільно">🐢</button>' +
      '<button class="ic" data-act="alt" title="Послухати з ' + (acc === 'gb' ? 'американською' : 'британською') + ' вимовою">' + FLAG[other(acc)] + '</button>' +
      (D.nativeUrl(w, acc) ? '<button class="ic" data-act="native" title="Запис живої людини">🎙️</button>' : '') +
      '<button class="ic" data-act="edit" title="Редагувати, транскрипція, Cambridge, YouGlish">✎</button></div></div>';
  }
  function editHtml(w) {
    return '<div class="dict-edit"><div class="grid g2">' +
      '<label class="small muted">Англійською<input type="text" class="e-en" lang="en" ' + INP + ' value="' + esc(w.en) + '"></label>' +
      '<label class="small muted">Переклад<input type="text" class="e-uk" lang="uk" value="' + esc(w.uk) + '"></label>' +
      '<label class="small muted">Примітка<input type="text" class="e-note" lang="uk" value="' + esc(w.note || '') + '"></label>' +
      '<label class="small muted">Транскрипція<input type="text" class="e-ipa" ' + INP + ' value="' + esc(w.ipa || '') + '"></label></div>' +
      '<label class="small muted">Приклад<input type="text" class="e-ex" lang="en" ' + INP + ' value="' + esc(w.ex || '') + '"></label>' +
      '<div class="row" style="margin-top:8px"><button class="btn primary small" data-act="save">Зберегти</button><button class="btn small" data-act="cancel">Скасувати</button>' +
      '<button class="btn small" data-act="lookup" title="Знайти транскрипцію й запис носія">🔎 Транскрипція</button>' +
      '<a class="btn small" href="' + cambridge(w.en) + '" target="_blank" rel="noopener noreferrer">📖 Cambridge</a>' +
      '<a class="btn small" href="' + youglish(w.en) + '" target="_blank" rel="noopener noreferrer" title="Слово у відео з реальними людьми">▶ YouGlish</a>' +
      '<span class="spacer"></span><button class="btn small danger" data-act="del">✕ Видалити</button></div></div>';
  }

  function renderDict(sub) {
    if (sub === 'io') return renderIO();
    if (sub === 'practice') return renderPractice();
    const n = EN.S.dict.length, q = EN.srsQueue('my'), acc = EN.S.settings.accent;
    view().innerHTML = EN.views.voiceBanner() +
      '<div class="card"><div class="row"><h1 style="margin:0">📒 Мій словник</h1><span class="spacer"></span><span class="pill">' + n + ' ' + plural(n, 'слово', 'слова', 'слів') + '</span></div>' +
      '<p class="small muted">Слова з роботи, серіалів, пісень. 🔊 — вимова, 🐢 — повільно, ' + FLAG[other(acc)] + ' — інший акцент, 🎙️ — запис живої людини (якщо є). ✎ — редагувати, транскрипція, Cambridge і YouGlish.</p>' +
      '<div class="row"><a class="btn primary" href="#/words/review/my">🃏 Повторити (' + q.total + ')</a><a class="btn" href="#/dict/practice">🎯 Тренування</a><a class="btn" href="#/dict/io">⇅ Імпорт / експорт</a>' +
      (D.missing().length ? '<button class="btn" id="d-fill" title="Знайти транскрипцію й записи носіїв для слів, у яких їх ще немає">🔎 Транскрипція (' + D.missing().length + ')</button>' : '') +
      '<span class="spacer"></span><span class="small muted">Вимова:</span><span class="seg" role="group" title="Вимова за замовчуванням">' + ['us', 'gb'].map((a) => '<button data-acc="' + a + '" class="' + (a === acc ? 'active' : '') + '" title="' + (a === 'gb' ? 'Британська вимова' : 'Американська вимова') + '">' + FLAG[a] + '</button>').join('') + '</span></div></div>' +
      '<div class="card" id="d-add"><h3 style="margin-top:0">＋ Додати слово</h3><div class="grid g2">' +
      '<label class="small muted">Англійською<span class="row nowrap"><input type="text" id="d-en" lang="en" ' + INP + ' placeholder="напр. reschedule" maxlength="200"><button class="btn" id="d-en-say" title="Послухати">🔊</button></span></label>' +
      '<label class="small muted">Переклад<input type="text" id="d-uk" lang="uk" placeholder="напр. перенести (зустріч)" maxlength="300"></label></div>' +
      '<details id="d-more"><summary class="small">Примітка, приклад, транскрипція</summary><div class="grid g2" style="margin-top:6px">' +
      '<input type="text" id="d-note" lang="uk" placeholder="Примітка: дієслово, сленг, US…" maxlength="300"><input type="text" id="d-ipa" ' + INP + ' placeholder="Транскрипція, напр. /ˌriːˈskedʒuːl/" maxlength="100"></div>' +
      '<input type="text" id="d-ex" lang="en" ' + INP + ' placeholder="Приклад: Can we reschedule the call?" maxlength="500" style="margin-top:8px"></details>' +
      '<div class="row" style="margin-top:10px"><button class="btn primary" id="d-add-btn">Додати</button><button class="btn" id="d-look" title="Знайти транскрипцію й запис носія у словниковій базі">🔎 Транскрипція</button><span id="d-look-res" class="small muted"></span></div>' +
      (EN.S.settings.autoIpa ? '<p class="small muted" style="margin:6px 0 0">Транскрипція й записи носіїв шукаються автоматично після додавання (сервіс dictionaryapi.dev отримує лише англійське слово). Вимкнути — в ⚙️ «Налаштування».</p>' : '') + '</div>' +
      '<div class="card"><div class="row"><input type="text" id="d-q" placeholder="Пошук англійською чи українською…" style="flex:1;min-width:180px"><select id="d-sort" style="width:auto">' +
      [['new', 'Нові спершу'], ['az', 'A–Z'], ['due', 'За повторенням']].map((o) => '<option value="' + o[0] + '"' + (EN.S.ui.dictSort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></div><div id="d-list"></div></div>';
    if (!n) $('#d-more').open = false;
    drawList();
    bindAdd();
    $$('[data-acc]').forEach((b) => b.onclick = () => {
      EN.S.settings.accent = b.dataset.acc;
      EN.save(); renderDict();
      EN.TTS.say('Hello! This is how it sounds.');
    });
    const fill = $('#d-fill');
    if (fill) fill.onclick = async () => {
      if (fill.dataset.busy) { fill.dataset.stop = '1'; return; }
      fill.dataset.busy = '1';
      const r = await D.enrichAll((i, n, found) => { fill.textContent = '🔎 ' + i + ' / ' + n + ' (знайдено ' + found + ') · стоп'; }, () => !!fill.dataset.stop || !document.body.contains(fill));
      if (!document.body.contains(fill)) return;
      EN.toast(r.offline ? 'Словниковий сервіс не відповідає (немає інтернету?)' : 'Знайдено транскрипцію для ' + r.found + ' з ' + r.total + ' слів', 4000);
      renderDict();
    };
    $('#d-sort').onchange = (e) => { EN.S.ui.dictSort = e.target.value; EN.save(); drawList(); };
    $('#d-q').oninput = filter;
    $('#d-list').addEventListener('click', onListClick);
  }
  function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    return m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? few : many;
  }
  function drawList() {
    const el = $('#d-list');
    if (!el) return;
    el.innerHTML = EN.S.dict.length ? order().map((i) => rowHtml(EN.S.dict[i], i)).join('')
      : '<p class="muted">Словник порожній. Додайте перше слово вгорі або <a href="#/dict/io">імпортуйте список</a> з файлу, таблиці чи тексту.</p>';
    filter();
  }
  function filter() {
    const inp = $('#d-q');
    const v = inp ? inp.value.trim().toLowerCase() : '';
    $$('#d-list .dict-row').forEach((r) => { r.style.display = !v || r.dataset.text.includes(v) ? '' : 'none'; });
  }
  function bindAdd() {
    const en = $('#d-en'), uk = $('#d-uk'), res = $('#d-look-res');
    $('#d-en-say').onclick = () => { if (en.value.trim()) EN.TTS.say(EN.sayText(en.value)); else en.focus(); };
    $('#d-look').onclick = async () => {
      const w = en.value.trim();
      if (!w) { EN.toast('Спершу введіть англійське слово'); en.focus(); return; }
      res.textContent = 'Шукаю…';
      const r = await D.lookup(w);
      if (r === undefined) { res.textContent = 'Сервіс не відповів (немає інтернету?)'; return; }
      if (!r || (!r.ipa && !r.au)) { res.textContent = 'У словниковій базі цього слова немає — звучатиме синтезований голос.'; return; }
      if (r.ipa) { $('#d-ipa').value = r.ipa; $('#d-more').open = true; }
      res.innerHTML = (r.ipa ? esc(r.ipa) + ' · ' : '') + (r.au ? 'є запис носія: ' + Object.keys(r.au).map((k) => '<button class="btn small" data-native="' + k + '">🎙️ ' + k.toUpperCase() + '</button>').join(' ') : 'запису носія немає');
      $$('[data-native]', res).forEach((b) => b.onclick = () => EN.TTS.playUrl(r.au[b.dataset.native]));
    };
    const add = () => {
      const fields = { en: en.value, uk: uk.value, note: $('#d-note').value, ex: $('#d-ex').value, ipa: $('#d-ipa').value };
      if (!fields.en.trim() || !fields.uk.trim()) { EN.toast('Заповніть англійське слово і переклад'); (fields.en.trim() ? uk : en).focus(); return; }
      const r = D.add(fields);
      if (!r.ok) {
        if (r.reason === 'dup') { EN.toast('«' + r.word.en + '» уже є у словнику: ' + r.word.uk, 3500); highlight(r.word.en); }
        else if (r.reason === 'full') EN.toast('У словнику вже ' + D.MAX_WORDS + ' слів — більше не вміщується');
        return;
      }
      ['#d-en', '#d-uk', '#d-note', '#d-ex', '#d-ipa'].forEach((s) => { $(s).value = ''; });
      res.textContent = '';
      EN.toast('Додано: ' + r.word.en + ' ✓');
      drawList();
      highlight(r.word.en);
      if (!EN.touch()) en.focus();
      if (EN.S.settings.autoIpa && !r.word.ipa) D.enrich(r.word.en).then((x) => { if (x && (x.ipa || x.au) && $('#d-list')) drawList(); });
    };
    $('#d-add-btn').onclick = add;
    [en, uk, $('#d-note'), $('#d-ex'), $('#d-ipa')].forEach((i) => i.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); add(); } }));
  }
  function highlight(en) {
    const i = D.index(en);
    const row = $('#d-list .dict-row[data-i="' + i + '"]');
    if (!row) return;
    row.classList.add('flash-row');
    row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    setTimeout(() => row.classList.remove('flash-row'), 1600);
  }
  function onListClick(e) {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const row = b.closest('.dict-row'), w = EN.S.dict[+row.dataset.i];
    if (!w) return;
    const acc = EN.S.settings.accent, act = b.dataset.act;
    if (act === 'say') EN.TTS.say(EN.sayText(w.en));
    else if (act === 'slow') EN.TTS.say(EN.sayText(w.en), 0.6);
    else if (act === 'alt') EN.TTS.say(EN.sayText(w.en), null, other(acc));
    else if (act === 'native') EN.TTS.playUrl(D.nativeUrl(w, acc));
    else if (act === 'edit') {
      row.innerHTML = editHtml(w);
      row.classList.add('editing');
      const del = $('[data-act="del"]', row);
      EN.confirmClick(del, '✕ Точно видалити?', () => { D.remove(w.en); EN.toast('Видалено: ' + w.en); drawList(); });
      if (!EN.touch()) $('.e-uk', row).focus();
    } else if (act === 'cancel') drawList();
    else if (act === 'save') {
      const r = D.update(w.en, { en: $('.e-en', row).value, uk: $('.e-uk', row).value, note: $('.e-note', row).value, ex: $('.e-ex', row).value, ipa: $('.e-ipa', row).value });
      if (!r.ok) { EN.toast(r.reason === 'dup' ? 'Таке слово вже є: ' + r.word.en : 'Заповніть англійське слово і переклад'); return; }
      EN.toast('Збережено ✓');
      drawList(); highlight(r.word.en);
    } else if (act === 'lookup') {
      b.textContent = '🔎 Шукаю…';
      D.lookup($('.e-en', row).value || w.en).then((r) => {
        b.textContent = '🔎 Транскрипція';
        if (r === undefined) { EN.toast('Сервіс не відповів (немає інтернету?)'); return; }
        if (!r || (!r.ipa && !r.au)) { EN.toast('У словниковій базі цього слова немає'); return; }
        if (r.ipa) $('.e-ipa', row).value = r.ipa;
        // Запис носія зберігаємо одразу, а транскрипцію учень бачить у полі й може виправити перед «Зберегти»
        if (r.au) D.update(w.en, { au: r.au });
        EN.toast(r.au ? 'Знайдено транскрипцію і запис носія 🎙️' : 'Знайдено транскрипцію');
      });
    }
  }

  function renderIO() {
    const n = EN.S.dict.length, share = D.canShareFiles();
    view().innerHTML = '<div class="card"><div class="row small muted"><a href="#/dict">← Мій словник</a></div><h1>⇅ Імпорт та експорт словника</h1>' +
      '<p class="small muted">Словник живе в браузері на цьому пристрої. Щоб перенести його на телефон чи інший браузер — експортуйте файл тут і імпортуйте його там. Прогрес уроків не переноситься, лише словник.</p></div>' +
      '<div class="card"><h2>⬇️ Експорт</h2><p>У словнику <b>' + n + '</b> ' + plural(n, 'слово', 'слова', 'слів') + '.</p>' +
      '<label class="row small"><input type="checkbox" id="x-prog" checked> Разом із прогресом повторення (коли яке слово повторювати)</label>' +
      '<div class="row" style="margin-top:8px"><button class="btn primary" id="x-json"' + (n ? '' : ' disabled') + '>⬇️ Файл словника (.json)</button>' +
      (share ? '<button class="btn" id="x-share"' + (n ? '' : ' disabled') + '>📤 Поділитися файлом</button>' : '') +
      '<button class="btn" id="x-csv"' + (n ? '' : ' disabled') + '>⬇️ Таблиця (.csv)</button><button class="btn" id="x-tsv"' + (n ? '' : ' disabled') + '>📋 Копіювати як таблицю</button></div>' +
      '<ul class="small muted"><li><b>.json</b> — повна копія (з транскрипцією, записами носіїв і прогресом). Для перенесення на інший пристрій і резервної копії.</li>' +
      '<li><b>.csv</b> — для Excel, Google Таблиць, Anki, Quizlet. <b>📋 Копіювати як таблицю</b> — вставте в Google Таблиці чи Excel (Ctrl+V), колонки розкладуться самі.</li>' +
      '<li>Перенести на телефон: «Поділитися» → надішліть файл собі в Telegram чи пошту → на телефоні збережіть його → тут «📂 Вибрати файл».</li></ul></div>' +
      '<div class="card"><h2>⬆️ Імпорт</h2><p class="small muted">Файл цього тренажера (.json), таблиця (.csv, .tsv) або текст (.txt). Перед імпортом ви побачите, що саме додасться.</p>' +
      '<div class="row"><label class="btn primary file-btn">📂 Вибрати файл<input type="file" id="i-file" accept=".json,.csv,.tsv,.txt,application/json,text/csv,text/plain,text/tab-separated-values" hidden></label></div>' +
      '<p class="small" style="margin:12px 0 4px">…або вставте список, по слову на рядок:</p>' +
      '<textarea id="i-text" rows="6" lang="en" ' + INP + ' placeholder="apple — яблуко\nto reschedule - перенести (зустріч)\nqueue; черга\n(можна вставити клітинки з Excel чи Google Таблиць: англійське слово і переклад у сусідніх колонках)"></textarea>' +
      '<div class="row" style="margin-top:8px"><button class="btn" id="i-parse">Розібрати текст</button></div><div id="i-preview"></div></div>' +
      '<div class="card"><h3>🗑️ Очистити словник</h3><p class="small muted">Видаляє всі слова словника і їхній прогрес повторення на цьому пристрої. Спершу збережіть файл словника. Уроки й налаштування не зачіпаються.</p>' +
      '<button class="btn danger" id="i-clear"' + (n ? '' : ' disabled') + '>Очистити словник</button></div>';
    const prog = () => $('#x-prog').checked;
    $('#x-json').onclick = () => { D.download(D.fileName('json'), D.toJson(prog()), 'application/json'); EN.toast('Файл збережено в «Завантаження»'); };
    if (share) $('#x-share').onclick = () => D.share(D.fileName('json'), D.toJson(prog()), 'application/json').catch((e) => { if (e && e.name !== 'AbortError') EN.toast('Не вдалося поділитися: ' + (e.name || e)); });
    // BOM потрібен Excel, інакше він відкриє UTF-8 як кракозябри
    $('#x-csv').onclick = () => { D.download(D.fileName('csv'), '﻿' + D.toCsv(), 'text/csv;charset=utf-8'); EN.toast('Таблицю збережено в «Завантаження»'); };
    $('#x-tsv').onclick = async () => { EN.toast(await D.copy(D.toTsv()) ? 'Скопійовано — вставте в таблицю (Ctrl+V)' : 'Не вдалося скопіювати'); };
    $('#i-file').onchange = (e) => {
      const f = e.target.files[0];
      if (!f) return;
      if (f.size > 10 * 1024 * 1024) { EN.toast('Файл завеликий (понад 10 МБ)'); return; }
      const rd = new FileReader();
      rd.onload = () => preview(D.parse(rd.result, f.name), f.name);
      rd.onerror = () => EN.toast('Не вдалося прочитати файл');
      rd.readAsText(f, 'utf-8');
      e.target.value = '';
    };
    $('#i-parse').onclick = () => {
      const t = $('#i-text').value;
      if (!t.trim()) { EN.toast('Вставте текст у поле'); return; }
      preview(D.parse(t), '');
    };
    EN.confirmClick($('#i-clear'), 'Точно видалити всі ' + n + ' ' + plural(n, 'слово', 'слова', 'слів') + '?', () => { D.clear(); EN.toast('Словник очищено'); renderIO(); });
    if (lastImport) showUndo();
  }
  const KIND = { json: 'файл словника', csv: 'таблиця CSV', tsv: 'таблиця', text: 'текст', empty: 'порожньо' };
  function preview(parsed, source) {
    const p = D.plan(parsed), el = $('#i-preview');
    const total = p.fresh.length + p.same.length + p.conflict.length;
    if (!total) {
      el.innerHTML = '<div class="note">Не знайдено жодного слова з перекладом' + (p.bad.length ? ': ' + p.bad.length + ' ' + plural(p.bad.length, 'рядок', 'рядки', 'рядків') + ' не розпізнано. Приклад: <code>' + esc(p.bad[0].text) + '</code>' : '') +
        '. Кожен рядок має містити англійське слово і переклад через «—», «-», «;», «=» чи табуляцію.</div>';
      return;
    }
    const row = (r, st, cls) => '<tr><td>' + esc(r.en) + '</td><td>' + esc(r.uk) + '</td><td><span class="pill ' + cls + '">' + st + '</span></td></tr>';
    const sample = [].concat(p.conflict.map((x) => row(x.row, 'інший переклад: ' + esc(x.cur.uk), 'amber')), p.fresh.map((r) => row(r, 'нове', 'green')), p.same.map((x) => row(x.row, 'вже є', 'gray'))).slice(0, 40);
    el.innerHTML = '<div class="card inner"><h3>Перегляд: ' + (source ? esc(source) + ' (' + KIND[p.kind] + ')' : 'вставлений ' + KIND[p.kind]) + '</h3><div class="row small">' +
      '<span class="pill green">нових: ' + p.fresh.length + '</span><span class="pill gray">вже є: ' + p.same.length + '</span><span class="pill amber">з іншим перекладом: ' + p.conflict.length + '</span>' +
      (p.dup ? '<span class="pill gray">повторів у файлі: ' + p.dup + '</span>' : '') + (p.bad.length ? '<span class="pill red">не розпізнано: ' + p.bad.length + '</span>' : '') + '</div>' +
      (p.conflict.length ? '<p class="small" style="margin-bottom:4px"><b>Слова з іншим перекладом:</b></p><div class="row small">' +
        [['keep', 'залишити мій переклад'], ['replace', 'замінити перекладом з файлу'], ['merge', 'об\'єднати переклади']].map((o, k) => '<label><input type="radio" name="i-conf" value="' + o[0] + '"' + (k ? '' : ' checked') + '> ' + o[1] + '</label>').join('') + '</div>' : '') +
      (p.withCards ? '<label class="row small" style="margin-top:6px"><input type="checkbox" id="i-prog" checked> Узяти прогрес повторення з файлу (для слів, яких ви ще не повторювали)</label>' : '') +
      '<div class="tblwrap" style="max-height:320px;overflow:auto;margin-top:8px"><table><tr><th>Англійською</th><th>Переклад</th><th>Стан</th></tr>' + sample.join('') + '</table></div>' +
      (total > 40 ? '<p class="small muted">Показано 40 з ' + total + '.</p>' : '') +
      (p.bad.length ? '<details class="small"><summary>Нерозпізнані рядки (' + p.bad.length + ')</summary><ul>' + p.bad.slice(0, 20).map((b) => '<li>рядок ' + b.line + ': <code>' + esc(b.text) + '</code></li>').join('') + '</ul></details>' : '') +
      '<div class="row" style="margin-top:10px"><button class="btn primary" id="i-go"' + (p.fresh.length || p.conflict.length || p.same.length ? '' : ' disabled') + '>Імпортувати</button><button class="btn" id="i-cancel">Скасувати</button></div></div>';
    $('#i-cancel').onclick = () => { el.innerHTML = ''; };
    $('#i-go').onclick = () => {
      const conf = $('input[name="i-conf"]:checked'), progEl = $('#i-prog');
      const r = D.apply(p, { conflict: conf ? conf.value : 'keep', progress: progEl ? progEl.checked : true });
      lastImport = r;
      el.innerHTML = '';
      $('#i-text').value = '';
      renderIO();
      EN.toast('Імпортовано ✓');
    };
  }
  function showUndo() {
    const r = lastImport;
    $('#i-preview').innerHTML = '<div class="good"><b>Імпорт завершено.</b> Додано слів: ' + r.added + ', оновлено перекладів: ' + r.updated + ', доповнено полів: ' + r.filled +
      (r.skipped ? ', не вмістилося: ' + r.skipped : '') + '.<div class="row" style="margin-top:8px"><a class="btn primary small" href="#/dict">📒 До словника</a><button class="btn small" id="i-undo">↩ Скасувати імпорт</button></div></div>';
    $('#i-undo').onclick = () => { D.undo(r.snapshot); lastImport = null; EN.toast('Імпорт скасовано'); renderIO(); };
  }

  function renderPractice() {
    const n = EN.S.dict.length;
    view().innerHTML = EN.views.voiceBanner() + '<div class="card"><div class="row small muted"><a href="#/dict">← Мій словник</a></div><h1>🎯 Тренування словника</h1>' +
      '<p class="muted">10 завдань зі слів словника: диктант (почути й написати), переклад українською → англійською, вибір перекладу. Спершу — слова, які пора повторити, і нові.</p></div><div id="dp-body"></div>';
    if (!n) { $('#dp-body').innerHTML = '<div class="card center"><p>Словник порожній.</p><a class="btn primary" href="#/dict">＋ Додати слова</a></div>'; return; }
    EN.runExercises($('#dp-body'), D.practiceSpecs(10), { drill: true });
  }

  EN.renderDict = renderDict;
})(window.EN);

</script>
<script>
/* Екрани «Слова», «Тренажер чисел», «Розмова», «Довідник», «Налаштування»; маршрутизація та запуск */
(function (EN) {
  'use strict';
  const esc = EN.esc, $ = (s, r) => (r || document).querySelector(s), $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const view = () => document.getElementById('view');

  // only: 'my' — повторювати лише слова мого словника (#/words/review/my)
  function renderWords(sub, only) {
    sub = sub || 'review';
    only = only === 'my' ? 'my' : '';
    const c = EN.srsCounts(only);
    view().innerHTML = EN.views.voiceBanner() + '<div class="card"><h1>🃏 Слова' + (only ? ': мій словник' : '') + '</h1><div class="row small"><span class="pill">' + c.due + ' на повторення</span><span class="pill green">' + c.known + ' у пам\'яті</span><span class="pill gray">' + c.unseen + ' нових чекають</span></div>' +
      '<div class="subtabs"><button data-s="review" class="' + (sub === 'review' && !only ? 'active' : '') + '">Повторення</button><button data-s="review/my" class="' + (sub === 'review' && only ? 'active' : '') + '">Лише мій словник</button><button data-s="list" class="' + (sub === 'list' ? 'active' : '') + '">Усі слова</button><button data-go="dict">📒 Мій словник →</button></div></div><div id="w-body"></div>';
    $$('[data-s]').forEach((b) => b.onclick = () => { location.hash = '#/words/' + b.dataset.s; });
    $('[data-go]').onclick = () => { location.hash = '#/dict'; };
    const body = $('#w-body');
    if (sub === 'list') wordList(body);
    else review(body, only);
  }
  function review(body, only) {
    const q = EN.srsQueue(only);
    const queue = q.due.concat(q.fresh);
    if (!queue.length) {
      const any = EN.srsCounts(only).all;
      body.innerHTML = '<div class="card center"><h2>🎉 На сьогодні все!</h2><p class="muted">' + (any ? 'Повертайтеся завтра. Нові слова з\'являються, коли ви відкриваєте нові уроки або додаєте слова в словник.'
        : only ? 'У словнику ще немає слів.' : 'Відкрийте перший урок або додайте слова в «📒 Мій словник».') + '</p>' +
        (only ? '<a class="btn primary" href="#/dict">📒 До словника</a>' : '<a class="btn primary" href="#/lesson/' + EN.currentLesson().id + '">До уроку</a>') + '</div>';
      return;
    }
    let i = 0;
    const again = [];
    const show = () => {
      const w = queue[i] || again.shift();
      if (!w) return review(body, only);
      const dirSet = EN.S.settings.dir;
      const toEn = dirSet === 'uk' ? true : dirSet === 'en' ? false : Math.random() < 0.5;
      const isNew = !EN.S.cards[w.id];
      const said = EN.sayText(w.en);
      body.innerHTML = '<div class="card ex-box"><div class="row small muted"><span>' + (isNew ? '<span class="pill amber">нове</span>' : '') + (w.lesson === 'my' ? ' <span class="pill">📒</span>' : '') + ' ' + (toEn ? 'Як це англійською?' : 'Що це означає?') + '</span><span class="spacer"></span>залишилось: ' + (queue.length - i + again.length) + '</div>' +
        '<div class="flash"><div class="front">' + (toEn ? esc(w.uk) : esc(w.en)) + '</div>' + (!toEn && w.ipa ? '<div class="ipa">' + esc(w.ipa) + '</div>' : '') +
        '<div class="back" style="display:none"><div class="big-phrase">' + esc(w.en) + '</div>' + (toEn && w.ipa ? '<div class="ipa">' + esc(w.ipa) + '</div>' : '') + (toEn ? '' : '<div>' + esc(w.uk) + '</div>') +
        (w.note ? '<div class="small muted">' + esc(w.note) + '</div>' : '') + (w.ex ? '<div class="small">' + EN.sayHtml(w.ex) + '</div>' : '') + '</div></div>' +
        '<div class="row" style="justify-content:center"><button class="btn" id="fl-say">🔊</button><button class="btn primary" id="fl-show">Показати відповідь<span class="kbd"> (пробіл)</span></button></div>' +
        '<div class="srs-btns" style="display:none">' + [[1, 'Знову'], [2, 'Важко'], [3, 'Добре'], [4, 'Легко']].map((g) => '<button class="btn" data-g="' + g[0] + '">' + g[1] + '<small>' + EN.nextIntervalLabel(w, g[0]) + '<span class="kbd"> · ' + g[0] + '</span></small></button>').join('') + '</div></div>';
      const reveal = () => { $('.back', body).style.display = ''; $('#fl-show').style.display = 'none'; $('.srs-btns', body).style.display = ''; EN.TTS.say(said); };
      $('#fl-say').onclick = () => EN.TTS.say(said);
      if (!toEn) EN.TTS.say(said);
      $('#fl-show').onclick = reveal;
      $$('[data-g]', body).forEach((b) => b.onclick = () => grade(+b.dataset.g));
      const grade = (g) => { EN.srsGrade(w, g); if (g === 1) again.push(w); if (queue[i] === w) i++; show(); };
      body._key = (e) => {
        if (e.code === 'Space' && $('#fl-show') && $('#fl-show').style.display !== 'none') { e.preventDefault(); reveal(); }
        else if (/^[1-4]$/.test(e.key) && $('.srs-btns', body).style.display !== 'none') grade(+e.key);
      };
    };
    document.onkeydown = (e) => { if (body._key && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) body._key(e); };
    show();
  }
  function wordList(body) {
    const words = EN.allWords();
    body.innerHTML = '<div class="card"><input type="text" id="w-q" placeholder="Пошук англійською чи українською…"><div class="tblwrap" style="margin-top:10px"><table id="w-t"><tr><th>Англійською</th><th>Українською</th><th>Наступне повторення</th></tr>' +
      words.map((w) => { const c = EN.S.cards[w.id]; const d = c ? c.due - EN.today() : null;
        return '<tr><td>' + EN.sayHtml(w.en, EN.sayText(w.en)) + (w.lesson === 'my' ? ' <span class="small">📒</span>' : '') + '</td><td>' + esc(w.uk) + '</td><td class="small muted">' + (c ? (d <= 0 ? 'сьогодні' : 'через ' + d + ' дн.') : 'нове') + '</td></tr>'; }).join('') +
      '</table></div>' + (words.length ? '' : '<p class="muted">Поки порожньо — відкрийте урок або додайте слова в словник.</p>') + '</div>';
    $('#w-q').oninput = (e) => { const v = e.target.value.toLowerCase(); $$('#w-t tr').slice(1).forEach((tr) => { tr.style.display = tr.textContent.toLowerCase().includes(v) ? '' : 'none'; }); };
  }

  const DRILLS = [
    ['n20', '🎧 Числа 0–20', { g: 'numListen', min: 0, max: 20 }],
    ['teen', '🎧 -teen чи -ty (13 / 30)', { g: 'teenListen' }],
    ['n100', '🎧 Числа 20–100', { g: 'numListen', min: 20, max: 100 }],
    ['n999', '🎧 Числа 100–999', { g: 'numListen', min: 100, max: 999 }],
    ['big', '🎧 Тисячі й мільйони', { g: 'numListen', min: 1000, max: 2000000 }],
    ['price', '🎧 Ціни (£, $, €)', { g: 'priceListen', min: 1, max: 99 }],
    ['time', '🎧 Час', { g: 'timeListen' }],
    ['date', '🎧 Дати', { g: 'dateListen' }],
    ['year', '🎧 Роки', { g: 'yearListen' }],
    ['phone', '🎧 Номери телефонів', { g: 'phoneListen' }],
    ['spell', '🎧 Слова по буквах (spelling)', { g: 'spellListen' }],
    ['nw', '✍️ Число → словами', { g: 'numWords', min: 0, max: 999 }],
    ['tw', '✍️ Час → словами', { g: 'timeWords' }],
    ['dw', '✍️ Дата → словами', { g: 'dateWords' }],
    ['mix', '🎲 Мікс усього', null]
  ];
  function renderDrill(mode) {
    view().innerHTML = EN.views.voiceBanner() + '<div class="card"><div class="row small muted"><a href="#/lessons">← Уроки</a></div><h1>🔢 Тренажер чисел, цін, часу, дат і spelling</h1>' +
      '<p class="muted">Вправи щоразу нові, по 10 за підхід. На слух — записуєте цифрами (чи слово, яке продиктували по буквах); «словами» — пишете англійською (дефіси й «and» не важливі). Почніть із «Числа 0–20», «-teen чи -ty» і «Ціни».</p>' +
      '<div class="row">' + DRILLS.map((d) => '<a class="btn small' + (d[0] === mode ? ' primary' : '') + '" href="#/drill/' + d[0] + '">' + d[1] + '</a>').join('') + '</div></div><div id="dr-body"></div>';
    const d = DRILLS.find((x) => x[0] === mode);
    if (!d) { $('#dr-body').innerHTML = '<div class="card center muted">Виберіть режим угорі.</div>'; return; }
    const pool = DRILLS.filter((x) => x[2]).map((x) => x[2]);
    const specs = Array.from({ length: 10 }, () => Object.assign({ t: 'g' }, d[2] || pool[Math.floor(Math.random() * pool.length)]));
    EN.runExercises($('#dr-body'), specs, { drill: true });
  }

  function renderSpeak() {
    const opened = EN.lessons.filter((l) => EN.S.lessons[l.id] && EN.S.lessons[l.id].opened);
    const pool = (opened.length ? opened : EN.lessons.slice(0, 1));
    const phrases = pool.flatMap((l) => l.say.map((p) => ({ en: p[0], uk: p[1], l: l.num })));
    const prompts = pool.flatMap((l) => l.speak.map((s) => ({ s, l: l.num })));
    if (!phrases.length || !prompts.length) { view().innerHTML = '<div class="card"><h1>🎙️ Розмова</h1><p class="muted">Відкрийте перший урок — тут з\'являться фрази для практики.</p></div>'; return; }
    view().innerHTML = EN.views.voiceBanner() + '<div class="card"><h1>🎙️ Розмова</h1><p class="muted">Розмова — ваш пріоритет №1. Тут фрази з уроків, які ви вже відкрили. Слухайте, повторюйте, записуйте себе й порівнюйте з диктором.</p></div>' +
      '<div class="card"><h3>🔁 Shadowing</h3><div class="center"><div class="big-phrase" id="sh-en"></div><div class="muted" id="sh-uk"></div><div class="small muted" id="sh-l"></div></div>' +
      '<div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="sh-play">🔊 Слухати</button><button class="btn" id="sh-slow">🐢 Повільно</button><span id="sh-rec"></span><button class="btn primary" id="sh-next">Наступна →</button></div>' +
      '<p class="small muted center">Схема: послухайте 2 рази → скажіть разом із диктором → скажіть самі → запишіть → порівняйте. Слідкуйте за наголосом та інтонацією, а не лише за звуками.</p></div>' +
      '<div class="card"><h3>🗣️ Говоріть 1 хвилину</h3><p id="pr-text" style="font-size:1.1rem"></p><div class="row"><span class="timer" id="pr-t">1:00</span><button class="btn primary" id="pr-go">▶ Старт</button><button class="btn" id="pr-next">Інше завдання</button><span id="pr-rec"></span></div>' +
      '<p class="small muted">Не зупиняйтеся, навіть якщо помиляєтеся. Забули слово — опишіть його іншими словами: «It\'s a thing that…».</p></div>' +

  function route(keepScroll) {
    const y = window.scrollY;
    document.onkeydown = null;
    if (EN.Rec.active()) EN.Rec.stop();
    const parts = (location.hash || '#/today').replace(/^#\//, '').split('/');
    const page = parts[0] || 'today';
    const owner = { lesson: 'lessons', drill: 'lessons' }[page] || page;
    $$('nav.tabs a').forEach((a) => a.classList.toggle('active', a.dataset.page === owner));
    const V = EN.views;
    try {
      if (page === 'program') V.renderProgram();
      else if (page === 'lessons') V.renderLessons();
      else if (page === 'lesson') V.renderLesson(parts[1], parts[2]);
      else if (page === 'words') renderWords(parts[1], parts[2]);
      else if (page === 'dict') EN.renderDict(parts[1]);
      else if (page === 'speak') renderSpeak();
      else if (page === 'drill') renderDrill(parts[1]);
      else if (page === 'ref') renderRef();
      else if (page === 'settings') renderSettings();
      else V.renderToday();
    } catch (e) {
      console.error(e);
      view().innerHTML = '<div class="card"><h2>Щось пішло не так</h2><pre class="small">' + esc(e && e.stack || e) + '</pre></div>';
    }
    window.scrollTo(0, keepScroll ? y : 0);
  }
  const currentPage = () => (location.hash || '').replace(/^#\//, '').split('/')[0];

  const typing = () => { const a = document.activeElement; return !!(a && /^(INPUT|TEXTAREA)$/.test(a.tagName) && a.value); };

  // Нова версія вже керує сторінкою (sw.js робить skipWaiting), але відкритий екран ще зі старим кодом
  function showUpdateBar() {
    if (document.querySelector('.update-bar')) return;
    const bar = document.createElement('div');
    bar.className = 'update-bar';
    bar.innerHTML = '🔄 Вийшла нова версія тренажера <button class="btn small primary">Оновити</button>';
    bar.querySelector('button').onclick = () => location.reload();
    document.body.appendChild(bar);
  }
  // У src/ (розробка) EN.BUILD немає: там service worker закешував би окремі файли й ховав би свіжі правки
  function registerWorker() {
    if (!EN.BUILD || !('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
    navigator.serviceWorker.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'activated' && e.data.version !== EN.BUILD) showUpdateBar();
    });
    navigator.serviceWorker.register('sw.js').then((reg) => {
      // Встановлений додаток на телефоні може жити днями без перезавантаження — перевіряємо оновлення при кожному поверненні
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
    }).catch((e) => console.warn('Service worker не зареєстровано', e));
  }

    const nav = document.getElementById('nav'), header = document.querySelector('header.top');
    nav.innerHTML = EN.views.NAV.map((n) => '<a href="#/' + n[0] + '" data-page="' + n[0] + '" title="' + n[2] + '"' + (n[4] ? ' class="wide-only"' : '') + '><span>' + n[1] + '</span> <span class="lbl">' + n[2] + '</span><span class="lbl-s">' + n[3] + '</span></a>').join('');
    // Ширина підписів залежить від шрифту й емодзі системи, тож місце не вгадується брейкпоінтом, а вимірюється
    const fitNav = () => {
      header.classList.remove('nav-compact', 'nav-tight');
      if (matchMedia('(max-width:700px)').matches) return;
      for (const c of ['nav-compact', 'nav-tight']) { if (nav.scrollWidth <= nav.clientWidth + 1) break; header.classList.add(c); }
    };
    fitNav();
    let fitting = 0;
    window.addEventListener('resize', () => { cancelAnimationFrame(fitting); fitting = requestAnimationFrame(fitNav); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitNav);
    document.addEventListener('click', (e) => {
      const el = e.target.closest('.say');
      if (el) EN.TTS.say(el.dataset.say);
    });
    // Список голосів і інтернет з'являються/зникають після рендеру. Повний перерендер — лише в налаштуваннях:
    // на інших екранах він збив би таймер або вправу, тож там лише додаємо чи прибираємо банер
    let lastState = null;
    EN.TTS.listeners.push(() => {
      const state = EN.TTS.voices.length + ':' + (EN.TTS.settled ? 1 : 0) + ':' + navigator.onLine;
      if (lastState === null) { lastState = state; return; }
      if (state === lastState) return;
      lastState = state;
      if (currentPage() === 'settings') { route(true); return; }
      const b = document.querySelector('.voice-banner'), show = EN.TTS.silent();
      if (show && !b) view().insertAdjacentHTML('afterbegin', EN.views.voiceBanner());
      else if (!show && b) b.remove();
    });
    EN.TTS.init();
    // Відповідь браузера про сховище й можливість встановлення приходять уже після першого рендеру
    const envChanged = () => { if (currentPage() === 'settings') route(true); else EN.fillInstallTip(); };
    EN.Storage.listeners.push(envChanged);
    EN.Install.listeners.push(envChanged);
    // Прогрес змінився в іншій вкладці. Прихована вкладка перемальовується, лише коли до неї повернуться:
    // інакше вона, наприклад, почала б озвучувати картку слова у фоні
    let stale = false;
    EN.onExternalChange = () => { if (document.hidden || typing()) stale = true; else route(true); };
    document.addEventListener('visibilitychange', () => { if (!document.hidden && stale) { stale = false; route(true); } });
    window.addEventListener('hashchange', () => route());
    if (!EN.S.start) { EN.S.start = EN.today(); EN.save(); }
    route();
    EN.Storage.check(true);
    registerWorker();
  }
  document.addEventListener('DOMContentLoaded', init);
})(window.EN);

</script>
</body>
</html>
