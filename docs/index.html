  theory: `
<h3>can — можу, вмію, можна</h3>
<p>[[can]] — модальне дієслово. Після нього йде дієслово <b>без to</b>, а форма однакова для всіх осіб — без -s:</p>
<div class="tblwrap"><table><tr><th>ствердження</th><th>заперечення</th><th>питання й коротка відповідь</th></tr>
<tr><td>[[I can swim.]]</td><td>[[I can't swim.]]</td><td>[[Can you swim?]] — [[Yes, I can.]] / [[No, I can't.]]</td></tr>
<tr><td>[[She can drive.]]</td><td>[[She can't drive.]]</td><td>[[Can she drive?]] — [[Yes, she can.]] / [[No, she can't.]]</td></tr>
<tr><td>[[They can come.]]</td><td>[[They can't come.]]</td><td>[[Can they come?]] — [[Yes, they can.]] / [[No, they can't.]]</td></tr></table></div>
<p>Повна форма заперечення — [[cannot]] (пишеться разом), у мовленні майже завжди [[can't]].</p>
<div class="note"><b>⚠️ Три типові помилки:</b>
<ul><li>to після can не ставлять: не «I can to swim», а [[I can swim.]]</li>
<li>-s не додають: не «She cans» і не «She can swims», а [[She can swim.]]</li>
<li>do не потрібне: не «Do you can…?», а [[Can you help me?]]</li></ul></div>
<h3>Три значення can</h3>
<div class="tblwrap"><table><tr><th>значення</th><th>приклади</th></tr>
<tr><td>уміння</td><td>[[I can speak three languages.]] — Я розмовляю трьома мовами. [[He can't cook.]] — Він не вміє готувати.</td></tr>
<tr><td>дозвіл</td><td>[[Can I sit here?]] — Можна тут сісти? [[You can't park here.]] — Тут не можна паркуватися.</td></tr>
<tr><td>прохання</td><td>[[Can you help me?]] — Допоможеш? [[Can you open the window, please?]] — Відчини, будь ласка, вікно.</td></tr></table></div>
<div class="good">В українській теж одне слово на всі три значення: «могти» / «можна». [[Can I…?]] — «Можна мені…?»</div>
<h3>Could you…? — ввічливіше</h3>
<p>[[Can you help me?]] — звичайне прохання до друга чи колеги. [[Could you help me, please?]] — ввічливіше: до незнайомих людей, клієнтів, керівника. [[Could you repeat that, please?]] — Чи не могли б ви повторити?</p>
<p>Відповідаємо: [[Sure.]] [[Of course.]] [[No problem.]] — або [[Sorry, I can't.]]</p>
<div class="tip"><b>Як вимовляти can і can't.</b> У ствердженні can ненаголошене й коротке: [kən], голосний майже зникає — [[I can swim.]] Заперечення [[can't]] наголошене, з довгим чи широким голосним: британською [kɑːnt] (≈ «ка:нт»), американською [kænt] (широке [æ]). Американці часто ковтають кінцеве t, тому розрізняйте на слух за голосним і наголосом: [[I can come.]] — [[I can't come.]]</div>
<h3>like, love, enjoy, hate, don't mind + -ing</h3>
<p>Після дієслів уподобання друге дієслово зазвичай має закінчення <b>-ing</b>:</p>
<div class="tblwrap"><table><tr><th></th><th>приклад</th><th>значення</th></tr>
<tr><td>❤️❤️</td><td>[[I love travelling.]]</td><td>Обожнюю подорожувати.</td></tr>
<tr><td>❤️</td><td>[[I like cooking.]] / [[I enjoy reading.]]</td><td>Люблю готувати. / Із задоволенням читаю.</td></tr>
<tr><td>😐</td><td>[[I don't mind waiting.]]</td><td>Я не проти почекати.</td></tr>
<tr><td>👎</td><td>[[I don't like driving.]]</td><td>Не люблю водити машину.</td></tr>
<tr><td>👎👎</td><td>[[I hate getting up early.]]</td><td>Терпіти не можу рано вставати.</td></tr></table></div>
<p>Правопис -ing: [[dance]] → [[dancing]] (німе -e відпадає), [[swim]] → [[swimming]] (приголосний подвоюється), [[travel]] → [[travelling]] (UK) / [[traveling]] (US). Детальніше — в уроці A1.10.</p>
<div class="note"><b>⚠️ Після enjoy і don't mind — лише -ing:</b> [[I enjoy swimming.]], а не «I enjoy to swim». Після like, love, hate можна й to + дієслово: [[I like to cook.]] (так часто кажуть американці), але -ing підходить завжди.</div>
<p>Питаємо: [[Do you like dancing?]] — [[Yes, I do.]] / [[No, I don't.]] [[What do you like doing in your free time?]] — Що ти любиш робити у вільний час?</p>
<h3>I like ≠ I'd like</h3>
<div class="tblwrap"><table><tr><th>like — люблю (загалом)</th><th>would like — хотів би (зараз)</th></tr>
<tr><td>[[I like coffee.]] — Я люблю каву.</td><td>[[I'd like a coffee.]] — Я б випив кави.</td></tr>
<tr><td>[[Do you like tea?]] — Ти любиш чай?</td><td>[[Would you like some tea?]] — Хочеш чаю?</td></tr>
<tr><td>[[I like dancing.]] — Люблю танцювати.</td><td>[[I'd like to dance.]] — Я б хотів потанцювати.</td></tr></table></div>
<p>[[I'd like]] = [[I want]], але ввічливо. Після would like — <b>to + дієслово</b>: [[I'd like to book a table.]]</p>
<div class="note"><b>⚠️ Як відповідати на пропозицію.</b> На [[Would you like a coffee?]] кажуть [[Yes, please.]] або [[No, thanks.]], а не «Yes, I like».</div>
<h3>Хобі: play, go + -ing та інші</h3>
<p>[[play]] + спорт чи гра — <b>без артикля</b>: [[play football]], [[play tennis]], [[play chess]], [[play computer games]].<br>
[[play]] + музичний інструмент — <b>з the</b>: [[play the guitar]], [[play the piano]], [[play the violin]]. (В американській розмовній мові the інколи пропускають.)<br>
[[go]] + -ing — про активності: [[go swimming]], [[go running]], [[go dancing]], [[go shopping]].<br>
Інше: [[cook]] — готувати, [[draw]] — малювати, [[read]] — читати, [[dance]] — танцювати, [[drive]] — водити машину, [[travel]] — подорожувати, [[take photos]] — фотографувати.</p>
<div class="note"><b>⚠️ «Грати на гітарі» — без «на»:</b> [[play the guitar]], а не «play on the guitar». А «футбол» — UK [[football]], US [[soccer]], бо в Америці [[football]] — американський футбол.</div>`,

{
  id: 'a1-10', stage: 'a1', num: 'A1.10', title: 'Present Continuous: що відбувається зараз; одяг і погода', dur: '1 тиждень',
  goals: ['будувати Present Continuous: am / is / are + -ing', 'розрізняти Present Simple (звичка) і Present Continuous (зараз)', 'описувати свій одяг і погоду'],
  theory: `
<h3>Present Continuous — дія зараз</h3>
<p>Формула: <b>am / is / are + дієслово з -ing</b>. Час показує дію, що відбувається саме зараз, у момент мовлення: [[I'm working.]] — Я (зараз) працюю. [[It's raining.]] — Іде дощ.</p>
<div class="tblwrap"><table><tr><th>ствердження</th><th>заперечення</th><th>питання й коротка відповідь</th></tr>
<tr><td>[[I'm reading.]]</td><td>[[I'm not reading.]]</td><td>[[Am I talking too fast?]] — [[Yes, you are.]]</td></tr>
<tr><td>[[She's cooking.]]</td><td>[[She isn't cooking.]]</td><td>[[Is she cooking?]] — [[Yes, she is.]] / [[No, she isn't.]]</td></tr>
<tr><td>[[They're waiting.]]</td><td>[[They aren't waiting.]]</td><td>[[Are they waiting?]] — [[Yes, they are.]] / [[No, they aren't.]]</td></tr></table></div>
<p>З питальним словом: [[What are you doing?]] — Що ти робиш? [[Where are you going?]] — Куди ти йдеш? [[Why is he laughing?]] — Чому він сміється?</p>
<div class="note"><b>⚠️ В українській один теперішній час.</b> «Я працюю» — і «працюю взагалі», і «працюю зараз». В англійській це два різні часи: [[I work in an office.]] (загалом) — [[I'm working from home today.]] (сьогодні, зараз). І не губіть to be: не «I working», а [[I'm working.]]</div>
<h3>Правопис -ing</h3>
<div class="tblwrap"><table><tr><th>правило</th><th>приклади</th></tr>
<tr><td>більшість дієслів: + ing</td><td>[[read]] → [[reading]], [[wear]] → [[wearing]], [[play]] → [[playing]], [[see]] → [[seeing]]</td></tr>
<tr><td>німе -e відпадає</td><td>[[make]] → [[making]], [[write]] → [[writing]], [[come]] → [[coming]]</td></tr>
<tr><td>короткий наголошений склад «приголосний + голосний + приголосний»: останній приголосний подвоюється</td><td>[[swim]] → [[swimming]], [[sit]] → [[sitting]], [[run]] → [[running]], [[stop]] → [[stopping]]</td></tr>
<tr><td>-ie → -ying</td><td>[[lie]] → [[lying]], [[tie]] → [[tying]]</td></tr>
<tr><td>-l після короткого голосного</td><td>[[travel]] → [[travelling]] (UK) / [[traveling]] (US)</td></tr></table></div>
<p>w, x і y не подвоюються: [[snow]] → [[snowing]], [[fix]] → [[fixing]], [[stay]] → [[staying]].</p>
<h3>Коли: now, at the moment, today…</h3>
<p>[[now]] — зараз, [[right now]] — просто зараз, [[at the moment]] — у цей момент, [[today]] — сьогодні, [[this week]] — цього тижня. А ще [[Look!]] і [[Listen!]]: [[Look! It's snowing!]] [[Listen! Someone is singing.]]</p>
<p>Present Continuous описує й тимчасові ситуації — не обов'язково саме в цю секунду: [[I'm learning English this year.]] [[She's staying with friends this week.]]</p>
<h3>Present Simple чи Present Continuous?</h3>
<div class="tblwrap"><table><tr><th>Present Simple — звичка, факт</th><th>Present Continuous — зараз, тимчасово</th></tr>
<tr><td>[[I usually wear jeans.]]</td><td>[[Today I'm wearing a suit.]]</td></tr>
<tr><td>[[It often rains in London.]]</td><td>[[It's raining now.]]</td></tr>
<tr><td>[[He works in Kyiv.]]</td><td>[[He's working in Bratislava this month.]]</td></tr>
<tr><td>[[What do you do?]] — Ким ти працюєш?</td><td>[[What are you doing?]] — Що ти (зараз) робиш?</td></tr></table></div>
<div class="note"><b>⚠️ What do you do?</b> — це не «що ти робиш», а «ким ти працюєш». Про те, що людина робить зараз, питають [[What are you doing?]]</div>
<h3>Дієслова стану — без -ing</h3>
<p>Деякі дієслова описують не дію, а стан: знання, бажання, почуття. Їх зазвичай не вживають у Continuous навіть тоді, коли йдеться про «зараз»: [[know]], [[understand]], [[like]], [[want]], [[need]], [[remember]], [[believe]], [[mean]].</p>
<p>[[I understand you.]] — не «I'm understanding». [[I need help now.]] — не «I'm needing». [[Do you know him?]] [[What does this word mean?]]</p>
<div class="tip"><b>have — і стан, і дія.</b> «Мати» — стан, без -ing: [[I have a car.]] А в значенні «їсти, пити, проводити час» це дія, і Continuous можливий: [[I'm having lunch.]] — Я обідаю. [[We're having a great time.]] — Ми чудово проводимо час.</div>
<h3>Одяг</h3>
<p>«Бути вдягненим у…» — [[wear]]: [[She's wearing a red dress.]] — На ній червона сукня. [[What are you wearing today?]] — Що на тобі сьогодні?</p>
<div class="tblwrap"><table><tr><th>англійською</th><th>українською</th><th>англійською</th><th>українською</th></tr>
<tr><td>[[a shirt]]</td><td>сорочка</td><td>[[a T-shirt]]</td><td>футболка</td></tr>

<tr><td>[[a coat]]</td><td>пальто</td><td>[[a dress]]</td><td>сукня</td></tr>
<tr><td>[[jeans]]</td><td>джинси</td><td>[[trousers]] (UK) / [[pants]] (US)</td><td>штани</td></tr>
<tr><td>[[shoes]]</td><td>туфлі, взуття</td><td>[[boots]]</td><td>черевики, чоботи</td></tr>
<tr><td>[[a hat]]</td><td>капелюх, шапка</td><td>[[a scarf]]</td><td>шарф</td></tr></table></div>
<div class="note"><b>⚠️ Завжди множина:</b> [[jeans]], [[trousers]], [[pants]], [[shorts]], [[glasses]]: [[My jeans are new.]] Одна річ — [[a pair of jeans]]. І пастка: [[pants]] в Америці — штани, а в Британії — труси!</div>
<div class="note"><b>⚠️ Одягати ≠ бути вдягненим.</b> Дія «одягнути» — [[put on]]: [[Put on your coat. It's cold.]] Стан «бути в чомусь» — [[wear]]: [[He's wearing a coat.]]</div>
<h3>Погода</h3>
<p>Про погоду говоримо з [[It]]: [[What's the weather like?]] — Яка погода?</p>

  theory: `
<h3>was і were</h3>
<p>Минулий час дієслова to be має лише дві форми:</p>
<div class="tblwrap"><table><tr><th>теперішній</th><th>минулий</th><th>приклад</th></tr>
<tr><td>I am</td><td>I <b>was</b></td><td>[[I was at home yesterday.]] — Учора я був удома.</td></tr>
<tr><td>he / she / it is</td><td>he / she / it <b>was</b></td><td>[[She was ill last week.]] — Минулого тижня вона хворіла.</td></tr>
<tr><td>you / we / they are</td><td>you / we / they <b>were</b></td><td>[[We were in London in May.]] — У травні ми були в Лондоні.</td></tr></table></div>
<div class="good">Українське «був / була / було» змінюється за родом, а англійське — ні: [[he was]], [[she was]], [[it was]].</div>
<h3>Заперечення й питання</h3>
<p>Усе як у теперішньому часі: not — після was / were, а в питанні was / were стає на перше місце.</p>
<div class="tblwrap"><table><tr><th>заперечення</th><th>питання й коротка відповідь</th></tr>
<tr><td>[[I wasn't tired.]] (was not)</td><td>[[Was it expensive?]] — [[Yes, it was.]] / [[No, it wasn't.]]</td></tr>
<tr><td>[[They weren't at work.]] (were not)</td><td>[[Were you at the party?]] — [[Yes, I was.]] / [[No, I wasn't.]]</td></tr></table></div>
<p>З питальним словом: [[Where were you yesterday?]] — Де ти був учора? [[How was your weekend?]] — Як минули вихідні? [[What was the weather like?]] — Яка була погода? [[Who was that?]] — Хто це був?</p>
<div class="tip"><b>Вимова.</b> Усередині речення was і were ненаголошені й короткі: [wəz], [wə] (US [wər]) — [[I was at home.]] У коротких відповідях і запереченнях — повна вимова: [[Yes, I was.]] [[No, it wasn't.]]</div>
<h3>Коли? Маркери минулого</h3>
<div class="tblwrap"><table><tr><th>англійською</th><th>українською</th></tr>
<tr><td>[[yesterday]], [[yesterday morning]]</td><td>учора, учора вранці</td></tr>
<tr><td>[[last night]]</td><td>учора ввечері, минулої ночі</td></tr>
<tr><td>[[last week]], [[last month]], [[last year]]</td><td>минулого тижня, місяця, року</td></tr>
<tr><td>[[two days ago]], [[a long time ago]]</td><td>два дні тому, давно</td></tr>
<tr><td>[[in 2020]], [[on Monday]]</td><td>у 2020 році, у понеділок</td></tr>
<tr><td>[[at the weekend]] (UK) / [[on the weekend]] (US)</td><td>на вихідних</td></tr></table></div>
<div class="note"><b>⚠️ last і ago — без прийменників.</b> «Минулого тижня» — [[last week]], а не «in last week». «Три роки тому» — [[three years ago]]: ago стоїть <b>після</b> проміжку часу, а не перед ним, і «before three years» тут не годиться.</div>
<h3>I was born — я народився</h3>
<p>«Народитися» англійською — [[be born]], тому про своє народження кажемо з was: [[I was born in Ukraine.]] [[I was born in 1990.]] [[Where were you born?]] [[When were you born?]]</p>
<div class="note"><b>⚠️ Не «I born».</b> Без was речення неправильне: [[I was born in Kyiv.]]</div>
<h3>there was / there were</h3>
<p>Минуле від there is / there are: [[There was a problem with the train.]] — З потягом була проблема. [[There were a lot of people at the concert.]] — На концерті було багато людей. [[There wasn't any milk.]] — Молока не було. [[Was there a lift?]] (UK) / [[Was there an elevator?]] (US) — Там був ліфт?</p>
<div class="note"><b>⚠️ «Було багато людей» — не «It was a lot of people».</b> Коли йдеться про наявність, кажемо there was / there were: [[There were a lot of people.]]</div>
<h3>Як було? Враження й почуття</h3>
<div class="tblwrap"><table><tr><th>англійською</th><th>українською</th><th>англійською</th><th>українською</th></tr>

<tr><td>[[interesting]]</td><td>цікавий</td><td>[[boring]]</td><td>нудний</td></tr>
<tr><td>[[busy]]</td><td>зайнятий; людний</td><td>[[free]]</td><td>вільний; безкоштовний</td></tr>
<tr><td>[[crowded]]</td><td>переповнений</td><td>[[quiet]]</td><td>тихий, спокійний</td></tr>

<tr><td>[[angry]]</td><td>сердитий, злий</td><td>[[nervous]]</td><td>знервований, схвильований</td></tr>
<tr><td>[[ill]] (UK) / [[sick]] (US)</td><td>хворий</td><td>[[tired]]</td><td>утомлений</td></tr></table></div>
<p>[[The film was boring.]] [[I was nervous before the interview.]] [[The bus was really crowded.]] [[How was the trip? — It was great!]]</p>
<div class="note"><b>⚠️ boring чи bored?</b> [[boring]] — нудний (фільм, урок), [[bored]] — той, кому нудно: [[The lesson was boring, so I was bored.]] «I was boring» означає «я був нудним»! Так само [[interesting]] — цікавий, а [[interested]] — зацікавлений.</div>`,

  theory: `
<h3>Past Simple — що сталося в минулому</h3>
<p>Past Simple — завершена дія в минулому, часто з маркером часу: [[I worked yesterday.]] — Учора я працював. [[We visited Vienna last summer.]] — Минулого літа ми їздили до Відня. [[She called me two hours ago.]] — Вона дзвонила мені дві години тому.</p>
<div class="good">Одна форма для всіх осіб: [[I worked]], [[she worked]], [[they worked]]. Жодного -s, як у теперішньому часі!</div>
<h3>Правильні дієслова: + -ed</h3>
<div class="tblwrap"><table><tr><th>правило</th><th>приклади</th></tr>
<tr><td>більшість дієслів: + ed</td><td>[[work]] → [[worked]], [[play]] → [[played]], [[watch]] → [[watched]]</td></tr>
<tr><td>на -e: + d</td><td>[[like]] → [[liked]], [[live]] → [[lived]], [[arrive]] → [[arrived]]</td></tr>
<tr><td>приголосний + y → -ied</td><td>[[study]] → [[studied]], [[try]] → [[tried]] (але голосний + y: [[stay]] → [[stayed]])</td></tr>
<tr><td>короткий наголошений склад: приголосний подвоюється</td><td>[[stop]] → [[stopped]], [[plan]] → [[planned]], [[travel]] → [[travelled]] (UK) / [[traveled]] (US)</td></tr></table></div>
<div class="tip"><b>Три вимови -ed:</b>
<ul><li>[t] — після глухих звуків [p], [k], [f], [s], [ʃ], [tʃ]: [[stopped]], [[worked]], [[laughed]], [[watched]];</li>
<li>[d] — після дзвінких і голосних: [[played]], [[lived]], [[called]], [[planned]];</li>
<li>[ɪd] — лише після [t] і [d]: [[wanted]], [[visited]], [[needed]], [[decided]] — тільки тут з'являється додатковий склад.</li></ul>

  theory: `
<h3>be going to — плани й наміри</h3>

<div class="tblwrap"><table><tr><th>ствердження</th><th>заперечення</th><th>питання</th></tr>

<p>[[What are you going to do tomorrow?]] — Що ти збираєшся робити завтра?</p>
<p>Друге значення — <b>прогноз за ознаками</b>, які ми бачимо вже зараз: [[Look at those clouds. It's going to rain.]] — Глянь на ті хмари, буде дощ. [[Be careful! You're going to fall!]] — Обережно! Ти зараз упадеш!</p>

<h3>will — рішення зараз, пропозиції, обіцянки, прогнози</h3>
<p>Форма: <b>will + дієслово</b> для всіх осіб; скорочено 'll: [[I'll]], [[she'll]], [[we'll]]. Заперечення — [[won't]] (= will not): [[I won't be late.]] — Я не запізнюся.</p>

<h3>Домовленості: Present Continuous</h3>

<div class="good">Українською теж так кажемо: «Завтра я зустрічаюся з Томом» — теперішній час про майбутнє.</div>

<p>[[tomorrow]] — завтра, [[tonight]] — сьогодні ввечері, [[next week]] — наступного тижня, [[next year]] — наступного року, [[this weekend]] — на цих вихідних, [[soon]] — незабаром, [[later]] — пізніше, [[in two days]] — через два дні.</p>

<div class="tblwrap"><table><tr><th>що робимо</th><th>фрази</th></tr>

  theory: `
<h3>Контрольна точка A1</h3>
<p>Ви пройшли рівень A1! У цьому уроці — коротка шпаргалка з усієї граматики, десять найчастіших помилок і підсумкові вправи. Мета — <b>≥ 80 %</b> у вправах і 3–5 хвилин монологу про себе.</p>
<h3>1. to be: теперішній і минулий</h3>
<div class="tblwrap"><table><tr><th></th><th>теперішній</th><th>минулий</th></tr>

<h3>2. Present Simple чи Present Continuous</h3>
<div class="tblwrap"><table><tr><th></th><th>Present Simple — звичка, факт</th><th>Present Continuous — зараз, тимчасово</th></tr>

<tr><td>маркери</td><td>[[always]], [[usually]], [[often]], [[every day]]</td><td>[[now]], [[at the moment]], [[today]], [[this week]]</td></tr></table></div>
<p>Дієслова стану (know, like, want, need, understand) — лише в Present Simple: [[I know.]] [[I need help.]]</p>
<h3>3. Past Simple</h3>
<div class="tblwrap"><table><tr><th></th><th>приклади</th><th>правило</th></tr>

<script>
/* A2, частина 1: уроки A2.1–A2.7. Формат: c — o[0] правильний; i/l — a: рядок або масив; o — a: речення або масив */

{
  id: 'a2-1', stage: 'a2', num: 'A2.1', title: 'Past Continuous: що відбувалося в той момент', dur: '2 тижні',
  goals: ['описати дію, що тривала в певний момент минулого: was / were + -ing', 'розповісти, що відбувалося, коли щось сталося (when, while)', 'вибирати між Past Simple і Past Continuous в історії', 'описати фон історії й розповісти про невеликий випадок'],
  theory: `
<h3>Форма: was / were + дієслово з -ing</h3>
<p>Past Continuous (минулий тривалий час) показує дію <b>в процесі</b> в певний момент минулого. Не «що зробив», а «що саме робив тоді»: [[At eight o'clock I was having breakfast.]] — О восьмій я снідав. [[This time last year we were living in Kyiv.]] — Рік тому в цей час ми жили в Києві.</p>
<div class="tblwrap"><table><tr><th></th><th>ствердження</th><th>заперечення</th><th>питання</th></tr>
<tr><td>I / he / she / it</td><td>[[I was working.]]</td><td>[[She wasn't working.]]</td><td>[[Was he working?]]</td></tr>
<tr><td>you / we / they</td><td>[[You were sleeping.]]</td><td>[[We weren't sleeping.]]</td><td>[[Were they sleeping?]]</td></tr></table></div>
<p>Короткі відповіді: [[Yes, I was.]] / [[No, I wasn't.]] — [[Yes, they were.]] / [[No, they weren't.]]<br>
З питальним словом: [[What were you doing at nine?]] — Що ти робив о дев'ятій? [[Where was she going?]] — Куди вона йшла? [[Why were they laughing?]] — Чому вони сміялися?</p>
<div class="tip"><b>Вимова:</b> без наголосу [[was]] і [[were]] звучать коротко, з нейтральним звуком: /wəz/, /wə/ — [[I was working]] /aɪ wəz ˈwɜːkɪŋ/. Повністю (/wɒz/, /wɜː/) — у коротких відповідях: [[Yes, I was.]] Правопис -ing — як у Present Continuous: [[make]] → [[making]], [[stop]] → [[stopping]], [[lie]] → [[lying]].</div>
<h3>1. Процес у конкретний момент</h3>
<p>Момент називаємо годиною чи іншою подією: [[What were you doing yesterday at six?]] — [[I was driving home.]] — Що ти робив учора о шостій? — Їхав додому. [[At midnight I was still working.]] — Опівночі я ще працював.</p>
<h3>2. Довга дія, яку перервала коротка подія</h3>
<p>Тривала дія (фон) — Past Continuous, коротка подія, що її перервала, — Past Simple. Перед короткою подією зазвичай стоїть [[when]]:</p>
<p>[[I was cooking when the phone rang.]] — Я готувала, коли задзвонив телефон.<br>
[[She was crossing the street when she slipped.]] — Вона переходила вулицю, коли посковзнулася.<br>
[[When I arrived, they were having dinner.]] — Коли я прийшов, вони вечеряли.<br>
[[We were watching a film when the lights went out.]] — Ми дивилися фільм, коли згасло світло.</p>
<h3>3. while — «поки, у той час як»</h3>
<p>Після [[while]] зазвичай стоїть тривала дія в Past Continuous: [[While I was waiting for the bus, it started to rain.]] — Поки я чекав автобус, почався дощ. [[Someone stole my bag while I was sleeping.]] — Хтось украв мою сумку, поки я спав.</p>
<p>Дві тривалі дії одночасно — обидві в Past Continuous: [[While I was working, my husband was cooking.]] — Поки я працювала, чоловік готував.</p>
<div class="tip"><b>when чи while?</b> [[when]] + коротка подія: [[when the phone rang]]. [[while]] + процес: [[while I was cooking]]. Частини можна міняти місцями; якщо речення починається з when / while, після першої частини ставимо кому: [[While I was cooking, the phone rang.]] = [[The phone rang while I was cooking.]]</div>
<h3>4. Фон в історії</h3>
<p>Розповідь часто починається з «декорацій» у Past Continuous — погода, хто що робив, — а події йдуть у Past Simple: [[It was a cold evening. It was raining and people were hurrying home. Suddenly I heard a loud noise.]] — Був холодний вечір. Ішов дощ, люди поспішали додому. Раптом я почув гучний шум.</p>
<h3>Past Simple чи Past Continuous?</h3>
<div class="tblwrap"><table><tr><th>Past Simple — що сталося (подія, факт)</th><th>Past Continuous — що відбувалося (процес)</th></tr>
<tr><td>[[I read a book yesterday.|I red a book yesterday.]] — Я вчора читав (прочитав) книжку.</td><td>[[I was reading at ten.]] — О десятій я якраз читав.</td></tr>
<tr><td>Послідовні дії: [[I got up, had a shower and left.]]</td><td>Одночасні процеси: [[I was reading and she was watching TV.]]</td></tr>
<tr><td>[[When she called, I left.]] — Вона подзвонила, і тоді я пішов.</td><td>[[When she called, I was leaving.]] — Коли вона подзвонила, я якраз виходив.</td></tr></table></div>
<div class="note"><b>⚠️ Український вид дієслова тут не підказка.</b> «Я читав» — це і [[I read|I red]], і [[I was reading]]. Питайте себе не «доконаний чи недоконаний вид», а «чи був це <b>процес у конкретний момент</b> або фон для іншої події». Якщо такого моменту немає, досить Past Simple: [[Last year I worked in Prague.]] — Торік я працював у Празі.</div>
<div class="note"><b>⚠️ Дієслова стану не мають -ing.</b> Дієслова, що означають стан, думку, почуття чи володіння (stative verbs), зазвичай не вживають у Continuous: [[know]], [[understand]], [[believe]], [[remember]], [[like]], [[love]], [[hate]], [[want]], [[need]], [[prefer]], [[belong]], [[seem]], [[mean]]. Тож: [[I didn't know the answer.]] (не «I wasn't knowing»), [[She wanted to go home.]] (не «She was wanting»). [[have]] у значенні «мати» — теж стан: [[I had a car.]] А [[I was having lunch.]] — «я обідав» — це дія, тож можна.</div>
<h3>Події й випадки</h3>
<p>[[What happened?]] — Що сталося? [[It happened on Monday morning.]] — Це сталося в понеділок уранці.<br>
[[I dropped my phone and the screen broke.]] — Я впустив телефон, і екран розбився.<br>
[[He slipped on the ice and hurt his leg.]] — Він посковзнувся на льоду й забив ногу.<br>
[[I spilled coffee on my laptop.]] — Я розлив каву на ноутбук.<br>
[[I deleted the file by accident.]] — Я випадково видалив файл.<br>
[[Did you notice anything strange?]] — Ти помітив щось дивне?<br>
[[Luckily, nobody was injured.]] — На щастя, ніхто не постраждав.</p>
<div class="note"><b>⚠️ fall чи drop?</b> [[fall]] — впасти самому: [[I fell.]] — Я впав. [[drop]] — впустити щось: [[I dropped my keys.]] — Я впустив ключі. Неправильні форми: [[fall – fell]], [[break – broke]], [[ring – rang]], [[steal – stole]], [[hurt – hurt]]. Не плутайте [[fell]] (впав) і [[felt]] (відчув).</div>
<div class="good">US / UK: [[spilled]] — і в американській, і в британській; британці кажуть також [[spilt]]. Аварію на дорозі називають [[accident]] або [[crash]]; «програма впала» — теж [[The app crashed.]]</div>`,
  vocab: [['happen', 'ставатися, траплятися', 'What happened? — Що сталося?'], ['accident', 'аварія; нещасний випадок'], ['by accident', 'випадково, ненавмисно'],
    ['ring', 'дзвонити (про телефон, дзвінок)', 'ring – rang – rung'], ['break', 'ламати(ся), розбивати(ся)', 'break – broke – broken'], ['fall', 'падати', 'fall – fell – fallen'],
    ['drop', 'впустити (з рук)', 'dropped'], ['slip', 'посковзнутися', 'slipped'], ['hurt', 'поранити, забити; боліти', 'hurt – hurt – hurt'],
    ['crash', 'аварія; врізатися; «впасти» (про програму)'], ['spill', 'розлити, розсипати', 'spilled; UK також spilt'], ['steal', 'красти', 'steal – stole – stolen'],
    ['notice', 'помітити'], ['suddenly', 'раптом'], ['luckily', 'на щастя'], ['while', 'поки, у той час як', 'while I was cooking'],

    ['go out', 'згаснути (про світло, вогонь)', 'The lights went out.'], ['ambulance', 'швидка допомога (машина)']],
  ex: [
    { t: 'i', q: 'Past Continuous: At seven o\'clock I ___ (cook) dinner.', a: 'was cooking' },
    { t: 'i', q: 'Past Continuous: They ___ (watch) TV when I came in.', a: 'were watching' },
    { t: 'i', q: 'Заперечення: Sorry, I ___ (not / listen). Can you repeat that?', a: 'wasn\'t listening' },
    { t: 'i', q: 'Питання: What ___ you doing at ten last night?', a: 'were' },
    { t: 'c', q: '«Я готувала, коли задзвонив телефон»', o: ['I was cooking when the phone rang.', 'I cooked when the phone was ringing.', 'I was cooking when the phone was rang.'], e: 'Довга дія — Past Continuous, коротка подія, що її перервала, — Past Simple: [[I was cooking when the phone rang.]]' },
    { t: 'c', q: '«Коли я прийшов, вони вечеряли» (вечеря вже тривала)', o: ['When I arrived, they were having dinner.', 'When I arrived, they had dinner.', 'When I was arriving, they have dinner.'], e: '[[When I arrived, they had dinner.]] означало б, що вони сіли вечеряти вже після вашого приходу.' },
    { t: 'c', q: '___ I was waiting for the bus, I met an old friend.', o: ['While', 'During', 'Until'], e: '[[while]] + процес (Past Continuous). [[during]] вживається лише з іменником: [[during the trip]].' },
    { t: 'c', q: 'Фон історії: It was a beautiful morning. The sun ___ and the birds were singing.', o: ['was shining', 'were shining', 'is shining'] },
    { t: 'c', q: 'Яке речення правильне?', o: ['I didn\'t know the answer.', 'I wasn\'t knowing the answer.', 'I wasn\'t know the answer.'], e: '[[know]] — дієслово стану, у Continuous його не вживають: [[I didn\'t know the answer.]]' },
    { t: 'c', q: '«Я впустив телефон»', o: ['I dropped my phone.', 'I fell my phone.', 'I falled my phone.'], e: '[[fall]] — впасти самому, [[drop]] — впустити щось: [[I dropped my phone.]] Минулий час від fall — [[fell]].' },

  say: [['I was cooking when the phone rang.', 'Я готувала, коли задзвонив телефон.'], ['What were you doing at nine o\'clock?', 'Що ти робив о дев\'ятій?'],
    ['While I was walking to work, I saw an accident.', 'Поки я йшов на роботу, я побачив аварію.'], ['Sorry, I wasn\'t listening. Could you repeat that?', 'Вибач, я не слухав. Можеш повторити?'],

  speak: ['Розкажіть уголос, що ви робили вчора о 7:00, 12:00, 18:00 і 22:00: At seven o\'clock I was… At twelve I was…',
    'Розкажіть історію (6–8 речень) про невеликий випадок: розбитий телефон, запізнення, несподівана зустріч на вулиці. Почніть з фону в Past Continuous (It was raining… I was walking…), далі події в Past Simple (Suddenly… When…). Запишіть себе й послухайте.'],
  mission: 'Розкажіть колезі чи другові англійською (усно або в чаті) про щось, що сталося з вами цього тижня: 5–6 речень, фон — у Past Continuous, події — у Past Simple. Почати можна так: [[Guess what happened yesterday! I was walking to work when…]]'

{
  id: 'a2-2', stage: 'a2', num: 'A2.2', title: 'Present Perfect: досвід і результат', dur: '2 тижні',
  goals: ['будувати Present Perfect: have / has + третя форма дієслова (V3)', 'розповідати про досвід: Have you ever…? I\'ve never…', 'вживати just, already, yet і ставити їх на правильне місце', 'вибирати між Present Perfect і Past Simple'],
  theory: `
<h3>Форма: have / has + третя форма дієслова (V3)</h3>
<p>Present Perfect (теперішній доконаний час) поєднує минуле з теперішнім: дія вже відбулася, а важить її <b>результат або досвід зараз</b>. Коли саме це сталося — не важливо й не називається.<br>
[[I've lost my keys.]] — Я загубив ключі (і зараз не можу потрапити додому).<br>
[[I've been to Italy.]] — Я бував в Італії (такий у мене досвід).</p>
<div class="tblwrap"><table><tr><th></th><th>ствердження</th><th>заперечення</th><th>питання</th></tr>
<tr><td>I / you / we / they</td><td>[[I have worked.]] = [[I've worked.]]</td><td>[[I haven't worked.]]</td><td>[[Have you worked?]]</td></tr>
<tr><td>he / she / it</td><td>[[She has worked.]] = [[She's worked.]]</td><td>[[She hasn't worked.]]</td><td>[[Has she worked?]]</td></tr></table></div>
<p>Короткі відповіді: [[Yes, I have.]] / [[No, I haven't.]] — [[Yes, he has.]] / [[No, he hasn't.]]</p>
<div class="tip"><b>she's = she is або she has.</b> Розрізняйте за наступним словом: [[She's tired.]] — is; [[She's finished.]] — has + V3. [[He's working.]] — is + -ing; [[He's worked here before.]] — has + V3.</div>
<h3>Третя форма (V3, past participle)</h3>
<p>У правильних дієслів V3 = V2 = -ed: [[work – worked – worked]], [[try – tried – tried]], [[stop – stopped – stopped]]. Неправильні треба вивчити. Ось 25 найчастіших; V2 ви вже знаєте з Past Simple:</p>
<div class="tblwrap"><table><tr><th>V1</th><th>V2 (Past Simple)</th><th>V3</th><th>переклад</th></tr>
<tr><td>[[be]]</td><td>[[was / were]]</td><td>[[been]]</td><td>бути</td></tr>
<tr><td>[[go]]</td><td>[[went]]</td><td>[[gone]]</td><td>іти, їхати</td></tr>
<tr><td>[[do]]</td><td>[[did]]</td><td>[[done]]</td><td>робити</td></tr>
<tr><td>[[have]]</td><td>[[had]]</td><td>[[had]]</td><td>мати</td></tr>
<tr><td>[[make]]</td><td>[[made]]</td><td>[[made]]</td><td>робити, створювати</td></tr>
<tr><td>[[see]]</td><td>[[saw]]</td><td>[[seen]]</td><td>бачити</td></tr>

<h3>Present Perfect чи Past Simple?</h3>
<p>Тепер найважливіше. Щойно в реченні з'являється <b>завершений час у минулому</b> — [[yesterday]], [[last week]], [[in 2020]], [[two days ago]], [[when I was a child]] — потрібен Past Simple. Present Perfect із такими словами — помилка.</p>

  theory: `
<h3>Вищий (comparative) і найвищий (superlative) ступінь</h3>
<div class="tblwrap"><table><tr><th>прикметник</th><th>звичайний</th><th>вищий: «більш»</th><th>найвищий: «най-»</th></tr>
<tr><td>один склад: -er / the -est</td><td>[[cheap]], [[fast]]</td><td>[[cheaper]], [[faster]]</td><td>[[the cheapest]], [[the fastest]]</td></tr>
<tr><td>закінчується на -e: +r / +st</td><td>[[safe]], [[nice]]</td><td>[[safer]], [[nicer]]</td><td>[[the safest]], [[the nicest]]</td></tr>
<tr><td>короткий голосний + приголосний: подвоєння</td><td>[[big]], [[hot]], [[thin]]</td><td>[[bigger]], [[hotter]], [[thinner]]</td><td>[[the biggest]], [[the hottest]]</td></tr>
<tr><td>два склади на -y: -ier / -iest</td><td>[[busy]], [[easy]], [[noisy]]</td><td>[[busier]], [[easier]], [[noisier]]</td><td>[[the busiest]], [[the easiest]]</td></tr>
<tr><td>два склади й більше: more / the most</td><td>[[modern]], [[expensive]], [[comfortable]]</td><td>[[more modern]], [[more expensive]]</td><td>[[the most modern]], [[the most expensive]]</td></tr></table></div>
<p>Порівнюємо за допомогою [[than]] — «ніж, за»: [[Bratislava is smaller than Kyiv.]] — Братислава менша за Київ. [[A taxi is more expensive than a bus.]] [[This flat is quieter than the old one.]] — Ця квартира тихіша, ніж стара.</p>
<p>Найвищий ступінь — з артиклем [[the]]; після нього часто [[in]] (місце, група) або [[of]]: [[It's the cheapest hotel in the city.]] [[This is the most comfortable chair in the office.]] [[It was the best day of my life.]] — Це був найкращий день у моєму житті.</p>
<div class="tip"><b>Двоскладові прикметники.</b> Деякі беруть -er: [[quiet]] → [[quieter]], [[narrow]] → [[narrower]], [[simple]] → [[simpler]]. Але на -ful, -ing, -ed, -ous — завжди more: [[more useful]], [[more boring]], [[more crowded]], [[more famous]]. А з трьома й більше складами -er неможливе: не «expensiver», а [[more expensive]].</div>
<h3>Неправильні форми</h3>
<div class="tblwrap"><table><tr><th>звичайний</th><th>вищий</th><th>найвищий</th></tr>
<tr><td>[[good]] — добрий</td><td>[[better]] — кращий</td><td>[[the best]] — найкращий</td></tr>

<tr><td>[[far]] — далекий</td><td>[[further]] / [[farther]] — дальший</td><td>[[the furthest]] / [[the farthest]]</td></tr>
<tr><td>[[much]] / [[many]] — багато</td><td>[[more]] — більше</td><td>[[the most]] — найбільше</td></tr>
<tr><td>[[little]] — мало</td><td>[[less]] — менше</td><td>[[the least]] — найменше</td></tr></table></div>
<p>Прислівник [[well]] (добре) теж дає [[better]] і [[best]]: [[She speaks English better than me.]] — Вона говорить англійською краще за мене.</p>

<div class="tip"><b>further чи farther?</b> Про відстань годяться обидва: [[The station is further than I thought.]] — Вокзал далі, ніж я думав. Британці частіше кажуть [[further]], американці — [[farther]]. У значенні «додатковий, подальший» — лише [[further]]: [[further information]], [[for further details]].</div>
<h3>as … as — «такий самий, як»</h3>
<p>[[as]] + звичайна форма прикметника + [[as]]: [[My flat is as big as yours.]] — Моя квартира така сама велика, як твоя. [[He's as tall as his father.]]</p>
<p>Заперечення — «не такий … як»: [[The bus isn't as fast as the train.]] = [[The train is faster than the bus.]] [[It's not as expensive as I thought.]] — Це не так дорого, як я думав.</p>
<h3>than me чи than I am?</h3>
<p>У розмові після [[than]] і [[as]] вживають об'єктний займенник: [[She's taller than me.]] [[He's as old as me.]] Формальніше — з дієсловом: [[She's taller than I am.]] Обидва варіанти правильні; [[than I]] без дієслова звучить надто книжно.</p>

<div class="note"><b>⚠️ Не «very cheaper».</b> [[very]] стоїть лише перед звичайною формою: [[very cheap]]. Перед вищим ступенем — [[much]], [[a lot]], [[a bit]]: [[much cheaper]].</div>
<h3>too і enough — «занадто» і «досить»</h3>
<p>[[too]] стоїть <b>перед</b> прикметником: [[It's too expensive.]] — Це занадто дорого. [[The flat is too small for us.]] [[I'm too tired to cook.]] — Я надто втомлений, щоб готувати.</p>

  theory: `
<h3>Чотири способи сказати про майбутнє</h3>
<p>В українській майбутній час один: «зроблю», «буду робити». В англійській форму вибирають за тим, <b>що саме</b> ви кажете: думку-прогноз, рішення, план чи домовленість.</p>
<div class="tblwrap"><table><tr><th>форма</th><th>коли</th><th>приклад</th></tr>
<tr><td>[[will]] + дієслово</td><td>рішення просто зараз, обіцянка, пропозиція, прогноз-думка</td><td>[[I'll help you.]] [[I think it will rain.]]</td></tr>
<tr><td>[[be going to]] + дієслово</td><td>план, намір (вирішено раніше); прогноз за видимими ознаками</td><td>[[I'm going to learn to drive.]] [[Look at the clouds! It's going to rain.]]</td></tr>
<tr><td>Present Continuous</td><td>домовленість: є час, місце, інші люди, квитки</td><td>[[I'm seeing the dentist on Friday.]]</td></tr>
<tr><td>Present Simple</td><td>розклад, графік</td><td>[[The train leaves at six.]]</td></tr></table></div>
<h3>will — рішення зараз, обіцянки, пропозиції, прогнози</h3>
<p>Форма однакова для всіх осіб: [[will]] + дієслово без to; скорочено <b>'ll</b>: [[I'll]], [[she'll]], [[we'll]]; заперечення [[won't]] = will not.</p>
<ul><li>Рішення в момент мовлення: [[It's cold. I'll close the window.]] [[I'll have the soup, please.]] — Мені суп, будь ласка (замовлення).</li>
<li>Обіцянка: [[I'll call you tomorrow.]] [[I won't tell anyone.]] — Я нікому не скажу.</li>
<li>Пропозиція допомоги: [[I'll carry your bag.]] — Я понесу твою сумку.</li>
<li>Прогноз-думка: [[I think you'll like it.]] [[I'm sure they won't be late.]]</li></ul>
<div class="tip"><b>Вимова:</b> [[I'll]] /aɪl/ — один склад. [[won't]] /wəʊnt/ (US /woʊnt/) — з дифтонгом ≈ «оу»; не плутайте з [[want]] /wɒnt/ — хотіти: [[I won't go.]] — Я не піду. [[I want to go.]] — Я хочу піти.</div>
<h3>be going to — план і прогноз «за ознаками»</h3>
<p>Рішення ухвалене <b>до</b> розмови: [[We're going to buy a new car.]] — Ми збираємося купити нову машину. [[What are you going to do this weekend?]] [[I'm not going to work late today.]]<br>
Прогноз, коли ми <b>бачимо</b> причину: [[Be careful! You're going to fall!]] — Обережно! Ти зараз упадеш!</p>
<div class="tip"><b>will чи going to?</b> [[I'll call him.]] — вирішив щойно, у момент розмови. [[I'm going to call him.]] — вирішив раніше, це вже мій план. У розмові going to часто звучить як [[gonna]]: так кажуть, але не пишуть у робочих листах.</div>
<h3>Present Continuous — домовленості</h3>
<p>Коли все вже домовлено: є час, місце, квитки, запис. [[I'm flying to London on Monday.]] — У понеділок я лечу до Лондона. [[We're having a meeting at ten.]] [[What are you doing tonight?]] — Що робиш сьогодні ввечері? (Які в тебе плани?)</p>
<h3>Present Simple — розклад</h3>
<p>Розклади транспорту, графіки, програми заходів: [[The train leaves at six fifteen.]] [[The conference starts on Monday.]] [[The shop opens at nine.]] [[What time does the film start?]]</p>
<div class="note"><b>⚠️ «Через годину» — in an hour.</b> «Через» про час — це [[in]]: [[in an hour]], [[in two days]], [[in a week]]. [[after an hour]] означає «після того, як мине година» (про минуле чи послідовність), а не «через годину від цієї хвилини». [[I'll be back in ten minutes.]] — Повернуся через десять хвилин.</div>
<h3>may / might — можливо</h3>
<p>[[may]] і [[might]] + дієслово без to — «можливо, …»: [[I may be late.]] — Можливо, я запізнюся. [[It might rain tomorrow.]] — Завтра, може, буде дощ. [[We might not go.]] — Можливо, ми не підемо. Різниця мінімальна; [[might]] трохи менш певне й частіше звучить у розмові.</p>
<div class="note"><b>⚠️ Не змішуйте maybe і will в одну кашу.</b> «Можливо, я прийду» — [[Maybe I'll come.]] або [[I might come.]] Не «I maybe will come» і не «I might will come»: після may / might — дієслово без [[will]] і без [[to]].</div>
<h3>probably, definitely — наскільки ви впевнені</h3>
<div class="tblwrap"><table><tr><th>упевненість</th><th>приклад</th></tr>
<tr><td>100%</td><td>[[I'll definitely come.]] — Я точно прийду.</td></tr>
<tr><td>≈ 80%</td><td>[[I'll probably come.]] — Я, мабуть, прийду.</td></tr>
<tr><td>≈ 50%</td><td>[[I might come.]] / [[Maybe I'll come.]] — Може, прийду.</td></tr>
<tr><td>≈ 20%</td><td>[[I probably won't come.]] — Я, мабуть, не прийду.</td></tr>
<tr><td>0%</td><td>[[I definitely won't come.]] — Я точно не прийду.</td></tr></table></div>
<div class="note"><b>⚠️ Порядок слів:</b> у ствердженні probably / definitely стоять <b>після</b> will: [[I'll probably…]]; у запереченні — <b>перед</b> won't: [[I probably won't…]] (не «I won't probably»).</div>
<h3>Shall I…? Shall we…? — пропозиції</h3>
<p>[[Shall I open the window?]] — Відчинити вікно? [[Shall I call you a taxi?]] — Викликати вам таксі? [[Shall we meet at six?]] — Зустрінемося о шостій? [[What shall we do tonight?]] — Що робитимемо ввечері?</p>
<div class="good">US / UK: [[Shall I…?]] — більше британське; американці частіше питають [[Should I…?]] або [[Do you want me to…?]], а замість [[Shall we…?]] кажуть [[Let's…]] чи [[Do you want to…?]] Відпустка — [[holiday]] (UK) / [[vacation]] (US): [[I'm going on holiday next week.]] = [[I'm going on vacation next week.]]</div>
<h3>Бронювання й домовленості</h3>
<p>[[I'd like to book a table for two.]] — Я хотів би забронювати столик на двох.<br>
[[I have an appointment with the doctor on Monday.]] — У мене запис до лікаря в понеділок.<br>

  theory: `
<h3>must і have to — «мусити, треба»</h3>
<div class="tblwrap"><table><tr><th></th><th>ствердження</th><th>заперечення</th><th>питання</th></tr>
<tr><td>must</td><td>[[I must go.]]</td><td>[[You mustn't smoke here.]] — не можна!</td><td>[[Must I…?]] (рідко)</td></tr>
<tr><td>have to</td><td>[[I have to go.]] [[She has to work.]]</td><td>[[You don't have to come.]] — не обов'язково</td><td>[[Do I have to…?]] [[Does she have to…?]]</td></tr></table></div>
<p>Після [[must]] — дієслово без to: [[I must go]] (не «must to go»). [[have to]] уже містить to і змінюється як звичайне дієслово: [[he has to]], [[do you have to]], [[she doesn't have to]].</p>
<p><b>must</b> — обов'язок, який відчуває сам мовець, а також письмові правила й інструкції: [[I must call my mum.]] — Мушу подзвонити мамі (я сам так вирішив). [[Passengers must wear seat belts.]] — Пасажири мусять пристебнутися. [[You must show your ID.]]</p>
<p><b>have to</b> — обов'язок ззовні: правила, закон, начальник, обставини: [[I have to wear a uniform at work.]] [[We have to pay the rent by Friday.]] [[Do you have to work on Saturdays?]] — Тобі доводиться працювати в суботу?</p>
<div class="good">У розмові різниця між must і have to невелика, і [[have to]] звучить значно частіше. Якщо сумніваєтеся — кажіть [[have to]].</div>
<h3>Минуле й майбутнє — лише have to</h3>
<p>У [[must]] немає форм минулого й майбутнього, тож: [[I had to wait for an hour.]] — Мені довелося чекати годину. [[Did you have to pay?]] — Тобі довелося платити? [[You'll have to fill in this form.]] — Вам доведеться заповнити цю форму.</p>
<div class="note"><b>⚠️ Головна пастка: mustn't ≠ don't have to.</b><br>
[[You mustn't park here.]] — Тут <b>не можна</b> паркуватися (заборонено).<br>
[[You don't have to park here.]] — Тут паркуватися <b>не обов'язково</b> (можна деінде — як хочете).<br>
[[You mustn't tell him.]] — Не смій йому казати. [[You don't have to tell him.]] — Можеш йому не казати.</div>
<div class="note"><b>⚠️ «Мені треба» — з підметом.</b> Українське безособове «мені треба», «мені потрібно» англійською будується від особи: [[I have to go.]] / [[I need to go.]] — Мені треба йти. [[Do you need help?]] — Тобі потрібна допомога? [[She needs a new phone.]] — Їй потрібен новий телефон. ([[need]] + іменник або [[need to]] + дієслово.)</div>
<div class="tip"><b>Вимова:</b> [[have to]] звучить /ˈhæf tə/ — з «ф», [[has to]] — /ˈhæs tə/. У [[mustn't]] /ˈmʌsnt/ перше t не вимовляється.</div>
<h3>should — порада</h3>
<p>[[should]] / [[shouldn't]] + дієслово без to — «варто / не варто, слід / не слід»: [[You should see a doctor.]] — Тобі варто піти до лікаря. [[You shouldn't eat so much sugar.]] — Не варто їсти стільки цукру. [[Should I take an umbrella?]] — Брати парасольку? [[What should I do?]] — Що мені робити?</p>
<p>Порада м'якша за обов'язок: [[You must stop smoking.]] — так суворо каже лікар; [[You should stop smoking.]] — дружня порада.</p>

<h3>Будова: if + Present Simple, will + дієслово</h3>
<p>Перший умовний (first conditional) — про <b>реальну</b> умову в майбутньому: що станеться, якщо… [[If it rains, we'll stay at home.]] — Якщо піде дощ, ми залишимося вдома.</p>
<div class="tblwrap"><table><tr><th>умова: if + Present Simple</th><th>результат: will / won't + дієслово</th></tr>
<tr><td>[[If you leave now,]]</td><td>[[you'll catch the train.]]</td></tr>

<tr><td>[[If you sign the contract today,]]</td><td>[[you can move in on Monday.]]</td></tr></table></div>
<p>Частини можна міняти місцями. Коли if стоїть у другій частині, кома не потрібна: [[We'll stay at home if it rains.]] [[I'll call you if I have time.]]</p>
<p>Питання: [[What will you do if they don't give you the deposit back?]] — Що ти робитимеш, якщо тобі не повернуть заставу?</p>

<h3>Те саме правило після when, as soon as, before, after, until</h3>
<p>Після цих сполучників часу про майбутнє теж уживаємо Present Simple, а will — лише в другій частині:</p>

<li>[[after]] — після того як: [[After we move in, we'll buy a new sofa.]] — Коли в'їдемо, купимо новий диван.</li>

<div class="tip"><b>if чи when?</b> [[If I see Tom, I'll tell him.]] — можливо, побачу, а можливо, й ні. [[When I see Tom, I'll tell him.]] — точно побачу (наприклад, завтра на роботі), питання лише коли.</div>
<h3>unless — «якщо не»</h3>
<p>[[unless]] = [[if … not]]: [[We'll be late unless we hurry.]] = [[We'll be late if we don't hurry.]] — Ми запізнимося, якщо не поквапимося. [[The landlord won't fix it unless you call him.]] Після unless дієслово стверджувальне: не «unless we don't hurry».</p>
<h3>if + наказовий спосіб; can, might, should</h3>
<p>Інструкції й прохання: [[If you see him, call me.]] — Якщо побачиш його, подзвони мені. [[If you have any questions, let me know.]] — Якщо будуть питання, дайте знати (дуже часто в листах!). [[If the alarm goes off, leave the building.]] — Якщо спрацює сигналізація, залиште будівлю.</p>
<p>У результаті можуть стояти й модальні дієслова: [[If you're free tomorrow, we can meet.]] [[If it's urgent, you should call a plumber.]] [[If we leave late, we might miss the train.]]</p>

  id: 'a2-7', stage: 'a2', num: 'A2.7', title: 'Кількість і неозначені слова: a few, a little, someone, anything', dur: '2 тижні',
  goals: ['говорити про кількість: much, many, a lot of, too much, too many, enough', 'розрізняти a few / a little (трохи, і цього досить) і few / little (мало)', 'вживати someone, anything, nobody, everywhere та інші неозначені слова', 'будувати заперечення без подвійного заперечення: I don\'t know anything'],
  theory: `
<h3>much, many, a lot of</h3>
<div class="tblwrap"><table><tr><th></th><th>злічувані (plates, eggs, people)</th><th>незлічувані (water, money, time)</th></tr>
<tr><td>питання й заперечення</td><td>[[How many eggs do we need?]] [[There aren't many chairs.]]</td><td>[[How much milk is there?]] [[I don't have much time.]]</td></tr>
<tr><td>ствердження (у розмові)</td><td>[[We've got a lot of plates.]] / [[lots of plates]]</td><td>[[I drink a lot of water.]] / [[lots of water]]</td></tr></table></div>
<p>[[a lot of]] і [[lots of]] годяться всюди й з обома видами іменників. [[much]] у ствердженні звучить книжно: замість «I have much work» кажуть [[I have a lot of work.]]</p>
<div class="tip">Без іменника — просто [[a lot]], без of: [[Thanks a lot!]] [[I cook a lot.]] — Я багато готую.</div>
<h3>a few, a little — «кілька, трохи»</h3>
<div class="tblwrap"><table><tr><th></th><th>злічувані</th><th>незлічувані</th></tr>
<tr><td>трохи, кілька (і цього досить)</td><td>[[a few]]: [[We've got a few eggs. Let's make an omelette.]]</td><td>[[a little]]: [[There's a little milk left.]]</td></tr>
<tr><td>мало (недостатньо)</td><td>[[few]]: [[Few people know this recipe.]]</td><td>[[little]]: [[We have very little time.]]</td></tr></table></div>
<div class="note"><b>⚠️ Одна літера «a» змінює зміст.</b> [[a few friends]] — кілька друзів (добре), [[few friends]] — мало друзів (сумно). У розмові «мало» частіше кажуть через [[not many]] / [[not much]]: [[I haven't got many friends here.]] [[There isn't much time.]]</div>
<p>«Трохи» без іменника: [[Can I have a little?]] — Можна мені трохи? [[Just a few, please.]] — Лише кілька, будь ласка.</p>
<h3>too much, too many, enough</h3>
<p>[[too many]] + злічувані: [[There are too many dishes in the sink.]] — У мийці забагато посуду. [[too much]] + незлічувані: [[You put too much salt in the soup.]] — Ти поклав у суп забагато солі. [[enough]] — перед іменником: [[We haven't got enough plates.]] [[Is there enough rice for everyone?]]</p>
<h3>some, any, no</h3>
<p>[[some]] — у ствердженнях, проханнях і пропозиціях: [[I bought some bread.]] [[Can I have some water?]] [[Would you like some tea?]]<br>
[[any]] — у запереченнях і питаннях: [[We don't have any eggs.]] [[Is there any milk?]]<br>
[[no]] = [[not any]]: [[There's no milk.]] = [[There isn't any milk.]] — Молока немає.</p>
<h3>someone, anything, nowhere… — неозначені слова</h3>
<div class="tblwrap"><table><tr><th></th><th>люди (-one / -body)</th><th>речі (-thing)</th><th>місця (-where)</th></tr>
<tr><td>some-</td><td>[[someone]] / [[somebody]] — хтось</td><td>[[something]] — щось</td><td>[[somewhere]] — десь, кудись</td></tr>
<tr><td>any-</td><td>[[anyone]] / [[anybody]] — хтось? (питання); нікого (з not)</td><td>[[anything]] — щось? (питання); нічого (з not)</td><td>[[anywhere]] — десь? (питання); ніде (з not)</td></tr>
<tr><td>no-</td><td>[[no one]] / [[nobody]] — ніхто</td><td>[[nothing]] — ніщо, нічого</td><td>[[nowhere]] — ніде, нікуди</td></tr>
<tr><td>every-</td><td>[[everyone]] / [[everybody]] — усі</td><td>[[everything]] — усе</td><td>[[everywhere]] — скрізь</td></tr></table></div>
<p>[[Someone is at the door.]] — Хтось біля дверей. [[Is anyone at home?]] — Є хтось удома? [[I can't find my keys anywhere.]] — Я ніде не можу знайти ключі. [[Everything is ready.]] — Усе готово. [[Nobody washed the dishes.]] — Ніхто не помив посуд.</p>
<p>-one і -body рівнозначні. Після цих слів дієслово стоїть в однині: [[Everyone is here.]] (не «are»), [[Nobody knows.]] — Ніхто не знає.</p>
<div class="note"><b>⚠️ Головне: в англійському реченні лише ОДНЕ заперечення!</b> Українською кажемо «Я <b>нічого не</b> знаю», «<b>Ніхто нікому не</b> сказав» — і це норма. В англійській подвійне заперечення — помилка (або грубе просторіччя):<br>
✅ [[I don't know anything.]] = ✅ [[I know nothing.]] — ❌ «I don't know nothing».<br>
✅ [[I didn't see anyone.]] = ✅ [[I saw no one.]] — Я нікого не бачив.<br>
✅ [[We didn't go anywhere.]] = ✅ [[We went nowhere.]] — Ми нікуди не ходили.<br>
<b>Правило:</b> є not (don't, didn't, can't, haven't…) → далі слово з any-. Немає not → слово з no-. На початку речення — лише no-слово: [[Nobody called.]] — Ніхто не дзвонив (не «Anybody didn't call»).</div>
<div class="tip">У розмові [[I don't know anything.]] звучить природніше; [[I know nothing.]] — із притиском, драматично. Коротка відповідь — одним словом: [[What did you buy? — Nothing.]] [[Who called? — No one.]]</div>
<p>Пропозиції й прохання: [[Would you like something to drink?]] — Хочете чогось випити? [[Do you need anything?]] — Тобі щось потрібно? [[Anything else?]] — Ще щось? (у магазині, кафе). У ствердженні any- означає «будь-який»: [[Sit anywhere you like.]] — Сідайте будь-де. [[Anyone can cook this.]] — Будь-хто може це приготувати.</p>
<h3>Хатні справи й кухня</h3>
<p>[[I do the housework on Saturdays.]] — Я прибираю по суботах.<br>
[[Can you do the dishes?]] / [[Can you do the washing-up?]] (UK) — Помиєш посуд?<br>

[[Take out the rubbish!]] (UK) / [[Take out the garbage!]] / [[Take out the trash!]] (US) — Винеси сміття!</p>
<div class="note"><b>⚠️ do чи make?</b> Хатні справи — здебільшого з [[do]]: [[do the housework]], [[do the dishes]], [[do the laundry]], [[do the cooking]]. Але [[make the bed]] — застелити ліжко, [[make dinner]] — приготувати вечерю, [[make a mess]] — розкидати речі, наробити безладу.</div>

<script>
/* A2, частина 2: уроки A2.8–A2.13. Формат: c — o[0] правильний; i/l — a: рядок або масив; o — a: речення або масив */

{
  id: 'a2-8', stage: 'a2', num: 'A2.8', title: 'Герундій чи інфінітив: enjoy doing, want to do', dur: '2 тижні',
  goals: ['правильно вибирати після дієслова to + інфінітив чи -ing (want to go, enjoy going)', 'називати мету через to: I came to help (а не «for help»)',
    'вживати -ing після прийменника і як підмет: good at cooking, Swimming is healthy', 'говорити про навчання, звички й цілі'],
  theory: `
<h3>Два «хвости» після дієслова</h3>
<p>Коли одне дієслово тягне за собою інше, англійська вимагає певної форми другого: або <b>to + інфінітив</b> ([[to learn]]), або <b>герундій</b> — форму на <b>-ing</b> ([[learning]]). Українською в обох випадках буде інфінітив («хочу вчити», «люблю вчити»), тому форму доводиться запам'ятовувати разом із дієсловом — парою.</p>
<p>[[I want to learn English.]] — Я хочу вчити англійську. [[I enjoy learning English.]] — Мені подобається вчити англійську.</p>
<h3>Дієслово + to + інфінітив</h3>
<div class="tblwrap"><table><tr><th>дієслово</th><th>приклад</th><th>переклад</th></tr>
<tr><td>[[want]] — хотіти</td><td>[[I want to improve my English.]]</td><td>Я хочу покращити англійську.</td></tr>
<tr><td>[[need]] — потребувати</td><td>[[You need to practise every day.]]</td><td>Тобі треба практикуватися щодня.</td></tr>
<tr><td>[[decide]] — вирішити</td><td>[[She decided to take a course.]]</td><td>Вона вирішила записатися на курс.</td></tr>
<tr><td>[[plan]] — планувати</td><td>[[We're planning to move next year.]]</td><td>Ми плануємо переїхати наступного року.</td></tr>
<tr><td>[[hope]] — сподіватися</td><td>[[I hope to pass the exam.]]</td><td>Сподіваюся скласти іспит.</td></tr>
<tr><td>[[agree]] — погодитися</td><td>[[He agreed to help me.]]</td><td>Він погодився мені допомогти.</td></tr>
<tr><td>[[promise]] — обіцяти</td><td>[[I promise to be on time.]]</td><td>Обіцяю не запізнитися.</td></tr>
<tr><td>[[learn]] — навчитися</td><td>[[My son is learning to swim.]]</td><td>Мій син учиться плавати.</td></tr>
<tr><td>[[manage]] — зуміти, встигнути</td><td>[[I managed to finish everything.]]</td><td>Я встиг усе закінчити.</td></tr>
<tr><td>[[would like]] — хотів би</td><td>[[I'd like to book a table.]]</td><td>Я хотів би забронювати столик.</td></tr></table></div>
<p>Ці дієслова здебільшого дивляться <b>вперед</b>: намір, план, бажання, обіцянка. Заперечення — <b>not перед to</b>: [[I decided not to go.]] — Я вирішив не йти.</p>
<h3>Дієслово + -ing</h3>
<div class="tblwrap"><table><tr><th>дієслово</th><th>приклад</th><th>переклад</th></tr>
<tr><td>[[enjoy]] — отримувати задоволення</td><td>[[I enjoy reading in English.]]</td><td>Мені подобається читати англійською.</td></tr>
<tr><td>[[mind]] — заперечувати (у питаннях)</td><td>[[Do you mind waiting a minute?]]</td><td>Ви не проти хвилинку почекати?</td></tr>
<tr><td>[[finish]] — закінчити</td><td>[[Have you finished writing the report?]]</td><td>Ти вже дописав звіт?</td></tr>
<tr><td>[[avoid]] — уникати</td><td>[[Try to avoid making the same mistake.]]</td><td>Намагайся не робити тієї самої помилки.</td></tr>
<tr><td>[[suggest]] — пропонувати</td><td>[[She suggested taking a break.]]</td><td>Вона запропонувала зробити перерву.</td></tr>
<tr><td>[[keep]] — продовжувати; раз у раз</td><td>[[Keep practising!]] [[He keeps making the same mistake.]]</td><td>Не зупиняйся! Він раз у раз робить ту саму помилку.</td></tr>
<tr><td>[[practise]] — тренувати</td><td>[[Practise speaking every day.]]</td><td>Тренуйте мовлення щодня.</td></tr>
<tr><td>[[can't stand]] — терпіти не можу</td><td>[[I can't stand waiting in queues.]]</td><td>Терпіти не можу стояти в чергах.</td></tr>
<tr><td>[[miss]] — сумувати за</td><td>[[I miss walking by the sea.]]</td><td>Мені бракує прогулянок біля моря.</td></tr></table></div>
<div class="note">⚠️ <b>Найчастіша помилка:</b> «I enjoy to read», «I suggest to go», «Do you mind to wait?». Після enjoy, mind, finish, avoid, suggest, keep, practise, can't stand, miss — лише <b>-ing</b>: [[I enjoy reading.]] [[I suggest going by train.]] [[Do you mind waiting?]]</div>
<div class="tip"><b>US / UK:</b> черга — [[queue]] (брит.) і [[line]] (амер.): [[I can't stand waiting in line.]]</div>
<h3>Можна і так, і так</h3>

<p>В офіційному стилі кажуть [[in order to]]: [[We start early in order to finish on time.]] — Ми починаємо рано, щоб закінчити вчасно.</p>

<h3>Хто? Що? Де? — означальні підрядні речення</h3>
<p><b>Означальне підрядне речення</b> (defining relative clause) уточнює, <b>про кого чи про що саме</b> йдеться. Українською воно починається з «який, яка, що, де, чий». Англійською слово залежить від того, <b>людина це, річ чи місце</b>:</p>
<div class="tblwrap"><table><tr><th>слово</th><th>для чого</th><th>приклад</th></tr>
<tr><td>[[who]]</td><td>люди</td><td>[[The woman who lives next door is a doctor.]] — Жінка, яка живе поруч, — лікарка.</td></tr>
<tr><td>[[which]]</td><td>речі, тварини</td><td>[[The bus which goes to the airport is number 61.]] — Автобус, що їде в аеропорт, — 61-й.</td></tr>
<tr><td>[[that]]</td><td>і люди, і речі (частіше в розмові)</td><td>[[The phone that I bought is great.]] [[The man that called you is here.]]</td></tr>
<tr><td>[[where]]</td><td>місця</td><td>[[This is the café where we met.]] — Це кафе, де ми познайомилися.</td></tr>
<tr><td>[[whose]]</td><td>чий (належність)</td><td>[[I have a neighbour whose dog barks all night.]] — У мене є сусід, чий собака гавкає всю ніч.</td></tr></table></div>
<div class="note">⚠️ <b>Не «what».</b> Українське «що» підштовхує сказати «the book what I read». Так не можна: [[the book that I read]] або [[the book which I read]].</div>
<div class="note">⚠️ <b>Не дублюйте прийменник із where:</b> [[the house where I live]] або [[the house that I live in]], але не «the house where I live in».</div>
<h3>Коли who / which / that можна пропустити</h3>
<p>Подивіться, що стоїть одразу після займенника:</p>
<ul><li><b>новий підмет</b> (I, you, we, my friend…) — займенник є <b>додатком</b>, і в розмові його зазвичай пропускають: [[The film that we watched was boring.]] = [[The film we watched was boring.]] [[The man who I met yesterday is Canadian.]] = [[The man I met yesterday is Canadian.]]</li>
<li><b>дієслово</b> — займенник є <b>підметом</b>, без нього не можна: [[The man who called you is here.]] (не «The man called you is here»).</li></ul>
<div class="good">Не впевнені — не пропускайте: речення з [[that]] завжди правильне. Пропуск — лише звичка живої мови.</div>
<p>Книжна форма додатка — [[whom]]: [[the person whom I met]]. У розмові замість неї кажуть [[who]], [[that]] або нічого.</p>

<div class="note">⚠️ В українській підрядне речення завжди виділяють комами: «Жінка, яка живе поруч, — лікарка». В англійській <b>означальне</b> речення, яке вказує, про кого саме йдеться, комами <b>не виділяють</b>: [[The woman who lives next door is a doctor.]] Коми бувають лише в реченнях-поясненнях на кшталт [[My mother, who lives in Kyiv, is a teacher.]] — це рівень B1.</div>
<h3>Зовнішність: What does she look like?</h3>
<p>[[What does she look like?]] — Як вона виглядає? (зовнішність). [[What is she like?]] — Яка вона? (характер). [[Who does he look like?]] — На кого він схожий? — [[He looks like his father.]]</p>
<div class="note">⚠️ Не «How does she look like?» — або [[What does she look like?]], або без like. А [[How does she look?]] питає радше про її вигляд зараз (втомлена, весела, гарно вбрана), а не про зовнішність загалом.</div>
<div class="tblwrap"><table><tr><th>що описуємо</th><th>слова</th></tr>
<tr><td>зріст, статура</td><td>[[tall]] — високий, [[short]] — низький, [[medium height]] — середнього зросту, [[slim]] — стрункий, [[overweight]] — повний (ввічливо)</td></tr>
<tr><td>волосся</td><td>[[short hair]], [[long hair]], [[straight hair]] — пряме, [[curly hair]] — кучеряве, [[dark hair]] — темне, [[blond hair]] — світле, [[bald]] — лисий</td></tr>
<tr><td>обличчя</td><td>[[a beard]] — борода, [[a moustache]] — вуса, [[glasses]] — окуляри, [[blue eyes]] — блакитні очі, [[good-looking]] — привабливий</td></tr></table></div>
<p>[[She's tall and slim with long straight hair.]] [[He has short dark hair and a beard.]] [[He wears glasses.]] Порядок прикметників: <b>довжина → форма → колір</b>: [[long curly black hair]].</p>
<div class="note">⚠️ <b>hair — незлічуване</b>, коли йдеться про волосся на голові: [[She has long hair.]] (не «long hairs», не «a long hair»). А [[glasses]] — завжди множина: [[My glasses are new.]]</div>
<div class="tip"><b>US / UK:</b> вуса — [[moustache]] (брит.) і [[mustache]] (амер.). [[She's got blue eyes.]] (частіше брит.) = [[She has blue eyes.]]</div>
<h3>Характер: What is he like?</h3>

<div class="good"><b>Префікси un-, im-</b> працюють як українське «не-»: [[friendly]] → [[unfriendly]], [[polite]] → [[impolite]], [[reliable]] → [[unreliable]].</div>

<div class="tip"><b>Вимова:</b> [[generous]] /ˈdʒenərəs/ (≈ ДЖЕ-не-рес), [[reliable]] /rɪˈlaɪəbl/ (≈ рі-ЛАЙ-е-бл), [[polite]] /pəˈlaɪt/ — наголос на другий склад.</div>

  theory: `
<h3>used to — «раніше…», «колись…»</h3>
<p>[[used to]] + інфінітив описує <b>звички й стани в минулому, яких тепер немає</b>. Українською — «раніше…», «колись…», «бувало».</p>
<p>[[I used to live in Kharkiv.]] — Раніше я жив у Харкові (тепер ні). [[She used to smoke, but she gave up.]] — Колись вона курила, але кинула. [[We used to go to the sea every summer.]] — Ми щоліта їздили на море. [[There used to be a cinema here.]] — Тут колись був кінотеатр.</p>
<div class="tblwrap"><table><tr><th>форма</th><th>схема</th><th>приклад</th></tr>
<tr><td>ствердження</td><td>used to + дієслово</td><td>[[I used to play football.]]</td></tr>
<tr><td>заперечення</td><td>didn't use to + дієслово</td><td>[[I didn't use to like coffee.]]</td></tr>
<tr><td>питання</td><td>Did … use to + дієслово?</td><td>[[Did you use to have long hair?]]</td></tr>
<tr><td>коротка відповідь</td><td>did / didn't</td><td>[[Yes, I did.]] / [[No, I didn't.]]</td></tr></table></div>
<div class="note">⚠️ <b>Після did — use без -d:</b> [[didn't use to]], [[Did you use to…?]] — так само, як [[didn't go]] (а не «didn't went»). Написання «didn't used to» трапляється навіть у носіїв, але в тестах це помилка.</div>
<div class="tip"><b>Вимова:</b> [[used to]] звучить /ˈjuːstə/ (≈ «юс-те») — з глухим [s], без «д». [[use to]] у запереченні й питанні звучить так само. Послухайте: [[I used to live here.]] [[Did you use to work there?]]</div>
<h3>used to чи Past Simple?</h3>
<p>used to — для <b>повторюваних дій і тривалих станів</b>, яких більше немає. Про <b>одну подію</b> чи точну кількість разів — лише Past Simple:</p>
<p>✓ [[I used to go to the gym three times a week.]] (звичка)<br>✗ I used to go to London in 2019. → ✓ [[I went to London in 2019.]] (одна подія)<br>✗ I used to visit Paris twice. → ✓ [[I visited Paris twice.]]</p>
<div class="note">⚠️ <b>Про теперішні звички used to не вживають.</b> «Я зазвичай встаю о сьомій» — [[I usually get up at seven.]] (не «I use to get up»).</div>
<div class="note">⚠️ <b>get used to — це інше:</b> «звикати (до чогось)». Після нього — іменник або -ing, бо to тут прийменник (як у look forward to, урок A2.8): [[I'm getting used to the cold weather.]] — Я звикаю до холодної погоди. [[I can't get used to getting up early.]] — Не можу звикнути рано вставати. Порівняйте: [[I used to get up early.]] — Раніше я рано вставав.</div>
<h3>Present Perfect + for / since — «як довго»</h3>
<p>Коли дія чи стан <b>почалися в минулому і тривають досі</b>, англійська вживає <b>Present Perfect</b> (have / has + третя форма дієслова), а не теперішній час:</p>
<p>[[I've lived in Bratislava for three years.]] — Я живу в Братиславі три роки. [[She has worked here since 2022.]] — Вона працює тут з 2022 року. [[We've known each other for ages.]] — Ми знайомі цілу вічність. [[He's had this car since he was twenty.]] — Ця машина в нього з двадцяти років.</p>
<div class="note"><b>⚠️ Головна помилка українців.</b> Українською «Я живу тут три роки» — теперішній час, тож хочеться сказати «I live here for three years». Англійською це помилка! Якщо є «скільки часу» чи «відколи» і дія триває досі — <b>Present Perfect</b>:<br>
✗ I live here for three years. → ✓ [[I've lived here for three years.]]<br>
✗ I know him since 2020. → ✓ [[I've known him since 2020.]]<br>
✗ How long do you work here? → ✓ [[How long have you worked here?]]<br>
✗ We are married for ten years. → ✓ [[We've been married for ten years.]]</div>
<h3>for чи since?</h3>
<div class="tblwrap"><table><tr><th></th><th>значення</th><th>приклади</th></tr>
<tr><td><b>for</b></td><td>період: скільки часу</td><td>[[for three years]], [[for two weeks]], [[for a long time]], [[for ages]]</td></tr>
<tr><td><b>since</b></td><td>точка початку: відколи</td><td>[[since 2022]], [[since Monday]], [[since March]], [[since I was a child]], [[since I moved here]]</td></tr></table></div>
<p>Якщо зараз листопад: [[I've lived here for six months.]] = [[I've lived here since May.]]</p>
<div class="note">⚠️ <b>since ≠ ago.</b> «Три роки тому» — [[three years ago]], і це Past Simple: [[I moved here three years ago.]] Ланцюжок: [[I moved here in 2022.]] → [[I've lived here since 2022.]] → [[I've lived here for three years.]]</div>
<h3>Питання How long…?</h3>
<p>[[How long have you lived here?]] — Як довго ви тут живете? — [[For about two years.]] / [[Since 2023.]]<br>[[How long have you known Anna?]] — Скільки ти знаєш Анну? [[How long has she had her dog?]] — Відколи в неї собака?</p>
<div class="tip">Так найчастіше кажуть про <b>стани</b>: live, know, be, have, work. Для тривалих <b>дій</b> на рівні B1 буде Present Perfect Continuous: [[I've been learning English for two years.]]</div>

<h3>Ввічливі прохання</h3>
<p>У робочому спілкуванні англійською прохання майже ніколи не звучить як наказ. Загальне правило: <b>чим довша фраза, тим вона ввічливіша</b>.</p>
<div class="tblwrap"><table><tr><th>фраза</th><th>приклад</th><th>коли</th></tr>

<tr><td>[[Can I…?]] / [[Could I…?]]</td><td>[[Could I ask you a quick question?]]</td><td>просимо дозволу для себе</td></tr>
<tr><td>[[Is it possible to…?]]</td><td>[[Is it possible to move the meeting to Friday?]]</td><td>питаємо про можливість</td></tr>
<tr><td>[[Would you mind…?]] + -ing</td><td>[[Would you mind sending it again?]]</td><td>дуже ввічливо</td></tr>
<tr><td>[[I was wondering if…]]</td><td>[[I was wondering if you could help me.]]</td><td>найм'якше — коли просимо про щось велике</td></tr></table></div>

<h3>Робочий email</h3>

<tr><td>перед підписом</td><td>[[Let me know if you have any questions.]] [[Looking forward to seeing you.]]</td><td>[[I look forward to hearing from you.]]</td></tr>

<p><b>Зразок:</b><br>[[Hi Mark,]]<br>[[I'm writing to confirm our meeting on Thursday at ten.]] [[I've attached the agenda.]]<br>[[Could you please send me the latest figures before the meeting?]]<br>[[Let me know if the time doesn't work for you.]]<br>[[Best regards,]]<br>[[Olena]]</p>

  theory: `
<h3>Форма: have / has been + -ing</h3>
<p>Present Perfect Continuous (теперішній доконано-тривалий час) = [[have been]] / [[has been]] + дієслово із закінченням <b>-ing</b>. Він з'єднує минуле з теперішнім: дія почалася раніше й триває досі або щойно закінчилася.</p>
<div class="tblwrap"><table><tr><th></th><th>ствердження</th><th>заперечення</th><th>питання</th></tr>
<tr><td>I / you / we / they</td><td>[[I've been working.]]</td><td>[[I haven't been working.]]</td><td>[[Have you been working?]]</td></tr>
<tr><td>he / she / it</td><td>[[She's been working.]]</td><td>[[She hasn't been working.]]</td><td>[[Has she been working?]]</td></tr></table></div>
<p>Тут [[she's]] = she <b>has</b>, а не she is: після 's іде been, отже, це has. Короткі відповіді: [[Yes, I have.]] / [[No, she hasn't.]]</p>
<div class="tip"><b>Вимова:</b> [[been]] у реченні ненаголошене й коротке — /bɪn/. Слова зливаються в один потік: [[I've been waiting]] /aɪv bɪn ˈweɪtɪŋ/. Наголос падає на основне дієслово, а не на been.</div>

<h3>1. Як довго: for, since, How long…?</h3>
<p>Головне вживання: дія почалася в минулому, <b>триває досі</b>, і ми кажемо, скільки часу:</p>
<ul><li>[[I've been waiting for an hour.]] — Я чекаю вже годину.</li>
<li>[[We've been working on this project since March.]] — Ми працюємо над цим проєктом з березня.</li>
<li>[[How long have you been learning English?]] — Скільки ви вже вчите англійську?</li>
<li>[[It's been raining all day.]] — Увесь день іде дощ.</li></ul>
<p><b>for</b> + проміжок часу: [[for two years]], [[for a long time]], [[for ages]]. <b>since</b> + точка початку: [[since Monday]], [[since 2020]], [[since I joined the company]]. Також часто: [[all day]], [[all morning]], [[lately]], [[recently]].</p>
<div class="note"><b>⚠️ Головна пастка: українською це теперішній час.</b> «Я <i>працюю</i> тут два роки» — дієслово в теперішньому, але англійською ні Present Simple, ні Present Continuous тут не підходять: не «I work here for two years» і не «I'm working here for two years», а [[I've been working here for two years.]] Так само «Скільки ти вже чекаєш?» → [[How long have you been waiting?]], «Ми знайомі десять років» → [[We've known each other for ten years.]] І «з понеділка» тут — [[since Monday]], а не «from Monday».<br>Правило: <b>є тривалість (for, since, how long), що доходить до «зараз», — потрібен Present Perfect (Continuous)</b>.</div>

<h3>2. Недавня дія, наслідки якої видно зараз</h3>
<p>Дія щойно закінчилася (або ще триває), і ми бачимо її сліди. Тривалість можна не називати:</p>
<ul><li>[[You're out of breath. Have you been running?]] — Ти задихаєшся. Ти бігав?</li>
<li>[[Your eyes are red. Have you been crying?]] — У тебе червоні очі. Ти плакала?</li>
<li>[[Sorry about the mess. I've been painting the kitchen.]] — Вибач за безлад, я фарбував кухню.</li>
<li>[[The ground is wet. It's been raining.]] — Земля мокра. Ішов дощ.</li>
<li>[[I'm exhausted. I've been fixing bugs all day.]] — Я виснажений. Увесь день виправляв баги.</li></ul>
<p>Українською тут зазвичай минулий час («бігав», «фарбував»), але англійською природніше Present Perfect Continuous: нас цікавить не сама подія в минулому, а її зв'язок із тим, що ми бачимо зараз.</p>

<h3>3. Simple чи Continuous?</h3>
<p>Обидва часи з'єднують минуле з теперішнім, але дивляться на дію по-різному:</p>
<div class="tblwrap"><table><tr><th>Present Perfect Simple — <b>результат</b>: що зроблено, скільки</th><th>Present Perfect Continuous — <b>процес</b>: чим займалися, як довго</th></tr>
<tr><td>[[I've written three emails.]] — Я написав три листи.</td><td>[[I've been writing emails all morning.]] — Я весь ранок пишу листи.</td></tr>
<tr><td>[[She's fixed the bug.]] — Вона виправила баг (готово).</td><td>[[She's been fixing the bug.]] — Вона займалася цим багом (можливо, ще не закінчила).</td></tr>
<tr><td>[[How many tasks have you finished?]] — Скільки завдань ти закрив?</td><td>[[How long have you been working on it?]] — Як довго ти над цим працюєш?</td></tr>
<tr><td>[[I've read the report.]] — Я прочитав звіт (до кінця).</td><td>[[I've been reading the report.]] — Я читав звіт (не обов'язково дочитав).</td></tr></table></div>
<div class="tip"><b>Підказка:</b> є число чи кількість (three emails, how many, twice) — Simple. Є тривалість (all day, for hours, how long) з дієсловом дії — переважно Continuous. З дієсловами live, work, study, teach різниця майже зникає: [[I've lived here for five years.]] = [[I've been living here for five years.]]</div>

<h3>4. Дієслова стану — лише Simple</h3>
<p>Дієслова, що описують стан, а не дію, не вживаються з -ing: <b>know, like, love, hate, want, need, believe, understand, mean, belong, own</b>, а також <b>be</b> і <b>have</b> у значенні «мати».</p>
<ul><li>[[I've known her for years.]] — Я знаю її багато років. (не «I've been knowing»)</li>
<li>[[We've had this car since 2019.]] — Ця машина в нас з 2019 року.</li>
<li>[[How long have you been here?]] — Скільки ви вже тут?</li>
<li>[[I've always wanted to visit New York.]] — Я завжди хотів побувати в Нью-Йорку.</li></ul>
<div class="note"><b>⚠️ «Знаю десять років» — теж не Present Simple.</b> «Я знаю його десять років» → [[I've known him for ten years.]], а не «I know him for ten years». «Скільки ти вже тут живеш?» → [[How long have you lived here?]] або [[How long have you been living here?]] (live допускає обидві форми).</div>

<h3>На роботі: статус і прогрес</h3>
<p>Present Perfect Continuous — улюблений час робочих зустрічей (stand-up, status update): він показує, чим ви займалися останнім часом.</p>

  theory: `
<h3>Форма: had + V3</h3>
<p>Past Perfect (минулий доконаний час) = [[had]] + третя форма дієслова (V3, past participle): [[had finished]], [[had left]], [[had seen]]. <b>had</b> однакове для всіх осіб.</p>
<div class="tblwrap"><table><tr><th>ствердження</th><th>заперечення</th><th>питання</th></tr>
<tr><td>[[I had finished.]] / [[I'd finished.]]</td><td>[[She hadn't finished.]]</td><td>[[Had they finished?]]</td></tr></table></div>
<p>Коротке [[I'd]], [[she'd]], [[they'd]] — це і <b>had</b>, і <b>would</b>. Розрізняємо за наступним словом: після had іде V3 ([[I'd seen]] — я бачив раніше), після would — початкова форма ([[I'd see]] — я б побачив).</p>

<h3>Навіщо: «минуле перед минулим»</h3>
<p>Історію розповідаємо в Past Simple, а Past Perfect показує, що щось сталося <b>ще раніше</b>, до того моменту в минулому:</p>
<ul><li>[[When I arrived, the meeting had already started.]] — Коли я прийшов, нарада вже почалася (спершу почалася нарада, потім прийшов я).</li>
<li>[[When I arrived, the meeting started.]] — Коли я прийшов, почалася нарада (я прийшов — і тоді почали).</li></ul>
<p>Одне слово — і зовсім інша історія. Ще приклади:</p>
<ul><li>[[I couldn't get in because I'd lost my keys.]] — Я не міг зайти, бо загубив ключі.</li>
<li>[[She was nervous. She had never flown before.]] — Вона хвилювалася: раніше вона ніколи не літала.</li>
<li>[[By the time the police arrived, the thief had disappeared.]] — Поки приїхала поліція, злодій уже зник.</li>
<li>[[It turned out that he had lied to everyone.]] — Виявилося, що він усім брехав.</li></ul>
<div class="note"><b>⚠️ В українській окремого часу для цього немає.</b> «Коли я прийшов, вони вже пішли» — обидва дієслова в минулому, а порядок подій видно з контексту й слова «вже». Англійською ранішу дію треба «відсунути» далі в минуле: [[When I came, they had already left.]] Якщо сказати «they left», вийде, що вони пішли, коли ви прийшли.</div>
<div class="good"><b>Коли Past Perfect не потрібен.</b> Якщо події йдуть у природному порядку, вистачає Past Simple: [[I locked the door and went to bed.]] Після before / after порядок і так зрозумілий, тому правильні обидва варіанти: [[After I finished work, I went home.]] = [[After I'd finished work, I went home.]] Не вживайте Past Perfect «для солідності» — лише щоб показати, що щось сталося раніше.</div>

<h3>Розповідні часи разом</h3>
<div class="tblwrap"><table><tr><th>час</th><th>роль в історії</th><th>приклад</th></tr>
<tr><td>Past Continuous</td><td>фон, декорації: що відбувалося</td><td>[[It was raining, and people were hurrying home.]]</td></tr>

<tr><td>Past Perfect</td><td>передісторія: що сталося ще раніше</td><td>[[Someone had cut the cable.]]</td></tr>
<tr><td>Past Perfect Continuous</td><td>скільки щось тривало до моменту в минулому</td><td>[[We'd been sitting in the dark for an hour when help arrived.]]</td></tr></table></div>
<p>Усе разом: [[I was walking home late one evening when I realised that someone was following me.]] [[I stopped and turned around. It was my neighbour.]] [[Apparently, I had dropped my wallet, and he had been running after me all the way from the shop to give it back.]]</p>
<p class="small muted">Пізно ввечері я йшов додому й раптом зрозумів, що хтось іде за мною. Я зупинився й обернувся. Це був мій сусід. Як виявилося, я впустив гаманець, і він біг за мною аж від магазину, щоб його віддати.</p>

<h3>Past Perfect Continuous: had been + -ing</h3>
<p>Як Present Perfect Continuous з уроку B1.1, тільки відлік іде від моменту в минулому: скільки щось <b>тривало до</b> іншої події.</p>
<ul><li>[[I'd been waiting for an hour when the bus finally came.]] — Я чекав уже годину, коли нарешті приїхав автобус.</li>
<li>[[She was tired because she'd been working all night.]] — Вона була втомлена, бо працювала всю ніч.</li>
<li>[[How long had you been living there before you moved?]] — Скільки ви там прожили, перш ніж переїхати?</li></ul>

<p>В активному стані підмет <b>виконує</b> дію: [[Workers built this bridge in 1890.]] У пасивному підмет <b>зазнає</b> дії: [[This bridge was built in 1890.]] — Цей міст збудували в 1890 році.</p>
<p>Формула завжди одна: <b>be</b> у потрібному часі + <b>V3</b> (третя форма дієслова). Час показує тільки be, а V3 не змінюється.</p>
<div class="tblwrap"><table><tr><th>час</th><th>формула</th><th>приклад</th></tr>
<tr><td>Present Simple</td><td>am / is / are + V3</td><td>[[English is spoken all over the world.]]</td></tr>
<tr><td>Past Simple</td><td>was / were + V3</td><td>[[The bridge was built in 1890.]]</td></tr>
<tr><td>Present Perfect</td><td>has / have been + V3</td><td>[[The report has been sent.]]</td></tr>
<tr><td>Present Continuous</td><td>am / is / are being + V3</td><td>[[The road is being repaired.]]</td></tr>
<tr><td>Past Continuous</td><td>was / were being + V3</td><td>[[The car was being washed when it started to rain.]]</td></tr>
<tr><td>Past Perfect</td><td>had been + V3</td><td>[[By the time we arrived, all the tickets had been sold.]]</td></tr>
<tr><td>will</td><td>will be + V3</td><td>[[The results will be published next week.]]</td></tr>
<tr><td>модальні</td><td>must / can / should + be + V3</td><td>[[The form must be signed.]] [[Tickets can be bought online.]]</td></tr></table></div>
<p>Заперечення й питання будуються так само, як зі звичайним be: [[The email wasn't sent.]] [[Has the contract been signed?]] [[When was the company founded?]] [[Is breakfast included?]]</p>
<div class="note"><b>⚠️ Одна англійська форма — багато українських.</b> Українською пасив передаємо по-різному: «міст <i>збудували</i>», «міст <i>було збудовано</i>», «міст <i>збудований</i>», «документи <i>перевіряються</i> вручну» (дієслово на -ся). Англійською все це — be + V3: [[The bridge was built in 1890.]] [[The documents are checked manually.]] Не губіть <b>be</b>: «The bridge built in 1890» означало б, що міст сам щось будував.</div>

<h3>Коли вживати пасив</h3>
<ul><li><b>Виконавець невідомий, очевидний або неважливий</b>: [[My bike was stolen.]] — Мій велосипед вкрали (хто — невідомо). [[The office is cleaned every evening.]] — Офіс прибирають щовечора.</li>
<li><b>Результат чи процес важливіші за виконавця</b>: [[Every update is tested before the release.]] [[Coffee is grown in Brazil and Colombia.]]</li>
<li><b>Новини</b>: [[Two people were injured in the accident.]] [[A man has been arrested.]] [[The new law was approved yesterday.]]</li>
<li><b>Офіційний стиль, правила, інструкції</b>: [[Smoking is not allowed.]] [[Applications must be submitted by Friday.]] [[You will be contacted by email.]]</li></ul>

<h3>by + виконавець — лише коли це важливо</h3>
<p>[[The Mona Lisa was painted by Leonardo da Vinci.]] — тут виконавець і є головною новиною. А в реченні «My bike was stolen by someone» слова by someone нічого не додають: просто [[My bike was stolen.]] Здебільшого пасивні речення обходяться без by.</p>

<h3>Людина як підмет: I was told, she was offered</h3>
<p>Українське «мені сказали», «нам дали знижку», «їй запропонували роботу» англійською починається з людини: [[I was told to wait.]] — Мені сказали почекати. [[We were given a discount.]] — Нам дали знижку. [[She was offered a job in London.]] — Їй запропонували роботу в Лондоні. Не «To me was told».</p>
<div class="note"><b>⚠️ Не кожне «-ся» — пасив.</b> Дієслова open, close, start, finish, change, sell часто описують дію, що «відбувається сама», і стоять в активному стані: [[The shop opens at nine.]] — Магазин відкривається о дев'ятій. [[The meeting starts at ten.]] — Нарада починається о десятій. [[This book sells well.]] — Ця книжка добре продається.</div>

<h3>get + V3 — розмовний пасив</h3>
